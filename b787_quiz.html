{c:'HYDRAULIC',q:'Hydraulic system에 대한 설명 중 틀린 것은?',o:['The airplane has two independent 5000psi hydraulic systems.','Flight control system components are distributed so that any one hydraulic system can provide adequate airplane controllability.','Hydraulic fluid is supplied to each hydraulic pump from the associated system reservoir.','The reservoirs are pressurized by pump inlet pressure.'],a:3,e:'FCOM 13.20.1. Introduction\nThe airplane has three independent 5000 psi hydraulic systems: left, right, and\ncenter. The hydraulic systems power the :\n• flight controls\n• landing gear\n• leading edge slats\n• nose gear steering\n• thrust reversers\n• trailing edge flaps\nFlight control system components are distributed so that any one hydraulic\nsystem can provide adequate airplane controllability.\nHydraulic fluid is supplied to each hydraulic pump from the associated system\nreservoir.\nThe reservoirs are pressurized by pump outlet pressure.'},
{c:'HYDRAULIC',q:'Hydraulic System에서 the L and R demand pumps가 AUTO position에서 작동하는 조건이 아닌 것은? FCOM 13.20.2',o:['on the ground, for the first five minutes after the first engine is started','from takeoff thrust set to flaps retracted','during descent and landing, from gear down or RA less than 1000 feet, to groundspeed less than 40 knots','thrust reverser operation'],a:0,e:'FCOM 13.20.1. Left and Right Hydraulic System Demand Pumps\nThe pumps are controlled by the ELEC DEMAND L and R pump selectors.\nIn the ON position, the demand pump runs continuously.\nIn the AUTO position, the L and R demand pumps operate under the following\nconditions:\n• system low pressure, or\n• on the ground, for the first three minutes after the second engine is started, or\n• from takeoff thrust set to flaps retracted, or\n• during descent and landing, from gear down or RA less than 1000 feet,\nto groundspeed less than 40 knots, or\n• thrust reverser operation'},
{c:'LANDING GEAR',q:'Assuming the autobrake system was selected to RTO prior to takeoff, and a rejected take off occurs with both thrust levers retarded to idle and the airplane still on the ground, at what groundspeed does the RTO autobrake setting command maximum braking pressure?',o:['Groundspeed is at or below 65 knots.','Groundspeed is above 85 knots','Groundspeed is at or above 90 knots','Groundspeed is at 80 knots'],a:1,e:'FCOM 14.10.2.\nRTO : automatically applies maximum brake pressure when the thrust levers are\nretarded to idle above 85 knots.'},
{c:'LANDING GEAR',q:'How is the landing gear hold in the UP position after retraction?',o:['Over-center struts','Uplocks','A locked door structure','Hydraulic pressure'],a:1,e:'FCOM 14.20.1. Landing Gear Retraction\nTo improve performance, an early doors function automatically pre-opens the main\nlanding gear doors one second after lift-off and prior to the pilot moving the gear lever\nto the UP position. If the pilot does not move the gear lever to UP within 30 seconds, the\nmain gear doors return to the closed position. During a touch-and-go, the early doors\nfunction does not activate until the airplane has been on the ground for more than 30\nseconds.\nWhen the landing gear lever is placed in the UP position the gear retraction sequence is\nstarted. The EICAS landing gear position indication display changes from a green DOWN\nindication to a white crosshatch in-transit indication as the landing gear retract into the wheel\nwells. After retraction, the landing gear are held up by uplocks. The EICAS landing gear\nposition indication changes to UP for 10 seconds and then blanks. With the landing gear ...'},
{c:'LANDING GEAR',q:'What is the limit of nose wheel steering turn when using the rudder pedals?',o:['20º in either direction','70º in either direction','5º in either direction','8º in either direction'],a:3,e:'FCOM 14.10.3.\nRudder/Brake Pedals :\nPush the full pedal – turns the nose wheel up to 8º in either direction.'},
{c:'LANDING GEAR',q:'What powers the landing gear to move to the extended position? FCOM 14.20.2',o:['Gravity powers the gear to free–fall to the down and locked position.','Hydraulic power extends the landing gear.','Electric motors extend the landing gear.','Aerodynamic forces move the gear to extended position'],a:0,e:'FCOM 14.20.2. Landing Gear Extension\nWhen the landing gear lever is moved to DN, the landing gear doors open, the gear are\nunlocked, and the in–transit indication is displayed on the EICAS landing gear position\nindication.\nThe gear free–fall without hydraulic power to the down and locked position. The\ndownlocks are powered to the locked position, all hydraulically actuated gear doors close,\nand the main gear trucks hydraulically tilt to the flight position. When all gear are down and\nlocked, the EICAS gear position indication displays DOWN.\nThe EICAS caution message GEAR DISAGREE is displayed if any gear is not locked down (side\nand drag brace on the same main gear not locked, or nose gear drag brace not locked) after\nthe normal transit time. The EICAS gear position indication changes to the expanded non–\nnormal format, with the affected gear displayed as in transit (or UP if the gear never unlocked\nfrom the up position). ...'},
{c:'LANDING GEAR',q:'Which feature of the brake system monitors the condition of the brakes after Parking Brake application and adjusts the clamping force as needed during brake cooling?',o:['Park and adjust','Adjusted cooling','Brake auto-adjust','Clamp cooling force'],a:0,e:'FCOM 14.20.6. Parking Brake\nThe parking brake is set by fully depressing both brake pedals, pulling the parking brake\nlever up, then releasing the pedals.\nThe parking brake electric actuators are clamped in position during parking brake\napplication and require no active power to maintain the clamping force.\nThe parking brake system has a "park and adjust" feature which monitors the\ncondition of the brakes after application and adjusts the clamping force as needed\nduring brake cooling.\nThe parking brake is released by depressing the pedals until the parking brake lever\nreleases.\nWhen the parking brake is set, the EICAS memo message PARKING BRAKE SET is\ndisplayed.\nIf the parking brake is set and either engine is set to takeoff thrust, the takeoff\nconfiguration aural alert sounds and the EICAS warning message CONFIG PARKING\nBRAKE is displayed.'},
{c:'LANDING GEAR',q:'If the gear is not up and locked after normal transit time what EICAS caution message is displayed? FCOM 14.20.2',o:['GEAR DOOR','GEAR DISAGREE','GEAR DOWN','GEAR CONTROL'],a:1,e:'FCOM 14.20.2. Landing Gear Extension\nWhen the landing gear lever is moved to DN, the landing gear doors open, the gear are\nunlocked, and the in–transit indication is displayed on the EICAS landing gear position\nindication.\nThe gear free–fall without hydraulic power to the down and locked position. The\ndownlocks are powered to the locked position, all hydraulically actuated gear doors close,\nand the main gear trucks hydraulically tilt to the flight position. When all gear are down and\nlocked, the EICAS gear position indication displays DOWN.\nThe EICAS caution message GEAR DISAGREE is displayed if any gear is not locked down (side\nand drag brace on the same main gear not locked, or nose gear drag brace not locked) after\nthe normal transit time. The EICAS gear position indication changes to the expanded non–\nnormal format, with the affected gear displayed as in transit (or UP if the gear never unlocked\nfrom the up position). ...'},
{c:'LANDING GEAR',q:'On the ground during the takeoff run an RTO is initiated. Above what groundspeed will the RTO autobrake setting command maximum braking pressure? FCOM 14.20.4',o:['75Kts','80Kts','90Kts','85Kts'],a:3,e:'FCOM 14.20.5. Rejected Takeoff\nSelecting RTO (rejected takeoff) prior to takeoff arms the autobrake system. The\nRTO mode can be selected only on the ground. The RTO autobrake setting\ncommands maximum braking pressure if:\n• the airplane is on the ground, and\n• groundspeed is above 85 knots, and\n• both thrust levers are retarded to idle\nMaximum braking is obtained in this mode.\nIf an RTO is initiated at or below 85 knots, the RTO autobrake function does\nnot operate.'},
{c:'LANDING GEAR',q:'Which of the following braking actions provide the greatest aircraft deceleration rate on a dry runway in the landing mode? FCOM 14.20.5',o:['Auto brakes selection 1','Auto brakes selection MAX AUTO','Full pedal braking','Auto brakes selection 4'],a:2,e:'FCOM 14.20.5. Landing\nFive levels of deceleration can be selected for landing. On dry runways, the\nmaximum autobrake deceleration rate in the landing mode is less than that\nproduced by full pedal braking.\nAfter landing, autobrake application begins when :\n• both thrust levers are retarded to idle, and\n• the wheels have spun up\nAutobrake application occurs slightly after main gear touchdown.\nIf MAX AUTO is selected, deceleration is limited to the AUTOBRAKE 4 level until\npitch angle is less than one degree, then deceleration is increased to the MAX\nAUTO level.'},
{c:'LANDING GEAR',q:'The autobrake system disarms and the EICAS advisory message AUTOBRAKE 가 displayed 되는 경우가 아닌 것은? FCOM 14.20.5',o:['Pedal braking applied','Either thrust lever advanced after landing','AUTOPILOT fault','Loss of inertial data from the inertial reference units (IRUs)'],a:2,e:'FCOM 14.20.5. Autobrake – Disarm\nThe autobrake system disarms and the EICAS advisory message AUTOBRAKE is\ndisplayed if any of the following occur :\n• pedal braking applied\n• either thrust lever advanced after landing\n• speedbrake lever is moved to the DOWN detent after the speedbrakes have\ndeployed on the ground\n• DISARM or OFF position selected on the AUTOBRAKE selector\n• autobrake fault\n• normal antiskid system fault\n• loss of inertial data from the Inertial Reference Units (IRUs)'},
{c:'LANDING GEAR',q:'Autobrake system이 disarmed 또는 failed시 나타나는 Landing Gear EICAS Messages는?',o:['AUTOBRAKE','BRAKES','ANTISKID','AUTOBRAKE MAX'],a:0,e:'FCOM 14.30.1.\nAUTOBRAKE :\nOne of these occurs :\n• The autobrake system is disarmed\n• The autobrake system is failed'},
{c:'LANDING GEAR',q:'Landing Gear System에 대한 설명 중 잘못된 것은?',o:['Hydraulic power for retraction, extension, and steering is supplied by the center hydraulic system.','An alternate extension system is not provided.','A brake temperature monitor system displays the temperature for each brake on the GEAR synoptic.','A tire pressure monitor system displays pressure for each tire on the GEAR synoptic.'],a:1,e:'FCOM 14.20.1. Introduction\nThe airplane has two main landing gear and a single nose gear. The nose gear is a\nconventional two–wheel steerable unit. Each main gear has four wheels in tandem pairs.\nHydraulic power for retraction, extension, and steering is supplied by the center hydraulic\nsystem.\nAn alternate extension system is also provided.\nThe Electro-Mechanical Brake System has four Electric Brake Actuator Controllers (EBACs)\nand thirty-two Electric Brake Actuators (EBAs), four per wheel brake.\nAutobrake and antiskid protection are provided.\nA brake temperature monitor system displays the temperature for each brake on the\nGEAR synoptic.\nA tire pressure monitor system displays pressure for each tire on the GEAR synoptic.'},
{c:'FLIGHT CONTROL',q:'Which of the following actions are correct if there is a complete loss of flight control signaling? FCOM 9.20.2',o:['The electrically actuated (by remote batteries) stabilizer and two spoiler pairs allow pilot control of pitch and roll using the primary pitch trim switches, alternate pitch trim switches and the control wheel.','Redundant flight control programming in the ACEs is enabled by disconnecting the primary flight computers.','Direct wiring from the flight deck to the stabilizer and a spoiler pair allow pilot control of pitch using the alternate pitch trim switches and roll using the control wheel.','The flight controls are actuated by direct wiring to the hydraulic flight control actuators'],a:2,e:'FCOM 9.20.2. Unique Failure Considerations\nIn the unlikely event of the loss of all hydraulic power, the electrically actuated\nstabilizer and two spoiler pairs allow pilot control of pitch and roll using the\nprimary pitch trim switches, alternate pitch trim switches, and the control wheel.\nIf there is a complete loss of flight control signaling, direct wiring from the\nflight deck to the stabilizer and a spoiler pair allow pilot control of pitch using\nthe alternate pitch trim switches and roll using the control wheel.'},
{c:'FLIGHT CONTROL',q:'When is the autodrag function available during flight?',o:['It operates only in the landing configuration; flaps 25 or 30 and the thrust levers are at idle.','It operates so that flight control surface deflection is removed at 1,000 feet above ground level, for normal flare and touchdown procedures','It is only available in the Non-Normal mode.','Only when below 225KIAS and the flaps are not up'],a:0,e:'FCOM 9.20.23. Autodrag\nThe autodrag function operates by deflecting the ailerons upward and raising the two\nmost outboard spoilers, while maintaining airspeed, to assist in glideslope/glidepath\ncapture when the airplane is on or above the vertical path.\nAutodrag also functions when the aircraft carries out an approach in V/S or FPA mode.\nAutodrag functions only in landing configuration; flaps 25 or 30 and the thrust levers\nare at idle.\nSpoiler and aileron movement is shown on the flight control synoptic.\nThe autodrag surface deflection is gradually removed below 500 feet AGL so flare and\ntouchdown are not affected.\nThe function is active during automatic or manual approaches.\nAutodrag is only available in the normal mode.'},
{c:'FLIGHT CONTROL',q:'Where is one of places the 787 stabilizer trim system trim indication is displayed?',o:['On the auxiliary (AUX) display','On the aft aisle stand','On the control stand','On the EICAS display'],a:3,e:'FCOM 9.20.16. Stabilizer Position Indication and Green Band Monitor\nStabilizer position is displayed on EICAS and on the flight controls synoptic.\nThe EICAS stabilizer position indication includes a takeoff green band.\nThe indication on the synoptic is constantly displayed.\nThe EICAS indication is displayed on the ground at power-up and blanks when\neither of the following conditions are satisfied:\n• gear up for 10 seconds, or\n• 60 seconds after liftoff'},
{c:'FLIGHT CONTROL',q:'Spoilers에 대한 다음 내용 중 잘못된 것은?',o:['There are 7 sets of spoilers, 4 outboard and 3 inboard of the flaperons, on the upper surface of each wing.','All three hydraulic systems supply 5 pairs of spoilers','Spoiler panels are used as speedbrakes to increase drag and reduce lift, in flight only.','The remaining two spoiler pairs are individually powered by two electrical buses.'],a:2,e:'FCOM 9.20.21. Spoilers\nThere are 7 sets of spoilers, 4 outboard and 3 inboard of the flaperons, on the upper surface\nof each wing. The spoilers are numbered from left to right, 1 through 14. Spoilers on opposing\nwings are symmetrically paired.\nSpoiler panels are used as speedbrakes to increase drag and reduce lift, both in flight and on\nthe ground. The spoilers also supplement roll control in response to control wheel commands.\nAll three hydraulic systems supply 5 pairs of spoilers. Each hydraulic system is dedicated to a\ndifferent set of spoiler pairs to provide isolation and maintain symmetric operation in the event of\nhydraulic system failure. The remaining two spoiler pairs are individually powered by two\nelectrical buses.\nThe flight control system automatically biases the spoilers up during engine start and taxi to\nprevent spoiler trailing edges from contacting the flaps.\nFailure of one or two spoiler panels in the air, or failure of one not down and locked spoiler panel ...'},
{c:'FLIGHT CONTROL',q:'Flight Control Mode SECONDARY or DIRECT Indications은 어디에 display 되는가?',o:['It is displayed on the auxiliary (AUX) display panel','It is displayed on the non–normal flight control synoptic','It is displayed on the navigation display panel','It is displayed on the hydraulic synoptic display'],a:1,e:'FCOM 9.10.15.\nNon–Normal Flight Control Synoptic'},
{c:'FLIGHT CONTROL',q:'다음 괄호 안에 들어갈 내용을 고르시오 To protect against inadvertent deployment during cruise, flap and slat extension from the UP position is inhibited when ( ). This inhibit is only available in primary and secondary flap and slat modes. FCOM 9.20.22',o:['Speed is more than 250 KIAS or altitude is above approximately 10,000 feet.','Speed is more than 260 KIAS or altitude is above approximately 15,000 feet.','Speed is more than 260 KIAS or altitude is above approximately 20,000 feet.','Speed is more than 280 KIAS or altitude is above approximately 22,000 feet.'],a:2,e:'FCOM 9.20.23. Flaps and Slats\nThe flaps and slats are high lift devices that increase wing lift and decrease stall speed\nduring takeoff, approach, and landing.\nThe airplane has an inboard and an outboard flap on the trailing edge of each wing, and\none inboard and five outboard slats on the leading edge.\nA two-position Krueger flap provides a seal between the inboard slat and the engine\nnacelle on each wing.\nIn the flaps 1 position, only the slats move.\nFlaps 5, 10, 15, 17, 18, and 20 are takeoff flap positions.\nFlaps 25 and 30 are landing flaps positions.\nFlaps 20 is used for some non–normal landing conditions.\nTo protect against inadvertent deployment during cruise, flap and slat extension\nfrom the UP position is inhibited when speed is more than 260 KIAS or altitude is\nabove approximately 20,000 feet.\nThis inhibit is only available in primary and secondary flap and slat modes.'},
{c:'FLIGHT CONTROL',q:'Flight Control System의 EICAS Message 중 “FLIGHT CONTROL MODE”의 의미는?',o:['The flight control system is in the secondary mode.','The flaps primary mode is failed.','The flight control system is operating in the direct mode.','The slats primary mode is failed.'],a:0,e:'FCOM 9.30.1.\nFLIGHT CONTROL MODE :\nThe flight control system is in the secondary mode.'},
{c:'FLIGHT CONTROL',q:'“The nose gear pressure sensor disagrees with the computed stabilizer greenband.” 상태에서 나오는 Flight Control System EICAS Message는? FCOM 9.30.2',o:['STABILIZER','STABILIZER CUTOUT','STABILIZER L2','STAB GREENBAND'],a:3,e:'FCOM 9.30.2.\nSTAB GREENBAND :\nThe nose gear pressure sensor disagrees with the computed stabilizer\ngreenband.\nAdvisory'},
{c:'FLIGHT CONTROL',q:'STAB GREENBAND EICAS Message level 종류는? FCOM 9.30.2',o:['Warning','Caution','Memo','Advisory'],a:3,e:'FCOM 9.30.2.\nSTAB GREENBAND :\nThe nose gear pressure sensor disagrees with the computed stabilizer\ngreenband.\nAdvisory'},
{c:'FLIGHT CONTROL',q:'EICAS DISPLAY에서 Normal Flap Position Indication은 언제 removed 되는가?',o:['5 seconds after flap retraction.','10 seconds after slat retraction.','After airborne','When the slats extend to the midrange position.'],a:1,e:'FCOM 9.10.10. Normal Flap Position Indication\nDisplays combined flap and slat positions when all surfaces are operating\nnormally and control is in the primary (hydraulic) mode.\nThe indicator shows continuous motion.\nThe flap position indication is removed 10 seconds after slat retraction.'},
{c:'FLIGHT CONTROL',q:'Expanded Flap and Slat Position Indications에 대한 설명 중 잘못된 것은?',o:['The slat indication fills up (forward) for extension.','The flap indication fills down (aft) for extension.','Indication colors of outline and fill is WHITE when operating in secondary mode','Indication colors of outline and fill is RED when the respective FLAPS DRIVE or SLATS DRIVE EICAS caution message is displayed'],a:3,e:'FCOM 9.10.11. Expanded Flap and Slat Position Indication\nIf any flap/slat is non–normal or if control is in the secondary mode, slat and flap\npositions are shown independently. Each wing is also shown separately. Indicator\nmotion is continuous between flap detents.\nExpanded Flap and Slat Position Indications\nThe slat indication fills up (forward) for extension.\nThe flap indication fills down (aft) for extension.\nIndication colors of outline and fill are :\n• white when operating in secondary mode\n• amber when the respective FLAPS DRIVE or SLATS DRIVE EICAS caution\nmessage is displayed\nLoss of position information is shown as a white outline with no fill and no flap\nlever position indication.'},
{c:'FLIGHT CONTROL',q:'Expanded Flap and Slat Position Indications에 대한 설명 중 맞는 것은?',o:['The slat indication fills up (forward) for Retraction.','The flap indication fills down (aft) for extension.','Indication colors of outline and fill is AMBER when operating in secondary mode','Indication colors of outline and fill is RED when the respective FLAPS DRIVE or SLATS DRIVE EICAS caution message is displayed'],a:1,e:'FCOM 9.10.11. Expanded Flap and Slat Position Indication\nIf any flap/slat is non–normal or if control is in the secondary mode, slat and flap\npositions are shown independently. Each wing is also shown separately. Indicator\nmotion is continuous between flap detents.\nExpanded Flap and Slat Position Indications\nThe slat indication fills up (forward) for extension.\nThe flap indication fills down (aft) for extension.\nIndication colors of outline and fill are :\n• white when operating in secondary mode\n• amber when the respective FLAPS DRIVE or SLATS DRIVE EICAS caution\nmessage is displayed\nLoss of position information is shown as a white outline with no fill and no flap\nlever position indication.'},
{c:'FLIGHT CONTROL',q:'Primary Flight Control System Mode중 하나가 아닌 것은?',o:['Normal','Alternate','Secondary','Direct'],a:1,e:'FCOM 9.20.1. Introduction\nThe primary flight control system uses conventional control wheel, column, and\npedal inputs from the pilot to electronically command the flight control surfaces.\nThe system provides conventional control feel and pitch responses to speed and\ntrim changes. The system’s electronic components provide enhanced handling\nqualities and reduce pilot workload.\nThe primary flight control system is highly redundant, with three operating\nmodes: normal mode, secondary mode, and direct mode.\nThe secondary flight controls, high lift devices consisting of flaps and slats, are\nhydraulically powered with an electrically powered backup system.\nFCOM 9.20.6. Primary Flight Control System Modes\nThere are three primary flight control system modes (flap and slat system modes\nare described later in this section):\n• normal • secondary • direct\nAll the modes use the same pilot controls and flight control surfaces.'},
{c:'FLIGHT CONTROL',q:'The spoilers automatically retract and the speedbrake lever is driven forward to the DOWN position이 되는 조건이 아닌 것은? FCOM 9.20.21',o:['On the ground, when either thrust lever is moved to the takeoff range','On the ground, if there is a transition to in the air','On the ground and both thrust reverse levers are moved to the reverse idle detent','In the air, when either thrust lever is beyond 90% full travel'],a:2,e:'FCOM 9.20.22. Spoiler Speedbrake Operation\nThe 14 spoiler panels are used as speedbrakes.\nThe speedbrake spoilers are controlled by the speedbrake lever located on the control stand. The\nspeedbrake lever has three marked positions : • DOWN • ARMED • UP\nThe speedbrake lever can be placed in intermediate positions between ARMED and UP.\nIn the ARMED position, the spoilers extend and the speedbrake lever is driven aft to the UP\nposition on landing when the main gear trucks untilt and both thrust levers are not in the takeoff\nrange.\nWhen the speedbrake lever is not in the ARMED position, the spoilers still automatically extend\nand the speedbrake lever is driven to the UP position when either of the following conditions\noccur:\n• on the ground with groundspeed above 85 knots, either thrust lever was previously in the takeoff\nrange, then both thrust levers are moved to the idle range (rejected takeoff), or\n• on the ground and both thrust reverse levers are moved to the reverse idle detent ...'},
{c:'FLIGHT CONTROL',q:'Flap and Slat Mode가 secondary mode로 automatically selected 되는 condition이 아닌 것은?',o:['Center hydraulic system failed','Control surfaces travel at less than 80% of the normal hydraulic rate','Flap or slat disagree is detected','Flap or slat primary control failure'],a:1,e:'FCOM 9.20.24. Flap and Slat Modes\nThere are three modes of flap and slat operation : • primary • secondary • alternate\nIn the primary mode, the flaps and slats are controlled together and positioned using center hydraulic\nsystem motors. Autogap and flap load relief operate in the primary mode.\nThe secondary mode is automatically selected when any of the following conditions occur:\n• center hydraulic system failed, or\n• control surfaces travel at less than 50% of the normal hydraulic rate, or\n• flap or slat disagree is detected, or\n• flap or slat primary control failure, or\n• primary mode fails to move the flaps or slats to the selected position, or\n• uncommanded flap or slat motion is detected\nIn the secondary mode the slats and flaps are controlled separately and can be positioned by hydraulic\nor electric motors. For example, if the slats hydraulic control fails, the flaps are still driven hydraulically ...'},
{c:'FLIGHT CONTROL',q:'Flap/Slat Load Relief 관련 설명 중 틀린 것은? FCOM 9.20.24',o:['In the primary mode, the flap load relief system protects the flaps from excessive air loads.','If flap airspeed placard limits are exceeded with the flaps in the 15 through 30 position, LOAD RELIEF is displayed and the flaps automatically retract to a safe position appropriate to the airspeed.','Load relief retraction is limited to flaps 1.','When airspeed is reduced, the flaps automatically re–extend as airspeed allows.'],a:2,e:'FCOM 9.20.25. Flap/Slat Load Relief\nIn the primary mode, the flap load relief system protects the flaps from excessive air loads. If\nflap airspeed placard limits are exceeded with the flaps in the 15 through 30 position, LOAD\nRELIEF is displayed and the flaps automatically retract to a safe position appropriate to the\nairspeed. Load relief retraction is limited to flaps 5.\nWhen airspeed is reduced, the flaps automatically re-extend as airspeed allows.\nRe–extension is limited to the commanded flap position.\nIf a flap overspeed exists, load relief prevents flap extension beyond the 5, 15, 17, 18, or\n20/25 positions until airspeed is sufficiently reduced. Flap load relief is available only in the\nprimary mode. The EICAS flap display indicates an in–transit flap condition and shows actual\nflap position. The flap lever does not move during flap load relief operation.\nLoad relief for slats is not required in the primary or alternate modes. ...'},
{c:'OXYGEN',q:'The passenger cabin oxygen system masks automatically drop from the PSUs prior to the cabin altitude reaching the greater of what altitude? FCOM 1.40.18',o:['13,500 feet, or 2000 feet above the origin or destination airfield.','13,000 feet, or 1000 feet above origin airfield or destination airfield altitude +2000 feet','14,500 feet, or origin airfield altitude +1500 feet, or destination airfield altitude +1500 feet','14,000 feet, or 1000 feet above origin airfield or destination airfield altitude +1000 feet'],a:2,e:'FCOM 1.40.15. Passenger Cabin Oxygen System\nThe passenger cabin system provides oxygen to the main seating area, galleys, flight attendant stations,\noverhead crew rest areas, and lavatories.\nThe passenger cabin oxygen system is supplied by gaseous oxygen stored in small high pressure\ncylinders. The passenger and flight attendant oxygen masks and gaseous oxygen cylinders are located\nthroughout the cabin in passenger service units (PSU) fitted to the ceiling panels.\nFor each mask, normal breathing initiates the oxygen flow. The system regulates the pressure and\ndistributes oxygen to the masks by providing small pulses of oxygen to the user during inhalation. The\npulse duration is dependent on cabin altitude, longer pulses at higher altitudes and shorter ones at\nlower altitudes. The oxygen cylinders are single use devices and once activated, provides oxygen until\nthe cylinder is depleted.\nOxygen is available for approximately 60 minutes. ...'},
{c:'OXYGEN',q:'Emergency (EMGCY)/100%/Normal (N) Selector에 대한 설명 중 잘못된 것은?',o:['EMGCY (emergency) – supplies 100% oxygen under positive pressure at all cabin altitudes (protects against smoke and harmful vapors).','100% – supplies 100% oxygen on demand (not an air/oxygen mixture).','N (normal) – supplies an air/oxygen mixture on demand (the ratio depends on cabin altitude).','N (normal) – Automatically supplies 100% oxygen on demand when cabin altitude is below 10000 feet'],a:3,e:'FCOM 1.30.33. Emergency (EMGCY)/100%/Normal (N) Selector\nEMGCY (emergency) – supplies 100% oxygen under positive pressure at all cabin\naltitudes (protects against smoke\nand harmful vapors). Use to purge contaminants from mask and to remove condensation\nor fogging from interior of mask lens.\n100% – supplies 100% oxygen on demand (not an air/oxygen mixture).\nN (normal) – supplies an air/oxygen mixture on demand (the ratio depends on cabin\naltitude). Automatically supplies 100% oxygen under positive pressure when cabin\naltitude is above a preset value\nCAUTION : Use of EMGCY mode depletes oxygen supply at higher rate than 100% or\nN mode.\nUse EMGCY mode only as conditions require.\nNote : Communication in EMGCY mode may be difficult. Switch to 100% or N mode if\nconditions allow.'},
{c:'OXYGEN',q:'Flight Deck Oxygen System에 대한 설명으로 잘못된 것은?',o:['The flight crew oxygen system uses quick-donning diluter-demand masks located at flight crew and observer stations.','Oxygen flow is controlled by an automatic pressure breathing regulator mounted on each mask.','During the preflight check of the crew oxygen mask, a pressure decrease may indicate the crew oxygen cylinder shutoff valve is closed, and oxygen is unavailable.','When the right hand door to the mask stowage box is closed, oxygen flows to the mask regulator and the microphone activates in the removed mask.'],a:3,e:'FCOM 1.40.10. Flight Deck Oxygen System\nThe flight crew oxygen system uses quick-donning diluter-demand masks located at flight\ncrew and observer stations. Oxygen flow is controlled by an automatic pressure breathing\nregulator mounted on each mask.\nDuring the preflight check of the crew oxygen mask, a pressure decrease may indicate the\ncrew oxygen cylinder shutoff valve is closed, and oxygen is unavailable.\nSqueezing the red release levers with the thumb and forefinger allows the mask to be\nremoved from stowage, inflates the mask harness and momentarily displays the yellow cross\nin the flow indicator. Releasing the levers after placing the mask over the head deflates the\nmask harness, fitting it securely to the head and face.\nWhen the left-hand door to the mask stowage box is opened, oxygen flows to the mask\nregulator and the microphone activates in the removed mask.\nAn OXYGEN ON flag appears in the mask compartment near the left-hand door of the ...'},
{c:'OXYGEN',q:'Passenger Cabin Oxygen System에 대한 설명으로 잘못된 것은?',o:['The passenger cabin system provides oxygen to the main seating area, galleys, flight attendant stations, overhead crew rest areas, and lavatories.','The passenger cabin oxygen system is supplied by gaseous oxygen stored in small high pressure cylinders.','Oxygen is available for approximately 100 minutes.','The oxygen cylinders are single use devices and once activated, provides oxygen until the cylinder is depleted.'],a:2,e:'FCOM 1.40.15. Passenger Cabin Oxygen System\nThe passenger cabin system provides oxygen to the main seating area, galleys, flight attendant\nstations, overhead crew rest areas, and lavatories.\nThe passenger cabin oxygen system is supplied by gaseous oxygen stored in small high pressure\ncylinders.\nThe passenger and flight attendant oxygen masks and gaseous oxygen cylinders are located throughout\nthe cabin in passenger service units (PSU) fitted to the ceiling panels.\nFor each mask, normal breathing initiates the oxygen flow. The system regulates the pressure and\ndistributes oxygen to the masks by providing small pulses of oxygen to the user during inhalation. The\npulse duration is dependent on cabin altitude, longer pulses at higher altitudes and shorter ones at\nlower altitudes. The oxygen cylinders are single use devices and once activated, provides oxygen until\nthe cylinder is depleted.\nOxygen is available for approximately 60 minutes. ...'},
{c:'OXYGEN',q:'Crew oxygen cylinder pressure (PSI)는 Systems (SYS) display의 어디에서 볼 수 있나?',o:['Door Synoptic Display','Air Synoptic Display','Electrical Synoptic Display','Status (STAT) Synoptic Display'],a:3,e:'FCOM 1.30.31. Oxygen Pressure Display\nDisplays crew oxygen cylinder pressure (PSI).\nNote : Oxygen indication is displayed by pushing the system (SYS) display\nswitch on the display select panel, and then selecting the status (STAT) synoptic\nkey from the menu page.'},
{c:'AVIONICS / COMM',q:'In the event a VHF or HF radio transmits for more than 30 seconds, which statement about stuck mic protection is correct? FCOM 5.20.5',o:['The EICAS advisory message RADIO TRANSMIT CAPT, F/O, or OBS is displayed.','On the ground the EICAS caution message STUCK MIC CAPT, F/O, OBS appears to warn the flight crew of the condition','Stuck microphone protection is available while airborne (landing gear retracted). The affected radio is disabled until reset on the ground.','On the ground with the engine running, dashes appear in the respective TCP frequency line to warn the flight crew of the condition.'],a:0,e:'FCOM 5.20.5. Stuck Mic Protection\nIn the event a VHF or HF radio transmits for more than 30 seconds, the EICAS\nadvisory message RADIO TRANSMIT CAPT, F/O, or OBS is displayed.\nThe message is removed when the transmission stops.\nOn the ground, any VHF radio that transmits for more than approximately 35\nseconds is automatically disabled.\nSeveral seconds before disablement, an intermittent tone can be heard through\nthe audio system for that radio.\nThat radio is enabled when the microphone switch for that radio is released.'},
{c:'AVIONICS / COMM',q:'Which statement about the TCP VHF page display function (Active entry option) is correct?',o:['VHF pages 2, 3, and 4 can contain up to four stored frequencies for each radios. Frequencies stored during flight may not be manually deleted using the CLR key.','For the selected radio, the frequency transfer switch moves the alternate frequency to become the active, tuned frequency. The previously active frequency is deleted from the page display.','New frequencies are entered into the scratchpad. Entering the decimal and/or following zeros for this new frequency are optional.','Scratchpad frequencies can only be entered into the standby windows.'],a:2,e:'FCOM 5.20.2. VHF Communication System\nThree independent VHF voice/data radios, designated VHF L (left), VHF C (center), and VHF R\n(right) are installed. Any VHF radio can be controlled by any TCP. The audio control panels are\nused to control voice transmission and receiver monitoring.\nWhen a VHF radio is tuned to frequency 121.5, all flight crew automatically monitor the radio.\nThe receiver lights on all audio control panels illuminate.\nVHF L is configured for voice communication only and VHF C is normally used for data\ncommunication. VHF C and VHF R can be used for both voice or data communication.\nHowever, only one VHF radio can operate in the data mode at a time. When ------- - X - ------\n- is displayed on the TCP, the affected radio (X) is inoperative.\nIn event of electrical power loss, the left VHF radio and left TCP continue to operate on\nstandby power.\nFCOM 5.20.3. VHF Page Displays ...'},
{c:'AVIONICS / COMM',q:'Which statement correctly describes a function of the VHF Communication System?',o:['When a VHF radio is tuned to frequency 121.5 all fight crews automatically monitor the radio','Each VHF radio is controlled only through its respective TCP','Only two VHF radios can operate in the DATA mode at one time','In the event of an electrical power loss, the right VHF radio and the right TCP continue to operate on standby power'],a:0,e:'FCOM 5.20.2. VHF Communication System\nThree independent VHF voice/data radios, designated VHF L (left), VHF C (center), and VHF R\n(right) are installed. Any VHF radio can be controlled by any TCP. The audio control panels are\nused to control voice transmission and receiver monitoring.\nWhen a VHF radio is tuned to frequency 121.5, all flight crew automatically monitor the radio.\nThe receiver lights on all audio control panels illuminate.\nVHF L is configured for voice communication only and VHF C is normally used for data\ncommunication. VHF C and VHF R can be used for both voice or data communication.\nHowever, only one VHF radio can operate in the data mode at a time. When ------- - X - ------\n- is displayed on the TCP, the affected radio (X) is inoperative.\nIn event of electrical power loss, the left VHF radio and left TCP continue to operate on\nstandby power.\nFCOM 5.20.3. VHF Page Displays ...'},
{c:'AVIONICS / COMM',q:'Cockpit Voice Recorder TEST Switch를 Push and hold for two seconds (on the ground and engines off) 하면 나타나는 내용 중 잘못된 것은? FCOM 5.10.24',o:['Tests area microphone CVR channel','A test tone is heard from flight deck speakers','Erases voice recorder.','An EICAS status message is displayed if test fails'],a:2,e:'FCOM 5.10.26. Cockpit Voice Recorder TEST Switch\nPush and hold for three seconds (on the ground and engines off) –\n• tests area microphone CVR channel\n• a test tone is heard from flight deck speakers\n• an EICAS status message is displayed if test fails\nNote: Test may fail if crew is speaking when test is initiated.\nIf necessary, repeat test without speaking for three (3) seconds\nafter the test tone is heard.'},
{c:'AVIONICS / COMM',q:'Cockpit Voice Recorder를 ERASE 하려면 Cockpit Voice Recorder ERASE Switch를 어떻게 사용해 야 하는가? FCOM 5.10.24',o:['Push (on the ground and engines off)','Push and hold for five seconds (engines running)','Push (on the ground and engines running)','Push and hold for two seconds (on the ground and engines off)'],a:3,e:'FCOM 5.10.26.\nCockpit Voice Recorder ERASE Switch\nPush and hold for two seconds (on the ground and engines off) – erases\nvoice recorder.'},
{c:'AVIONICS / COMM',q:'AFT AISLE STAND PANEL의 Printer에 대한 내용으로 잘못된 것은?',o:['Printer FAIL Light – the printer is failed','Printer PAPER Light – printer is out of paper','Printer PAPER Light – paper loading door is open','With both FAIL and PAPER lights illuminated, a printer test is in progress'],a:3,e:'FCOM 5.10.27. Printer Controls\nPrinter FAIL Light : Illuminated (white) – the printer is failed.\nPrinter PAPER Light : Illuminated (white) –\n• printer is out of paper, or\n• paper loading door is open\nNote : With both FAIL and PAPER lights illuminated, printer is overheated.'},
{c:'AVIONICS / COMM',q:'Audio Control Panels (ACP)에 대한 내용 중 잘못된 것은?',o:['The audio control panels (ACP) are used to manage the radio and interphone communication systems.','The oxygen mask microphone is disabled and the boom microphone is enabled when the right oxygen mask stowage box door is closed.','Navigation receiver audio can also be monitored.','The captain, first officer, and first observer audio control panels are installed on the aft aisle stand.'],a:1,e:'FCOM 5.20.1. Audio Control Panels (ACP)\nThe audio control panels (ACP) are used to manage the radio and interphone\ncommunication systems.\nNavigation receiver audio can also be monitored.\nThe captain, first officer, and first observer audio control panels are installed on the aft\naisle stand.\nMicrophones are keyed by pushing the desired audio control panel transmitter select\nswitch and using the MIC (microphone) position of a control wheel or audio control panel\nmicrophone/interphone switch, a glareshield MIC switch, or a hand microphone push-to-\ntalk switch. Systems are monitored using headphones or speakers.\nAn oxygen mask microphone is enabled and the boom microphone is disabled when the\noxygen mask stowage doors are open.\nThe oxygen mask microphone is disabled and the boom microphone is enabled when\nthe left oxygen mask stowage box door is closed and the RESET/TEST lever is pushed.'},
{c:'AVIONICS / COMM',q:'Communication System의 Stuck Mic Protection 관련 내용 중 잘못된 것은?',o:['In the event a VHF or HF radio transmits for more than 20 seconds, the EICAS caution message RADIO TRANSMIT CAPT, F/O, or OBS is displayed.','The EICAS advisory message RADIO TRANSMIT CAPT, F/O, or OBS is removed when the transmission stops.','On the ground, any VHF radio that transmits for more than approximately 35 seconds is automatically disabled.','On the ground, several seconds before disablement, an intermittent tone can be heard through the audio system for that radio.'],a:0,e:'FCOM 5.20.5. Stuck Mic Protection\nIn the event a VHF or HF radio transmits for more than 30 seconds, the EICAS\nadvisory message RADIO TRANSMIT CAPT, F/O, or OBS is displayed.\nThe message is removed when the transmission stops.\nOn the ground, any VHF radio that transmits for more than approximately 35\nseconds is automatically disabled.\nSeveral seconds before disablement, an intermittent tone can be heard through\nthe audio system for that radio.\nThat radio is enabled when the microphone switch for that radio is released.'},
{c:'FLIGHT INSTRUMENTS',q:'The airplane\'s angle-of-attack (AOA) limit is depicted on the HUD by the angle-of-attack limit symbol. 언제 AOA limit symbol이 display 되는가? FCOM 10.22.5',o:['When angle of attack is within 5º of stick shaker, or the stick shaker is active','When angle of attack is within 10º of stick shaker','During the flight with the flaps are not up.','Symbology control switches on each control wheel allow the pilot to alternate between the two display modes.'],a:0,e:'FCOM 10.22.5. Angle-of-Attack Limit Symbol\nThe airplane\'s angle-of-attack (AOA) limit is depicted on the HUD by the angle-\nof-attack limit symbol. The distance between the AOA limit symbol and the flight\npath vector symbol represents the margin available before stick shaker occurs.\nWhen the AOA limit symbol is positioned on the flight path vector symbol (boxed\nends set on the flight path vector symbol wings), the airplane is at the stick\nshaker angle of attack.\nThe PFD contains a similar symbol called the pitch limit indicator (PLI).\nHowever, on the PFD, the PLI is displayed relative to the airplane reference\nsymbol, not to the flight path vector.\nThe AOA limit symbol is displayed during any of the following:\n• angle of attack is within 5º of stick shaker, or\n• stick shaker is active, or\n• windshear alerting with (solid) guidance cue displayed'},
{c:'FLIGHT INSTRUMENTS',q:'Current IRS heading, track and other heading information은 Primary Flight Display (PFD) 어느 부분에 display 되는가? FCOM 10.10.3',o:['Airspeed/Mach Indications','Attitude, Steering, and Miscellaneous Indications','Mini-map','Flight Mode Annunciations'],a:2,e:'FCOM 10.10.2.\nMini-map : Displays current IRS heading, track and other heading information.\nHUD\nCompass Rose : Displays current IRS heading, track and other related\ninformation.'},
{c:'FLIGHT INSTRUMENTS',q:'Takeoff Reference Speed 중 에서 V2 가 climb-out 중 removed 되는 조건이 아닌 것은?',o:['When flap retraction begins','At lift-off','After 10 minutes have passed without flap lever movement','After VREF has been selected (for a turn-back)'],a:1,e:'FCOM 10.10.4. Takeoff Reference Speeds\nDisplays the takeoff reference speeds V1, VR (displays R if VR is within 4 knots\nof V1 or V2), and V2, selected on the CDU :\n• displayed for takeoff\n• NO VSPD is displayed if V speeds are not selected on the CDU\n• V1 is displayed at the top of the airspeed indication when selected and\nif the value is off the scale\n• V1 and VR are removed at lift-off\n• V2 is removed on climb-out :\n• when flap retraction begins, or\n• after 10 minutes have passed without flap lever movement, or\n• after VREF has been selected (for a turn-back)'},
{c:'FLIGHT INSTRUMENTS',q:'HUD의 BARO Minimums Pointer에 대한 설명 중 틀린 것은?',o:['When BARO minimums are displayed, the number is also represented as a triangular bug and line on the altitude scale.','Flashes for 3 seconds, then steady when the airplane descends below BARO minimums.','When RA minimums are displayed after BARO minimums are selected, the bug remains on the altitude scale.','It is an amber line, left of the altitude scale, when BARO minimums are displayed'],a:3,e:'FCOM 10.12.14. BARO Minimums Pointer\nWhen BARO minimums are displayed, the number is also represented as a\ntriangular bug and line on the altitude scale.\nFlashes for 3 seconds, then steady when the airplane descends below baro\nminimums.\nWhen RA minimums are displayed after BARO minimums are selected, the\nbug remains on the altitude scale.'},
{c:'FLIGHT INSTRUMENTS',q:'What will be seen on the navigation performance scales when the ANP equals or exceeds the RNP? FCOM 10.30.4',o:['The ANP Bars are withdrawn from sight.','The ANP Bars turn magenta and flash for 10 seconds','With GPS updating the aircraft will not exceed RNP','The ANP bars touch at the center of the scale. The ANP bars then turn amber, the deviation pointer flashes for 10 seconds, and the NAV UNABLE RNP EICAS message is displayed.'],a:3,e:'FCOM 10.30.4. Navigation Performance Indications\nNavigation performance scales and pointers present a real-time display of the location of the LNAV\nand VNAV path relative to the airplane. The airplane position is represented by the center index (or\ntic mark) on the scale and the LNAV or VNAV path by a magenta pointer (triangle).\nThe deviation scales are proportional to RNP. The deviation represented by the distance from the\ncenter index to the outer index is equal to the RNP value in the FMC. If RNP is equal to 1 NM,\nthen the distance between the center index and outer index represents 1 NM.\nThe ANP bars are anchored to the outer index, or tic marks, and vary in length depending on the\nprecision of the navigation system, When GPS updating is available, the ANP value is small and\nthe bars are short. When GPS updating is not available, position uncertainty increases and the\nANP bars grow toward the center of the scale. The gap between the ANP bars represents the area ...'},
{c:'FLIGHT INSTRUMENTS',q:'When are the Closed Loop Conditional Line Items displayed in cyan on an Electronic Checklist (ECL)? FCOM 10.50.9',o:['When the conditional line item is sensed false.','When the conditional line item is sensed true.','When action is not required, the line item is complete','When action is required, the line item is incomplete'],a:0,e:'FCOM 10.50.10. Closed Loop Conditional Line Items\nShows (white) - the conditional line item is incomplete.\nShows (cyan) - the conditional line item is sensed false. All line items indented\nbelow the conditional line item become inactive and show cyan. The current line\nitem box, cursor selection box, and cursor skip the inactive items and move to the\nnext incomplete line item.\nShows (green) - the conditional line item is sensed true. The current line item\nbox, cursor selection box, and cursor move to the next incomplete line item.'},
{c:'FLIGHT INSTRUMENTS',q:'다음 Electronic Flight Bag (EFB) function에 대한 내용중 옳은 것은?',o:['The EFB is an operating system with applications designed to assist the flight crew with routine tasks, enhance security, and reduce the reliance on paper documents.','The primary method of flight crew interaction with the EFB is with full size keyboard on the flight deck.','Under typical flight conditions, the majority of pilot interaction with the EFB consists of downloading and printing FMC data.','The EFBs can exchange data with the FMC, but they cannot display information from the offside unit.'],a:0,e:'FCOM 10.70.1. Introduction\nThe electronic flight bag is an operating system with applications designed to\nassist the flight crew with routine tasks, enhance security, and reduce the\nreliance on paper documents.\nThe flight crew uses the EFB display units located in the left and right side panels.\nThe display units operate independently of each other, but can also display\ninformation from the off-side unit, exchange data with the FMC, and send\ninformation directly to the flight deck printer or an EFB storage location.\nUnder typical flight conditions, the majority of pilot interaction consists of\nmanipulating bezel keys or using the touch screen on the display unit to\nmove back and forth among applications, or within applications, and to\ndisplay, send or print data. In addition, the flight crew can interact with the\nEFB using the cursor control device (CCD) or an optional full size keyboard.'},
{c:'FLIGHT INSTRUMENTS',q:'The Navigation Performance Scale (NPS) Deviation Pointer indicates the navigation path relative to the airplane position. 다음 NPS deviation pointer에 대한 내용중 옳은 것은?',o:['The Deviation Pointer is displayed on the vertical deviation scale in both the climb and descent phase of flight','The Deviation Pointer is displayed on the lateral deviation scale whenever the scale is displayed','The Deviation Pointer is a filled magenta triangle when parked at deflection limit','The Deviation Pointer flashes for five seconds if pointer migrates into bar area or ANP bars meet in the middle of the deviation scale'],a:1,e:'FCOM 10.10.10. Navigation Performance Scale (NPS) Deviation Pointer\nIndicates the navigation path relative to the airplane position :\n• unfilled magenta triangle when parked at deflection limit\n• filled magenta triangle when not parked at deflection limit\nNote : NPS Deviation Pointer (magenta triangle) is initially filled when parked\nat deflection limit, and if the lateral deviation continues to increase,\nthe NPS Deviation Pointer (magenta triangle) will change to unfilled.\n• displayed on lateral deviation scale whenever the scale is displayed\n• displayed on vertical deviation scale only in descent phase of flight\n• flashes for ten seconds if pointer migrates into bar area for five seconds or\nANP bars meet in the middle of the deviation scale'},
{c:'FLIGHT INSTRUMENTS',q:'PFD Reference Speeds 중 Flap Maneuvering Speeds는 대략 어느 고도에서 displayed 되지 않는가? FCOM 10.10.6',o:['Above approximately 10,000 feet altitude.','Above approximately 14,000 feet altitude.','Above approximately 20,000 feet altitude.','Below approximately 20,000 feet altitude.'],a:2,e:'FCOM 10.10.6. Flap Maneuvering Speeds\nIndicates flap maneuvering speed for flap retraction or extension.\nNot displayed above approximately 20,000 feet altitude.\nTo prevent clutter, a flap maneuvering speed is not shown if within 4 knots of\nVREF.'},
{c:'FLIGHT INSTRUMENTS',q:'ND에 displayed 되는 Symbol 중에서 Position trend vector (white) (dashed line) 에 대한 설명이 잘못된 것은? FCOM 10.40.13',o:['Predicts position at the end of 30, 60, and 90 second intervals.','Each segment represents 20 seconds.','Based on bank angle and groundspeed.','Selected range determines the number of segments displayed.'],a:1,e:'FCOM 10.40.11. Position trend vector (W) (dashed line)\nPredicts position at the end of 30, 60, and 90 second intervals.\nEach segment represents 30 seconds.\nBased on bank angle and ground speed.\nSelected range determines the number of segments displayed.\nFor range :\n• greater than 20 NM, 3 segments\n• = 20 NM, 2 segments\n• = 10 NM, 1 segment (mini-map always shows 3 segments even though range\nis always 20 NM.)\nNew\n◈ B787-9 Nose Gear ~ Main Gear 거리와 Cockpit Seat ~ Nose Gear 거리 맞는 것은?\n(FCOM 1.10.1. Principal Dimensions, POM 5.4.14.)\n가. 25.7m, 2.6m\n나. 25.8m, 2.7m\n다. 25.8m, 2.6m\n라. 25.7m, 2.7m\n◈ Towing Battery Charge Lights 설명 중 맞는 것은? (FCOM 6.10.5.)\n가. HIGH – a minimum of 50 minutes remains before battery charge is depleted\n나. MEDIUM – a minimum of 30 minutes remains before battery charge is Depleted\n다. LOW – a minimum of 10 minutes remains before battery charge is depleted\n라. NEED - a minimum of 5 minutes remains before battery charge is depleted\nNew ...'}
];

const cats=[...new Set(Q.map(q=>q.c))];
let selCats=new Set(cats),qCount=10,queue=[],idx=0,corr=0,wrng=0,answered=false;

// build setup
const catRow=document.getElementById('catRow');

// ALL 버튼
const allBtn=document.createElement('button');
allBtn.className='catb on';allBtn.textContent='✦ ALL';
allBtn.style.borderColor='#2f81f7';allBtn.style.color='#2f81f7';allBtn.style.background='rgba(47,129,247,.15)';
allBtn.onclick=()=>{
  const allOn=selCats.size===cats.length;
  if(allOn){
    // 전체 해제 → 첫번째만 선택
    selCats=new Set([cats[0]]);
  } else {
    // 전체 선택
    selCats=new Set(cats);
  }
  updateCatBtns();
};
catRow.appendChild(allBtn);

const catBtns=[];
cats.forEach(cat=>{
  const b=document.createElement('button');
  b.className='catb on';b.textContent=cat;
  b.onclick=()=>{
    if(selCats.has(cat)){if(selCats.size>1){selCats.delete(cat);}}
    else{selCats.add(cat);}
    updateCatBtns();
  };
  catRow.appendChild(b);
  catBtns.push({cat,btn:b});
});

function updateCatBtns(){
  const allOn=selCats.size===cats.length;
  allBtn.classList.toggle('on',allOn);
  catBtns.forEach(({cat,btn})=>btn.classList.toggle('on',selCats.has(cat)));
  updateSetupInfo();
}
document.querySelectorAll('.cntb').forEach(b=>{
  b.onclick=()=>{document.querySelectorAll('.cntb').forEach(x=>x.classList.remove('on'));b.classList.add('on');qCount=parseInt(b.dataset.n);};
});
document.getElementById('startBtn').onclick=start;
document.getElementById('resetDoneBtn').onclick=function(){if(confirm('풀이 기록을 초기화합니다. 모든 문제가 다시 출제됩니다.')){setDone(new Set());updateSetupInfo();}};
document.getElementById('resetTagBtn').onclick=function(){if(confirm('제외 태그를 초기화합니다. 제외했던 문제가 다시 출제됩니다.')){setTagged(new Set());updateSetupInfo();}};

updateSetupInfo();

// === 진행 상태 저장/복원 (localStorage) ===
const SAVE_KEY='b787quiz_save';
function saveState(){
  // queue를 Q 배열 인덱스로 저장 (용량 절약)
  const qIndices=queue.map(q=>Q.indexOf(q));
  const data={qIndices,idx,corr,wrng,history};
  try{localStorage.setItem(SAVE_KEY,JSON.stringify(data));}catch(e){}
}
function clearSave(){try{localStorage.removeItem(SAVE_KEY);}catch(e){}}
function loadSave(){
  try{
    const raw=localStorage.getItem(SAVE_KEY);
    if(!raw)return null;
    return JSON.parse(raw);
  }catch(e){return null;}
}
function resumeQuiz(data){
  queue=data.qIndices.map(i=>Q[i]);
  idx=data.idx;corr=data.corr;wrng=data.wrng;answered=false;
  history=data.history||[];
  document.getElementById('setupScr').style.display='none';
  document.getElementById('quizScr').classList.remove('hide');
  document.getElementById('resultScr').classList.remove('show');
  updateSB();render();
}

function start(){
  const tagged=getTagged();
  const done=getDone();
  const pool=Q.filter(q=>selCats.has(q.c)).filter(q=>{const i=Q.indexOf(q);return !tagged.has(i)&&!done.has(i);}).sort(()=>Math.random()-.5);
  const n=qCount>=9999?pool.length:Math.min(qCount,pool.length);
  if(!n){alert('출제 가능한 문제가 없습니다. 풀이 기록이나 제외 태그를 초기화해주세요.');return;}
  clearSave();
  queue=pool.slice(0,n);idx=0;corr=0;wrng=0;answered=false;history=[];
  document.getElementById('setupScr').style.display='none';
  document.getElementById('quizScr').classList.remove('hide');
  document.getElementById('resultScr').classList.remove('show');
  updateSB();render();
}

// 페이지 로드 시 저장된 퀴즈 복원
(function checkResume(){
  const data=loadSave();
  if(data && data.qIndices && data.qIndices.length>0 && data.idx<data.qIndices.length){
    const answered_cnt=data.history?data.history.filter(Boolean).length:0;
    const total=data.qIndices.length;
    if(confirm('이전에 풀던 퀴즈가 있습니다 ('+answered_cnt+'/'+total+'문제 완료). 이어서 풀까요?')){
      resumeQuiz(data);
    }else{clearSave();}
  }
})();

// === 제외 태그 & 풀이 기록 (localStorage) ===
const TAGGED_KEY='b787quiz_tagged';
const DONE_KEY='b787quiz_done';
function getTagged(){try{return new Set(JSON.parse(localStorage.getItem(TAGGED_KEY)||'[]'));}catch(e){return new Set();}}
function setTagged(s){try{localStorage.setItem(TAGGED_KEY,JSON.stringify([...s]));}catch(e){}}
function getDone(){try{return new Set(JSON.parse(localStorage.getItem(DONE_KEY)||'[]'));}catch(e){return new Set();}}
function setDone(s){try{localStorage.setItem(DONE_KEY,JSON.stringify([...s]));}catch(e){}}

function toggleTag(){
  const q=queue[idx];
  const qi=Q.indexOf(q);
  const tagged=getTagged();
  if(tagged.has(qi)){tagged.delete(qi);}else{tagged.add(qi);}
  setTagged(tagged);
  updateTagBtn();
}
function updateTagBtn(){
  const btn=document.getElementById('tagBtn');
  const q=queue[idx];
  const qi=Q.indexOf(q);
  const isTagged=getTagged().has(qi);
  btn.textContent=isTagged?'📌 제외 해제':'📌 다음 테스트에서 제외';
  btn.classList.toggle('tagged',isTagged);
}
function updateSetupInfo(){
  const tagged=getTagged();
  const done=getDone();
  const pool=Q.filter(q=>selCats.has(q.c));
  const poolIndices=pool.map(q=>Q.indexOf(q));
  const availCount=poolIndices.filter(i=>!tagged.has(i)&&!done.has(i)).length;
  document.getElementById('infoDone').textContent=done.size;
  document.getElementById('infoTagged').textContent=tagged.size;
  document.getElementById('infoAvail').textContent=availCount;
}

let shuffledOpts=[];
let history=[];


function render(){
  if(idx>=queue.length){showResult();return;}
  answered=false;
  const q=queue[idx];
  document.getElementById('badge').textContent=q.c;
  document.getElementById('meta').textContent='문제 '+(idx+1)+' / '+queue.length;
  document.getElementById('qt').textContent=q.q;
  document.getElementById('pf').style.width=(idx/queue.length*100)+'%';

  // 이전 답변 내역이 있으면 복원, 없으면 새로 섞기
  const prev=history[idx];
  if(prev){shuffledOpts=prev.shuffledOpts;}
  else{shuffledOpts=q.o.map((text,i)=>({text,isCorrect:i===q.a})).sort(()=>Math.random()-.5);}

  const oc=document.getElementById('opts');oc.innerHTML='';
  shuffledOpts.forEach((opt,i)=>{
    const b=document.createElement('button');
    b.className='opt';
    b.innerHTML='<span class="lbl">'+L[i]+'</span><span>'+opt.text+'</span>';
    b.onclick=()=>pick(i);
    oc.appendChild(b);
  });
  const fb=document.getElementById('fb');fb.className='fb';fb.innerHTML='';
  document.getElementById('expl').classList.remove('show');
  document.getElementById('diffBox').classList.remove('show');
  document.getElementById('navTop').classList.add('hide');
  document.getElementById('tagBtn').classList.remove('show','tagged');

  // 이전 답변 복원
  if(prev){
    answered=true;
    const correctIdx=prev.correctIdx, picked=prev.picked;
    const btns=document.querySelectorAll('.opt');
    btns.forEach((b,j)=>{b.disabled=true;if(j===correctIdx)b.classList.add('ok');if(j===picked&&picked!==correctIdx)b.classList.add('ng');});
    if(picked===correctIdx){fb.className='fb ok show';fb.innerHTML='<b>✓ 정답입니다!</b>';}
    else{fb.className='fb ng show';fb.innerHTML='✗ 오답. 정답: <span class="ans">'+L[correctIdx]+'. '+shuffledOpts[correctIdx].text+'</span>';}
    if(q.e){document.getElementById('explBody').textContent=q.e;document.getElementById('expl').classList.add('show');}
    // Restore diff display
    var wt=isWrongType(q.q);
    document.getElementById('diffBox').classList.remove('show');
    if(wt){
      showDiff(shuffledOpts[correctIdx].text, q);
    } else if(picked!==correctIdx){
      showDiff(shuffledOpts[picked].text, q);
    }
    document.getElementById('navTop').classList.remove('hide');
    document.getElementById('tagBtn').classList.add('show');
    updateTagBtn();
  }

  // 이전 문제 버튼 활성화 상태
  document.getElementById('prevBtn').disabled=(idx===0);
  updateSB();
}

function isWrongType(txt){return /틀린|잘못|잘\s*못|아닌\s*것|아닌것/.test(txt);}

function findBestFcomMatch(optText, fcomText){
  if(!fcomText)return null;
  var lines=fcomText.split('\n').filter(function(l){return l.trim().length>10;});
  if(!lines.length)return null;
  var optLow=optText.toLowerCase();
  var optWords=optLow.replace(/[^a-z0-9가-힣\s]/g,' ').split(/\s+/).filter(function(w){return w.length>1;});
  if(!optWords.length)return null;
  var best=null,bestScore=0;
  for(var i=0;i<lines.length;i++){
    var lw=lines[i].toLowerCase().replace(/[^a-z0-9가-힣\s]/g,' ').split(/\s+/).filter(function(w){return w.length>1;});
    var c=0;for(var k=0;k<optWords.length;k++){if(lw.indexOf(optWords[k])>=0)c++;}
    var s=c/optWords.length;
    if(s>bestScore){bestScore=s;best=lines[i];}
  }
  if(bestScore>0.35)return best;
  for(var i=0;i<lines.length-1;i++){
    var pair=lines[i]+' '+lines[i+1];
    var lw=pair.toLowerCase().replace(/[^a-z0-9가-힣\s]/g,' ').split(/\s+/).filter(function(w){return w.length>1;});
    var c=0;for(var k=0;k<optWords.length;k++){if(lw.indexOf(optWords[k])>=0)c++;}
    var s=c/optWords.length;
    if(s>bestScore){bestScore=s;best=pair;}
  }
  return bestScore>0.3?best:null;
}

function buildDiffHtml(optText, fcomLine){
  var oW=optText.split(/\s+/).filter(function(w){return w.length>0;});
  var fW=fcomLine.split(/\s+/).filter(function(w){return w.length>0;});
  var m=oW.length,n=fW.length;
  var dp=[];
  for(var i=0;i<=m;i++){dp[i]=[];for(var j=0;j<=n;j++)dp[i][j]=0;}
  for(var i=1;i<=m;i++)
    for(var j=1;j<=n;j++)
      dp[i][j]=oW[i-1].toLowerCase().replace(/[^a-z0-9가-힣]/g,'')===fW[j-1].toLowerCase().replace(/[^a-z0-9가-힣]/g,'')?dp[i-1][j-1]+1:Math.max(dp[i-1][j],dp[i][j-1]);
  var matchedF={};
  var i=m,j=n;
  while(i>0&&j>0){
    if(oW[i-1].toLowerCase().replace(/[^a-z0-9가-힣]/g,'')===fW[j-1].toLowerCase().replace(/[^a-z0-9가-힣]/g,'')){matchedF[j-1]=true;i--;j--;}
    else if(dp[i-1][j]>dp[i][j-1])i--;
    else j--;
  }
  var html='';
  for(var k=0;k<fW.length;k++){
    var esc=fW[k].replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    if(matchedF[k])html+=esc+' ';
    else html+='<span class="diff-hl">'+esc+'</span> ';
  }
  return html.trim();
}

function showDiff(optText, q){
  var diffBox=document.getElementById('diffBox');
  var diffBody=document.getElementById('diffBody');
  if(!q.e){diffBox.classList.remove('show');return;}
  var fcomMatch=findBestFcomMatch(optText, q.e);
  if(!fcomMatch){diffBox.classList.remove('show');return;}
  var html=buildDiffHtml(optText, fcomMatch);
  diffBody.innerHTML='<b>선택한 보기:</b> '+optText.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')+'<br><br><b>FCOM 원문:</b> '+html;
  diffBox.classList.add('show');
}

function pick(i){
  if(answered)return;answered=true;
  const correctIdx=shuffledOpts.findIndex(o=>o.isCorrect);
  const btns=document.querySelectorAll('.opt');
  btns.forEach((b,j)=>{b.disabled=true;if(j===correctIdx)b.classList.add('ok');if(j===i&&i!==correctIdx)b.classList.add('ng');});
  const fb=document.getElementById('fb');
  if(i===correctIdx){corr++;fb.className='fb ok show';fb.innerHTML='<b>✓ 정답입니다!</b>';}
  else{wrng++;fb.className='fb ng show';fb.innerHTML='✗ 오답. 정답: <span class="ans">'+L[correctIdx]+'. '+shuffledOpts[correctIdx].text+'</span>';}
  // 답변 기록 저장 (점수 중복 방지용)
  history[idx]={picked:i,correctIdx:correctIdx,shuffledOpts:shuffledOpts};
  // 풀이 기록에 추가
  const doneSet=getDone();doneSet.add(Q.indexOf(queue[idx]));setDone(doneSet);
  document.getElementById('navTop').classList.remove('hide');
  document.getElementById('tagBtn').classList.add('show');
  updateTagBtn();
  // Show FCOM diff
  const q=queue[idx];
  const wrongType=isWrongType(q.q);
  document.getElementById('diffBox').classList.remove('show');
  if(wrongType){
    // 틀린것/아닌것 문제: 항상 정답(틀린 보기)과 FCOM 비교
    showDiff(shuffledOpts[correctIdx].text, q);
  } else if(i!==correctIdx){
    // 맞는것 문제: 오답 선택 시 선택한 보기와 FCOM 비교
    showDiff(shuffledOpts[i].text, q);
  }
  // Show FCOM explanation
  const explEl=document.getElementById('expl');
  const explBody=document.getElementById('explBody');
  if(q.e){explBody.textContent=q.e;explEl.classList.add('show');}
  else{explEl.classList.remove('show');}
  updateSB();saveState();
}

function nextQ(){idx++;render();saveState();}
function prevQ(){if(idx>0){idx--;render();saveState();}}
function updateSB(){
  document.getElementById('sc').textContent=corr;
  document.getElementById('sw').textContent=wrng;
  document.getElementById('sl').textContent=Math.max(0,queue.length-idx);
}
function showResult(){
  clearSave();
  document.getElementById('quizScr').classList.add('hide');
  const rs=document.getElementById('resultScr');rs.classList.add('show');
  const pct=queue.length?Math.round(corr/queue.length*100):0;
  document.getElementById('rpct').textContent=pct+'%';
  const g=pct>=90?'🏆 우수 – 합격 수준!':pct>=80?'✈️ 양호 – 조금만 더!':pct>=70?'📚 보통 – 복습 필요':'💪 더 열심히!';
  document.getElementById('rgrade').textContent=g;
  document.getElementById('rc').textContent=corr;
  document.getElementById('rw').textContent=wrng;
  document.getElementById('rt').textContent=queue.length;
}
function resetToSetup(){
  clearSave();
  document.getElementById('setupScr').style.display='block';
  document.getElementById('quizScr').classList.add('hide');
  document.getElementById('resultScr').classList.remove('show');
  updateSetupInfo();
}
</script></body></html>
