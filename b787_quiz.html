<head>

<title>B787 레이팅 퀴즈</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=JetBrains+Mono:wght@600&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans KR',sans-serif;background:#0d1117;color:#e6edf3;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:20px}
header{width:100%;max-width:760px;display:flex;justify-content:space-between;align-items:center;padding:14px 0 20px;border-bottom:1px solid #30363d;margin-bottom:24px}
h1{font-size:1.1rem;font-weight:700;display:flex;align-items:center;gap:8px}
.tag{background:#2f81f7;color:#fff;font-size:.65rem;font-weight:700;padding:2px 7px;border-radius:4px}
.sb{font-family:'JetBrains Mono',monospace;font-size:.82rem;color:#8b949e;display:flex;gap:14px}
.sb b{color:#e6edf3}
.wrap{width:100%;max-width:760px}
.prog{height:3px;background:#30363d;border-radius:2px;margin-bottom:26px}
.pf{height:100%;background:#2f81f7;border-radius:2px;transition:width .4s}
.badge{display:inline-block;font-size:.7rem;font-weight:700;color:#2f81f7;background:rgba(47,129,247,.12);border:1px solid rgba(47,129,247,.3);padding:3px 10px;border-radius:20px;margin-bottom:8px}
.meta{font-size:.75rem;color:#8b949e;font-family:'JetBrains Mono',monospace;margin-bottom:6px}
.card{background:#161b22;border:1px solid #30363d;border-radius:10px;padding:24px 26px;margin-bottom:14px}
.qt{font-size:.97rem;line-height:1.8;font-weight:500;white-space:pre-wrap}
.opts{display:flex;flex-direction:column;gap:9px;margin-bottom:16px}
.opt{display:flex;align-items:flex-start;gap:11px;background:#21262d;border:1px solid #30363d;border-radius:10px;padding:13px 16px;cursor:pointer;text-align:left;color:#e6edf3;font-family:'Noto Sans KR',sans-serif;font-size:.9rem;line-height:1.6;transition:border-color .15s,background .15s;width:100%}
.opt:hover:not(:disabled){border-color:#2f81f7;background:rgba(47,129,247,.07)}
.opt:disabled{cursor:default}
.lbl{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:.83rem;color:#8b949e;min-width:18px;flex-shrink:0;padding-top:2px}
.opt.ok{border-color:#3fb950;background:rgba(63,185,80,.1)}.opt.ok .lbl{color:#3fb950}
.opt.ng{border-color:#f85149;background:rgba(248,81,73,.08)}.opt.ng .lbl{color:#f85149}
.fb{border-radius:10px;padding:12px 16px;margin-bottom:14px;font-size:.88rem;font-weight:500;display:none}
.fb.show{display:block}
.fb.ok{background:rgba(63,185,80,.1);border:1px solid rgba(63,185,80,.35);color:#3fb950}
.fb.ng{background:rgba(248,81,73,.08);border:1px solid rgba(248,81,73,.3);color:#f85149}
.ans{color:#3fb950;font-weight:700}
.acts{display:flex;gap:9px}
.btn{padding:10px 20px;border-radius:10px;border:none;cursor:pointer;font-family:'Noto Sans KR',sans-serif;font-size:.88rem;font-weight:700;transition:opacity .15s}
.btnp{background:#2f81f7;color:#fff;flex:1}.btnp:hover{opacity:.88}
.btns{background:#21262d;color:#8b949e;border:1px solid #30363d}.btns:hover{color:#e6edf3}
.setup{width:100%;max-width:760px}
.stitle{font-size:1.5rem;font-weight:700;margin-bottom:6px}
.ssub{color:#8b949e;font-size:.88rem;margin-bottom:26px}
.seclbl{font-size:.75rem;font-weight:700;color:#8b949e;text-transform:uppercase;letter-spacing:1px;margin-bottom:10px}
.catrow{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:24px}
.catb{font-size:.7rem;font-weight:700;padding:4px 11px;border-radius:20px;border:1px solid #30363d;background:#21262d;color:#8b949e;cursor:pointer;font-family:'Noto Sans KR',sans-serif;transition:all .15s}
.catb.on{border-color:#2f81f7;background:rgba(47,129,247,.15);color:#2f81f7}
.cntrow{display:flex;gap:9px;margin-bottom:26px;flex-wrap:wrap}
.cntb{padding:7px 18px;border-radius:10px;border:1px solid #30363d;background:#21262d;color:#8b949e;cursor:pointer;font-family:'JetBrains Mono',monospace;font-size:.88rem;font-weight:700;transition:all .15s}
.cntb.on{border-color:#2f81f7;background:rgba(47,129,247,.15);color:#2f81f7}
.startb{background:#2f81f7;color:#fff;border:none;border-radius:10px;padding:13px;font-family:'Noto Sans KR',sans-serif;font-size:1rem;font-weight:700;cursor:pointer;width:100%;transition:opacity .15s}
.startb:hover{opacity:.88}
.result{display:none;text-align:center;padding:40px 10px}
.result.show{display:block}
.bigpct{font-size:4rem;font-weight:700;font-family:'JetBrains Mono',monospace}
.rlbl{color:#8b949e;font-size:.9rem;margin-bottom:20px}
.grade{font-size:1.25rem;font-weight:700;margin-bottom:26px}
.rstats{display:flex;justify-content:center;gap:32px;margin-bottom:32px}
.stat{display:flex;flex-direction:column;align-items:center;gap:3px}
.sn{font-size:1.8rem;font-weight:700;font-family:'JetBrains Mono',monospace}
.sl{font-size:.73rem;color:#8b949e}
.hide{display:none!important}
</style>
</head>

<script>
const L=['가','나','다','라'];
const Q=[
{c:'ELECTRICAL',q:'배터리 전원이 CCS Start-UP에 사용할 수 있는 유일한 전원인 경우, Left CCR이 Online 상태임을 나타내는 것은?',o:['The lower DU shows the default format','All displays and the HUD combiner show their default formats','The captains inboard and lower display units show the default formats (CDU pages)','The first officers inboard and outboard units show the default formats (CDU pages)'],a:2},
{c:'ELECTRICAL',q:'235VAC 시스템에 전원이 공급될 때 28VDC 시스템에 전원을 공급하는 것은?',o:['Four DC generators','Two standby inverters','Auto Transformer Units (ATUs)','Power conversion devices'],a:2},
{c:'ELECTRICAL',q:'Electric load shedding을 받는 항공기 시스템 목록이 시현되는 곳은?',o:['The electrical synoptic','Individual EICAS Messages panel','The ECL Non Normal Checklist','Individual equipment synoptic'],a:0},
{c:'ELECTRICAL',q:'Engine이 running 또는 forward external power가 On 선택 시, 어느 APU starter/generator가 Engine 시동에 사용되는가?',o:['Either the left or right starter generator','Both APU starter/generators','The right starter/generator','The left starter/generator'],a:3},
{c:'ELECTRICAL',q:'Main 235VAC BUS Distribution System의 주요 목적은?',o:['Provide power to the large motor controllers in the after E/E Bay','Provide power to the flight instrument','Provide power to the four electrical brake power supply units','Distribute power directly to a limited number of high voltage AC airplane systems'],a:3},
{c:'ELECTRICAL',q:'전원이 없는 항공기에서 Battery switch On 후 APU 시동 시, APU controller는 시동 전에 무엇을 기다리는가?',o:['The battery voltage of the main battery','APU inlet door position','That the common core system (CCS) applications are available','Fuel pressure from the right fuel manifold'],a:2},
{c:'ELECTRICAL',q:'Electric Power가 공급받는 전압 중 틀린 것은?',o:['Engine Generator: AC 235V','APU Generator: AC 115V','External Power: AC 115V','Ram Air Turbine: AC 235V'],a:1},
{c:'ELECTRICAL',q:'Electric Bus 설명 중 맞는 것은?',o:['Remote Power Distribution Unit은 10A 이상의 Load들에게 전력을 공급한다','Brake Power의 Main Source는 AC 130V이다','Forward 및 Aft External Power는 AC 235V Bus에 Electrical Power를 제공한다','APU Generator와 External Power는 동시에 항공기에 공급될 수 있다'],a:2},
{c:'ELECTRICAL',q:'Electric Synoptic 화면 설명 중 틀린 것은?',o:['Main 및 APU Battery 상태는 Status Page에서만 확인 가능하다','Engine당 2개의 Starter 모두 결함이 있으면 STARTERS Amber 문구가 나타난다','APU Start 시 Synoptic 상 확인이 가능하다','Load Shedding System List들을 확인할 수 있다'],a:0},
{c:'ELECTRICAL',q:'CBIC(Circuit Breaker Indications and Control) 설명 중 틀린 것은?',o:['Circuit Breaker는 Electric과 Thermal Type이 있다','Electric Circuit Breaker는 상태 확인 및 제어가 가능하다','Thermal Circuit Breaker는 제어가 가능하다','검색 기능을 사용하여 특정 Circuit Breaker를 찾을 수 있다'],a:2},
{c:'ELECTRICAL',q:'VFSG(Variable Frequency Starter Generator) 설명 중 틀린 것은?',o:['상황에 따라 Engine VFSG는 Starter와 Generator 기능을 모두 수행할 수 있다','APU Generator는 Starter와 분리되어 독립적 기능을 가진다','APU에는 2개의 VFSG가 있다','APU Battery로 APU Start 시 Right APU VFSG가 사용된다'],a:1},
{c:'ELECTRICAL',q:'ELEC GEN OFF L1, L2, R1, R2 Advisory message가 시현되는 시기는?',o:['The generator control breaker is open','The generator control breaker is close','The generator control valve is open','The generator control valve is close'],a:0},
{c:'ELECTRICAL',q:'Towing power switch가 On 위치에 있을 때 energized 되는 것은?',o:['Main batteries energize only the equipment essential for towing operations','The main and APU batteries energize only the equipment essential for towing operations','APU batteries energize only the equipment essential for towing operations','Stand-by batteries energize only the equipment essential for towing operations'],a:1},
{c:'ELECTRICAL',q:'B787 항공기 Electrical power source의 종류 중 맞는 것은?',o:['Three variable frequency engine starter/generators','Two variable frequency APU starter/generators','Two APU battery','Two external AC power receptacles'],a:1},
{c:'ELECTRICAL',q:'지상에서 Towing power mode Active 시 Navigation light에 전원을 공급하는 곳은?',o:['Main battery','Stand by battery','APU battery','APU battery와 Stand by battery'],a:2},
{c:'FIRE PROTECTION',q:'Engine fire and overheat detection system 설명 중 맞는 것은?',o:['Both loops must detect a fire or overheat condition to cause an engine fire warning or overheat caution','There are multiple dual channel detector assemblies in each engine nacelle. Each detector channel provides both fire and overheat detection','There are two detector loops in each engine nacelle. Each detector loop provides both fire and overheat detection','If a fault is detected in one loop, no further fire or overheat protection is provided'],a:2},
{c:'FIRE PROTECTION',q:'APU fire extinguishing system 설명 중 맞는 것은?',o:['There are two APU fire extinguisher bottles; rotating the switch in either direction discharges one bottle','In normal operation on the ground with both engines off, an APU overheat signal causes automatic shutdown','After discharge of the first bottle, rotating the APU fire switch in the opposite direction discharges the second bottle','On the ground with both engines off, an APU fire signal from either loop causes APU shutdown and bottle discharge'],a:3},
{c:'FIRE PROTECTION',q:'Forward cargo compartment에는 몇 개의 Smoke detector가 장착되어 있는가?',o:['17개','18개','19개','20개'],a:1},
{c:'FIRE PROTECTION',q:'FIRE TEST PASS warning message가 시현되는 시기는?',o:['Manually initiated test of the fire/overheat detection system has been started','Automatically initiated test of the fire/overheat detection system has been completed','Automatically initiated test of the fire/overheat detection system has been started','A manually initiated test of the fire/overheat detection system has been completed'],a:3},
{c:'FIRE PROTECTION',q:'Bulk cargo compartment에는 몇 개의 Smoke detector가 장착되어 있는가?',o:['2개','3개','4개','5개'],a:0},
{c:'FIRE PROTECTION',q:'다음 중 Engine Fire Switches가 자동으로 unlock되는 경우는?',o:['They must be manually unlocked','When the AUTOSTART switch is on','On the ground, anytime the APU is running','For a fire warning, or when the FUEL CONTROL switch is in CUTOFF'],a:3},
{c:'FIRE PROTECTION',q:'Cargo compartment에는 몇 개의 Fire extinguisher bottle이 장착되어 있는가?',o:['3개','4개','5개','6개'],a:3},
{c:'FIRE PROTECTION',q:'Wheel well fire 설명 중 틀린 것은?',o:['The main wheel well has fire and overheat detection','The main wheel well has fire extinguishing system','The nose wheel well does not have fire extinguishing system','The nose wheel well does not have a fire or overheat detection system'],a:1},
{c:'FIRE PROTECTION',q:'APU fire detection 설명 중 맞는 것은?',o:['The APU compartment has single fire detector loops','There are APU overheat and fire detection','Normally, one loop detects a fire to produce a fire warning','An APU fire warning automatically shuts down the APU'],a:3},
{c:'FIRE PROTECTION',q:'Engine fire and overheat detection 설명 중 틀린 것은?',o:['There are multiple dual-channel detector assemblies in each engine nacelle','Normally, dual elements on each channel must detect a fire or overheat condition','If a fault is detected in one channel, the remaining channel element automatically switches to single channel operation','The EICAS advisory message DET FIRE ENG (L or R) is displayed if the engine fire detection system fails'],a:2},
{c:'FIRE PROTECTION',q:'Engine overheat indication이 아닌 것은?',o:['The engine FUEL CONTROL (L or R) switch fire light illuminates','The caution beeper sounds','The master CAUTION lights illuminate','The EICAS caution message OVERHEAT ENG (L or R) is displayed'],a:0},
{c:'FIRE PROTECTION',q:'Engine에 장착된 Fire extinguisher bottle은 몇 개인가?',o:['2 for each engine (total 4)','2 for all engine (total 2)','1 for each engine (total 2)','4 for all engine (total 4)'],a:0},
{c:'FIRE PROTECTION',q:'Cargo compartment fire extinguishing 설명 중 틀린 것은?',o:['In flight, pushing the CARGO FIRE DISCHARGE switch also activates the extinguishing system','On the ground, three extinguisher bottles discharge simultaneously, with the third bottle at a reduced flow rate','In flight, a fire warning causes immediate discharge of two bottles. After 15 min, the remaining four bottles discharge at reduced flow rate','The EICAS advisory message BOTTLE DISCH CARGO is displayed after all bottles are discharged'],a:2},
{c:'FIRE PROTECTION',q:'Lavatory fire detection 설명 중 틀린 것은?',o:['If smoke is detected, an aural alert sounds in the lavatory and in the cabin','The EICAS warning message FIRE-SMOKE LAVATORY is displayed','The lavatory call light flashes and the master call light at the associated attendant station illuminates','Each lavatory has a single smoke detector'],a:3},
{c:'FUEL',q:'Center tank fuel pumps가 Main tank pumps보다 Higher output pressure를 갖는 이유는?',o:['The fuel must be lifted vertically to the engines','To move fuel a greater distance to the engines','To use center tank fuel before wing tank fuel','To jettison fuel if necessary'],a:2},
{c:'FUEL',q:'모든 Fuel pump를 작동시키기에 충분한 Power가 없을 때 올바른 설명은?',o:['The fuel system automatically determines the best pumps to operate depending on how much electrical power is available','When insufficient power, the DC fuel pump is the first to be load shed','Pumps are inhibited on the ground by programming until the flaps are extended','The center tank pumps are load shed first'],a:0},
{c:'FUEL',q:'운항승무원은 비행 중 Manual cross feed를 이용하여 어떻게 balance fuel을 실시하는가?',o:['By turning off the fuel pump switches','By pushing the fuel balance switch and turning off fuel pump switches on the tank with the lower quantity','By opening the cross feed valve and turning off fuel pumps on the main tank with the lower quantity','Access fuel in the center tank'],a:2},
{c:'FUEL',q:'B787 Fuel System의 특징 중 맞는 것은?',o:['Fuel Balance switch가 있어 쉽게 fuel Balancing이 가능하다','Nitrogen generation system이 장착되어 Fuel tank 내 산소농도를 높인다','Maximum allowable overfill은 1,000lbs다','APU AC pump가 있어 외부 전원이 없어도 APU는 동작 가능하다'],a:0},
{c:'FUEL',q:'각 Fuel tank Capacities가 바르게 연결된 것은?',o:['Left main tank - 36,984 Pounds','Left main tank - 36,974 Pounds','Center tank - 149,684 Pounds','Surge tank - 12,784 Pounds'],a:1},
{c:'FUEL',q:'Fuel quantity에 대한 설명 중 맞는 것은?',o:['각 Tank에 장착된 Sensor에서 측정한다','Total fuel quantity는 Third EICAS에 시현된다','Total fuel quantity는 Fuel synoptic에는 시현되지 않는다','정상 상황에서도 Fuel synoptic에는 Expended fuel indication이 시현된다'],a:3},
{c:'FUEL',q:'Nitrogen generation system 설명 중 맞는 것은?',o:['Forward cargo air에서 산소만 분리하여 화물의 화재 위험을 낮춘다','분리된 질소와 물은 다시 기내로 공급하여 쾌적함을 제공한다','고도와 상관없이 15%의 산소 농도를 Fuel tank 내 유지시킨다','공기 내 질소를 분리 후 Fuel tank에 공급하여 Fuel vapor로 인한 화재 위험을 최소화한다'],a:3},
{c:'FUEL',q:'FUEL DISAGREE Advisory message는 어느 경우에 시현되는가?',o:['Center tank와 Main tank의 연료 차이가 발생되었을 경우','Center tank와 Main tank의 연료 차이가 1,500lbs 이상일 경우','Totalizer와 Calculated의 연료 차이가 발생되었을 경우','Totalizer와 Calculated의 연료 차이가 1,500lbs 이상일 경우'],a:3},
{c:'FUEL',q:'Fuel temperature 설명 중 맞는 것은?',o:['Fuel temperature is displayed on the secondary EICAS display','The temperature is normally displayed in amber','During jettison, the TO REMAIN quantity replaces the EICAS display fuel temperature indications only','Fuel temperature and minimum fuel temperature are also displayed on the fuel synoptic display'],a:3},
{c:'FUEL',q:'Fuel pump operation 설명 중 맞는 것은?',o:['Regardless of main tank pump switch positions, a scavenge system automatically transfers remaining center tank fuel to main tanks','Fuel transfer by scavenge system begins when either main tank quantity is less than approximately 35,000 pounds and center tank pumps are off','The FUEL IN CENTER message means unusable fuel is in center tank','FUEL PUMP CENTER (L or R) displays when any center pump switch on is required'],a:1},
{c:'FUEL',q:'Fuel balance operation이 inhibit되는 조건이 아닌 것은?',o:['Prior to engine start and the APU is off','A center tank pump is on','In flight and the fuel jettison system is active','On the ground and both engines are shutdown'],a:1},
{c:'FUEL',q:'Fuel balance가 자동으로 꺼지는 조건이 아닌 것은?',o:['Jettison system is active','Fuel is balanced','FUEL IN CENTER message is displayed','Airplane is on ground and either engine running'],a:3},
{c:'FUEL',q:'Fuel jettison 설명 중 맞는 것은?',o:['The nozzles cannot open on the ground, regardless of switch positions','The fuel jettison system allows jettison from center fuel tank only','When the FUEL TO REMAIN quantity is reached, the crew must turn off nozzle L and R to stop jettison','There is no automatic system to set the fuel to remain'],a:0},
{c:'FUEL',q:'Fuel jettison 설명 중 틀린 것은?',o:['Do not jettison at flap 30','Nozzle VALVE Lights Illuminated (amber) - the jettison nozzle valve is not in the selected position','FUEL TO REMAIN Selector PULL ON - changes the mode from maximum landing weight to manual','Jettison nozzle valve selected on opens center tank jettison isolation valves, not main tank valves'],a:3},
{c:'FLIGHT MANAGEMENT',q:'FMS CDU의 Line selector key를 선택하였을 경우 나타나는 현상이 아닌 것은?',o:['Displayed emergency frequency on the scratchpad','Moves data from scratchpad to selected line','Selects page, procedure, or performance mode as applicable','Deletes data from selected line when DELETE displays in scratchpad'],a:0},
{c:'FLIGHT MANAGEMENT',q:'CDU help window에 NAV DATA OUT OF DATE가 시현되었다면 이 Message의 의미는?',o:['The correct database has been selected on the IDENT page','The current date not in data base range - select new data base on ident page','LNAV has been selected and a route has not been activated','FMC performance prediction are not available'],a:1},

{c:'PRESSURIZATION',q:'Pressurization System Automatic Operation 설명 중 틀린 것은?',o:['For takeoff, the system supplies a small negative pressurization prior to rotation to cause a smooth cabin altitude transition','In climb mode, cabin altitude increases on a schedule related to the airplane climb rate and flight plan cruise altitude','During descent, cabin altitude decreases to slightly below the FMC planned landing altitude','At touchdown, both outflow valves open to depressurize the cabin'],a:0},

{c:'FLIGHT CONTROL',q:'Complete loss of flight control signaling 시 올바른 것은?',o:['The electrically actuated stabilizer and two spoiler pairs allow pilot control of pitch and roll using the primary and alternate pitch trim switches and the control wheel','Redundant flight control programming in the ACEs is enabled by disconnecting the primary flight computers','Direct wiring from the flight deck to the stabilizer and a spoiler pair allow pilot control of pitch using the alternate pitch trim switches and roll using the control wheel','The flight controls are actuated by direct wiring to the hydraulic flight control actuators'],a:2},

{c:'OXYGEN',q:'Passenger cabin oxygen masks automatically drop prior to the cabin altitude reaching the greater of what altitude?',o:['13,500 feet, or 2000 feet above the origin or destination airfield','13,000 feet, or 1000 feet above origin or destination airfield +2000 feet','14,500 feet, or origin airfield altitude +1500 feet, or destination airfield altitude +1500 feet','14,000 feet, or 1000 feet above origin or destination airfield altitude +1000 feet'],a:2},

{c:'OXYGEN',q:'Passenger Cabin Oxygen System 설명으로 잘못된 것은?',o:['The system provides oxygen to the main seating area, galleys, flight attendant stations, overhead crew rest areas, and lavatories','The passenger cabin oxygen system is supplied by gaseous oxygen stored in small high pressure cylinders','Oxygen is available for approximately 100 minutes','The oxygen cylinders are single use devices and once activated, provides oxygen until the cylinder is depleted'],a:2},

{c:'AVIONICS / COMM',q:'VHF or HF radio transmits for more than 30 seconds - stuck mic protection에 대해 올바른 것은?',o:['The EICAS advisory message RADIO TRANSMIT CAPT, F/O, or OBS is displayed','On the ground the EICAS caution message STUCK MIC CAPT, F/O, OBS appears','Stuck microphone protection is available while airborne; the affected radio is disabled until reset on the ground','On the ground with the engine running, dashes appear in the respective TCP frequency line'],a:0},
{c:'AVIONICS / COMM',q:'TCP VHF page display function (Active entry option) 설명 중 올바른 것은?',o:['VHF pages 2, 3, and 4 can contain up to four stored frequencies. Frequencies stored during flight may not be manually deleted using the CLR key','For the selected radio, the frequency transfer switch moves the alternate frequency to become the active frequency. The previously active frequency is deleted','New frequencies are entered into the scratchpad. Entering the decimal and/or following zeros are optional','Scratchpad frequencies can only be entered into the standby windows'],a:2},
{c:'AVIONICS / COMM',q:'VHF Communication System 기능 설명 중 올바른 것은?',o:['When a VHF radio is tuned to frequency 121.5, all flight crews automatically monitor the radio','Each VHF radio is controlled only through its respective TCP','Only one VHF radio can operate in the DATA mode at one time','In the event of an electrical power loss, the right VHF radio and the right TCP continue to operate on standby power'],a:2},

{c:'AVIONICS / COMM',q:'Stuck Mic Protection 설명 중 잘못된 것은?',o:['VHF or HF radio transmits for more than 20 seconds, the EICAS caution message RADIO TRANSMIT is displayed','The EICAS advisory message RADIO TRANSMIT is removed when the transmission stops','On the ground, any VHF radio that transmits for more than approximately 35 seconds is automatically disabled','On the ground, several seconds before disablement, an intermittent tone can be heard through the audio system'],a:0},

const cats=[...new Set(Q.map(q=>q.c))];
let selCats=new Set(cats),qCount=10,queue=[],idx=0,corr=0,wrng=0,answered=false;

// build setup
const catRow=document.getElementById('catRow');
cats.forEach(cat=>{
  const b=document.createElement('button');
  b.className='catb on';b.textContent=cat;
  b.onclick=()=>{if(selCats.has(cat)){if(selCats.size>1){selCats.delete(cat);b.classList.remove('on');}}else{selCats.add(cat);b.classList.add('on');}};
  catRow.appendChild(b);
});
document.querySelectorAll('.cntb').forEach(b=>{
  b.onclick=()=>{document.querySelectorAll('.cntb').forEach(x=>x.classList.remove('on'));b.classList.add('on');qCount=parseInt(b.dataset.n);};
});
document.getElementById('startBtn').onclick=start;

function start(){
  const pool=Q.filter(q=>selCats.has(q.c)).sort(()=>Math.random()-.5);
  const n=qCount>=9999?pool.length:Math.min(qCount,pool.length);
  if(!n){alert('챕터를 선택하세요.');return;}
  queue=pool.slice(0,n);idx=0;corr=0;wrng=0;answered=false;
  document.getElementById('setupScr').style.display='none';
  document.getElementById('quizScr').classList.remove('hide');
  document.getElementById('resultScr').classList.remove('show');
  updateSB();render();
}

function render(){
  if(idx>=queue.length){showResult();return;}
  answered=false;
  const q=queue[idx];
  document.getElementById('badge').textContent=q.c;
  document.getElementById('meta').textContent='문제 '+(idx+1)+' / '+queue.length;
  document.getElementById('qt').textContent=q.q;
  document.getElementById('pf').style.width=(idx/queue.length*100)+'%';
  const oc=document.getElementById('opts');oc.innerHTML='';
  q.o.forEach((opt,i)=>{
    const b=document.createElement('button');
    b.className='opt';
    b.innerHTML='<span class="lbl">'+L[i]+'</span><span>'+opt+'</span>';
    b.onclick=()=>pick(i);
    oc.appendChild(b);
  });
  const fb=document.getElementById('fb');fb.className='fb';fb.innerHTML='';
  document.getElementById('nextBtn').classList.add('hide');
  updateSB();
}

function pick(i){
  if(answered)return;answered=true;
  const q=queue[idx];
  const btns=document.querySelectorAll('.opt');
  btns.forEach((b,j)=>{b.disabled=true;if(j===q.a)b.classList.add('ok');if(j===i&&i!==q.a)b.classList.add('ng');});
  const fb=document.getElementById('fb');
  if(i===q.a){corr++;fb.className='fb ok show';fb.innerHTML='<b>✓ 정답입니다!</b>';}
  else{wrng++;fb.className='fb ng show';fb.innerHTML='✗ 오답. 정답: <span class="ans">'+L[q.a]+'. '+q.o[q.a]+'</span>';}
  document.getElementById('nextBtn').classList.remove('hide');
  updateSB();
}

function nextQ(){idx++;render();}
function updateSB(){
  document.getElementById('sc').textContent=corr;
  document.getElementById('sw').textContent=wrng;
  document.getElementById('sl').textContent=Math.max(0,queue.length-idx);
}
function showResult(){
  document.getElementById('quizScr').classList.add('hide');
  const rs=document.getElementById('resultScr');rs.classList.add('show');
  const pct=queue.length?Math.round(corr/queue.length*100):0;
  document.getElementById('rpct').textContent=pct+'%';
  const g=pct>=90?'🏆 우수 – 합격 수준!':pct>=80?'✈️ 양호 – 조금만 더!':pct>=70?'📚 보통 – 복습 필요':'💪 더 열심히!';
  document.getElementById('rgrade').textContent=g;
  document.getElementById('rc').textContent=corr;
  document.getElementById('rw').textContent=wrng;
  document.getElementById('rt').textContent=queue.length;
}
function resetToSetup(){
  document.getElementById('setupScr').style.display='block';
  document.getElementById('quizScr').classList.add('hide');
  document.getElementById('resultScr').classList.remove('show');
}
</script></body></html>
