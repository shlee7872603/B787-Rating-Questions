{c:'MASTER WARNING',q:'EICAS messages 에 대한 설명 중 맞는 것은?',o:['EICAS alert messages are the primary method to alert the crew to non-normal conditions','EICAS communication messages are crew reminders of certain flight crew selected normal conditions','EICAS memo messages indicate equipment faults which may affect airplane dispatch capability','EICAS status messages direct the crew to normal'],a:0,e:'FCOM 15.20.2. EICAS Messages\nSystems conditions and configuration information is provided to the crew by four\ntypes of EICAS messages:\n• EICAS alert messages are the primary method to alert the crew to\nnon-normal conditions\n• EICAS communication messages direct the crew to normal communication\nconditions and messages\n• EICAS memo messages are crew reminders of certain flight crew selected\nnormal conditions\n• EICAS status messages indicate equipment faults which may affect airplane\ndispatch capability\nAn EICAS alert, communications, or memo message is no longer displayed when\nthe respective condition no longer exists.\nEICAS Alert Messages\nFrom after engine start until engine shut down, EICAS alert messages are the\nprimary means to alert the crew to non-normal conditions which may impact\nother operations during the flight.\nThere is a non-normal procedure for each EICAS alert message. The procedure for\nevery EICAS alert message is included as a checklist in the QRH. Procedures for ...'},
{c:'MASTER WARNING',q:'EICAS message 가 2 page 이상일 경우 Next page를 시현 시키는 방법은?',o:['Push the NXT(Next) switch','Push the EICAS switch again','Push the CANC/RCL(Cancel/Recall switch)','Push the MSG(Message) switch'],a:2,e:'FCOM 15.10.4. Cancel/Recall (CANC/RCL) Switch\nPush (when EICAS caution or advisory messages displayed) –\n• displays the next page of EICAS messages when additional pages exist\n• cancels caution and advisory messages when last page displayed; warning,\nmemo, and communications messages remain displayed\n• cancels red box for any engine parameter previously exceeded\nwhen the exceedance no longer exists\nPush (when no EICAS caution or advisory messages displayed) –\n• redisplays all caution and advisory EICAS messages, when non-normal condition\nexists\n• displays first page of messages when multiple pages exist\n• redisplays red box for parameters previously exceeded.\nFCOM 15.20.3 Display and Manipulation of EICAS Messages\nIf more than one EICAS alert message is displayed, the messages are displayed in a list which is\ngrouped by priority level. EICAS warning messages are displayed in red at the top of the message\nlist. ...'},
{c:'MASTER WARNING',q:'Tail strike detection system 에 관한 설명 중 틀린 것은?',o:['Detects ground contact which could damage the airplane pressure hull','A two inch blade target and two frangible wires are installed on the aft body of the airplane','The EICAS caution message TAIL STRIKE is displayed when a tail strike is detected.','Tail strike indication is accompanied by a beeper and Master warning light'],a:3,e:'FCOM 15.20.13. Tail Strike Detection System\nThe tail strike alert system detects ground contact which could damage the\nairplane pressure hull.\nA two inch blade target and two frangible wires are installed on the aft body\nof the airplane.\nThe EICAS caution message TAIL STRIKE is displayed when a tail strike is\ndetected.\nThis indication is accompanied by a beeper and Master CAUTION light.'},
{c:'MASTER WARNING',q:'항공기가 지상에서 Takeoff configuration warning function 이 Arm 되는 시기는?',o:['Both engine thrust is in takeoff range','Fuel control switches are in Run position','Thrust reversers are locked','Airspeed is less than Vmcg'],a:1,e:'FCOM 15.20.13. Takeoff Configuration Warnings\nThe takeoff configuration warning function is armed when:\n• airplane is on the ground, and\n• FUEL CONTROL switches are in RUN position, and\n• either engine thrust is in takeoff range, and\n• airspeed is less than V1'},
{c:'MASTER WARNING',q:'항공기가 지상에서 Takeoff configuration warning function 이 Arm 되는 시기는?',o:['Both engine thrust is in takeoff range','Either fuel control switches are in Run position','Thrust reversers are locked','Airspeed is less than V1'],a:3,e:'FCOM 15.20.13. Takeoff Configuration Warnings\nThe takeoff configuration warning function is armed when:\n• airplane is on the ground, and\n• FUEL CONTROL switches are in RUN position, and\n• either engine thrust is in takeoff range, and\n• airspeed is less than V1'},
{c:'MASTER WARNING',q:'PFD에 시현 되는 Alert 는?',o:['Auto throttle disengaged alert','Thrust asymmetry maximum speed','Time critical warnings','High and low altitude alert'],a:2,e:'FCOM 15.10.7. Alerts Displayed on the PFD\nNO AUTOLAND Alert,\nThrust Asymmetry Minimum Speed,\nTime Critical Warnings'},
{c:'MASTER WARNING',q:'다음 airspeed alert 설명 중 틀린 것은?',o:['Takeoff V1 Airspeed - The voice annunciation VEE ONE sounds 1 second before reaches V1 during takeoff','Thrust Asymmetry Minimum Speed (TAMS) - is displayed on the speed tape to provide pilots with situational awareness of the minimum control speed for operation with a large thrust asymmetry','AIRSPEED LOW is displayed and the box around the current airspeed indication on the PFD is highlighted amber when airspeed is below minimum maneuvering speed','OVERSPEED is displayed if airspeed is greater than VMO/MMO. The message cannot be canceled by pushing Master WARNING/CAUTION Reset switch'],a:0,e:'FCOM 15.20.12. Airspeed Alerts\nAirspeed Low : The EICAS caution message AIRSPEED LOW is displayed and the box around the\ncurrent airspeed indication on the PFD is highlighted amber when airspeed is below minimum\nmaneuvering speed. This indication is accompanied by a beeper and Master WARNING/CAUTION\nlight.\nTakeoff V1 Airspeed : The voice annunciation VEE ONE sounds when airspeed reaches V1\nduring takeoff.\nThrust Asymmetry Minimum Speed (TAMS) : TAMS is displayed on the speed tape to provide\npilots with situational awareness of the minimum control speed for operation with a large thrust\nasymmetry. TAMS varies with weight and CG and is approximately equal to the minimum control\nspeed for the current thrust applied during takeoff or go-around.\nWhen airspeed decreases to TAMS, the AIRSPEED, AIRSPEED aural sounds and the Master\nWARNING light illuminates.\nOverspeed Warning : The EICAS warning message OVERSPEED is displayed if airspeed is greater\nthan VMO/MMO. ...'},
{c:'MASTER WARNING',q:'다음 airspeed alert 설명 중 틀린 것은?',o:['Takeoff V1 Airspeed - The voice annunciation VEE ONE sounds before reaches V1 during takeoff','Thrust Asymmetry Minimum Speed (TAMS) - is displayed on the speed tape to provide pilots with situational awareness of the maximum control speed for operation with a large thrust asymmetry','AIRSPEED LOW is displayed and the box around the current airspeed indication on the PFD is highlighted amber when airspeed is below minimum maneuvering speed','OVERSPEED is displayed if airspeed is greater than VMO/MMO. The message cannot be canceled by pushing Master WARNING/CAUTION Reset switch'],a:1,e:'FCOM 15.20.12. Airspeed Alerts\nAirspeed Low : The EICAS caution message AIRSPEED LOW is displayed and the box around the\ncurrent airspeed indication on the PFD is highlighted amber when airspeed is below minimum\nmaneuvering speed. This indication is accompanied by a beeper and Master WARNING/CAUTION\nlight.\nTakeoff V1 Airspeed : The voice annunciation VEE ONE sounds when airspeed reaches V1\nduring takeoff.\nThrust Asymmetry Minimum Speed (TAMS) : TAMS is displayed on the speed tape to provide\npilots with situational awareness of the minimum control speed for operation with a large thrust\nasymmetry. TAMS varies with weight and CG and is approximately equal to the minimum control\nspeed for the current thrust applied during takeoff or go-around.\nWhen airspeed decreases to TAMS, the AIRSPEED, AIRSPEED aural sounds and the Master\nWARNING light illuminates.\nOverspeed Warning : The EICAS warning message OVERSPEED is displayed if airspeed is greater\nthan VMO/MMO. ...'},
{c:'POWER PLANT / APU',q:'전원이 공급되지않는 상태의 항공기에서 Battery switch를 on 위치로 이동 시킨 직후 APU를 시동 한다면, APU controller 는 APU 시동이 진행되기 전에 무엇을 기다리는가?',o:['The battery voltage of the main battery','APU inlet door position','That the common core system(CCS) applications are available','Fuel pressure from the right fuel manifold'],a:2,e:'FCOM 7.30.2. APU Start\nThe APU is started by either the left or right APU starter.\nEither starter can be powered by forward external power or an engine generator.\nThe APU battery powers the APU controller (APUC), air inlet door, and the right\nstarter if required. The main airplane battery powers the APU fuel shutoff valve, DC\nfuel pump, and fire detection system.\nRotating the APU selector to START begins the automatic start sequence.\nNote: If starting the APU from an unpowered airplane (battery switch recently\nmoved to ON), the APUC waits until the common core system (CCS)\napplications are available before proceeding with the start.\nThe CCS fire detection and fuel management applications are necessary\nto start the APU and are available when the CDU page is visible on the\nlower display unit.'},
{c:'POWER PLANT / APU',q:'Engine failure alert system이 Both PFD 에 Red ENG FAIL annunciation 와 Both HUD 에 ENG FAIL을 시현 시켜 주는 시기는? FCOM 7.20.19',o:['During takeoff with the airspeed between 65 knots and 6 knots prior to V1 if actual thrust is less than commanded thrust','Anytime time during flight where the engine performance is more than the commanded engine performance','During approach when less than 1,000 feet AGL and the engine is producing more commanded thrust, and the actual thrust is not satisfactorily decreasing towards the commanded thrust','During takeoff at any speed if the engine is producing less than commanded thrust, and the actual thrust is not satisfactorily increasing towards the commanded thrust'],a:0,e:'FCOM 7.20.19. Engine Failure Alert System\nThe engine failure alert system provides alerts when actual engine performance\nis less than commanded engine performance during a part of the takeoff and\nfor other phases of flight.\nA red ENG FAIL is displayed on both PFDs, and ENG FAIL is displayed on both\nHUDs if actual thrust is less than commanded thrust during takeoff with\nairspeed between 65 knots and 6 knots prior to V1.\nThe PFD and HUD displays are accompanied by the voice annunciation\n“Engine Fail,” and the Master WARNING lights illuminating.\nThe EICAS caution message ENG FAIL (L or R) is displayed if an engine\nunexpectedly decelerates to less than idle speed. The message remains displayed\nuntil the engine recovers or the fuel control switch is moved to CUTOFF.'},
{c:'POWER PLANT / APU',q:'B787 GEnx-1B74/75 Engine 의 설명 중 맞는 것은?',o:['Chevron Shape Nacelle이 장착되어 Engine 소음이 전혀 없다','EDTO는 120분까지 FAA에서 인가 받았다','Takeoff thrust 는 각각 74,100 pounds 이다','Engine Bleed Air를 전혀 사용하지 않아 연료를 절감되었다'],a:2,e:'FCOM 7.20.1 Introduction\nThe airplane is powered by two General Electric GEnx-1B74/75 engines.\nThe engines are rated at 74,100 pounds of takeoff thrust each.'},
{c:'POWER PLANT / APU',q:'B787 GEnx-1B74/75 Engine 의 설명 중 맞는 것은?',o:['Chevron Shape Nacelle이 장착되어 Engine 소음이 전혀 없다','EDTO는 120분까지 FAA에서 인가 받았다','Takeoff thrust 는 각각 74,200 pounds 이다','Engine Bleed Air를 전혀 사용하지 않아 연료를 절감되었다'],a:3,e:'FCOM 7.20.1 Introduction\nThe airplane is powered by two General Electric GEnx-1B74/75 engines.\nThe engines are rated at 74,100 pounds of takeoff thrust each.'},
{c:'POWER PLANT / APU',q:'Secondary engine indication 이 시현 되는 경우는?',o:['항공기 처음으로 Electrical Power를 공급 받을 때','Secondary Engine Parameter 중 Exceedance가 발생될 때','Start Selector가 START 위치일 때','위 모두 맞다'],a:3,e:'FCOM 7.20.2 Secondary Engine Indications\nSecondary engine indications are displayed on EICAS below the primary engine\nindications. The secondary engine indications can be displayed by pushing either\nsecondary engine display switch (ENG on the display select panel).\nThe secondary engine indications are automatically displayed when:\n• the displays initially receive electrical power\n• a FUEL CONTROL switch is moved to CUTOFF in flight\n• an engine fire switch is pulled in flight\n• a secondary engine parameter is exceeded\n• engine N2 RPM is below idle in flight\n• a start selector is in the START position\n• FUEL FLOW ENG L/R Advisory is shown'},
{c:'POWER PLANT / APU',q:'Secondary engine indication 이 시현 되는 경우는?',o:['Lower display가 처음으로 전원을 공급 받을 때','Secondary Engine Parameter 중 Exceedance가 발생될 때','fuel control SW “RUN”일때','N1이 IDLE 밑으로 떨어질때'],a:1,e:'FCOM 7.20.2 Secondary Engine Indications\nSecondary engine indications are displayed on EICAS below the primary engine\nindications. The secondary engine indications can be displayed by pushing either\nsecondary engine display switch (ENG on the display select panel).\nThe secondary engine indications are automatically displayed when:\n• the displays initially receive electrical power\n• a FUEL CONTROL switch is moved to CUTOFF in flight\n• an engine fire switch is pulled in flight\n• a secondary engine parameter is exceeded\n• engine N2 RPM is below idle in flight\n• a start selector is in the START position\n• FUEL FLOW ENG L/R Advisory is shown'},
{c:'POWER PLANT / APU',q:'Engine Oil System 설명 중 틀린 것은?',o:['EICAS Message나 Protection 기능이 없어 결함 발생 시 수동으로 Engine Shutdown 해야한다','Oil Temperature의 Amber Mark는 Caution Range reached를 나타낸다','Oil Quantity가 Low 시 \'LO\' Text가 표시된다','Oil Pressure의 Red Mark는 Limit reached를 나타낸다'],a:0,e:'FCOM 7.10.10. Oil Temperature :\nEngine oil temperature (ºC), displayed:\n• (white) – normal operating range\n• (amber) – caution range reached\n• (red) – operating limit reached\nFCOM 7.10.12. Oil Pressure Pointer :\nEngine oil pressure, displayed:\n• (white) – normal operating range\n• (amber) – caution range reached\n• (red) – operating limit reached\nFCOM 7.10.11. Oil Quantity :\nUsable oil quantity (quarts). Displayed:\n• (white) – normal quantity\n• (black numbers on white background) – low quantity\nNote : LO – displayed (white) when quantity is low.'},
{c:'POWER PLANT / APU',q:'Starting Indication 설명 중 맞는 것은?',o:['시동 시 지상에서는 Auto start mode를 시현 하고, In flight 시 에는 Manual start mode를 시 현 한다','Engine이 정상적으로 Start 후 Idle 이상 시 Green color로 RUNNING text가 30초간 표시된다','In flight 중에 Engine start가 가능한 최저 고도와 Airspeed Range가 표시된다','Engine start 중 Engine idle이하에서는 Idle target indication이 amber color로 나타난다'],a:1,e:'FCOM 7.10.8. RUNNING Indication\nDisplayed (green) : • fuel control switch is in the RUN position, and\n• engine is at or above idle\nThe RUNNING indication blanks 30 seconds after engine reaches idle.\nFCOM 7.10.8. Starting Mode\nAUTOSTART (white) – EEC is in autostart mode.\nThe AUTOSTART indication blanks when the system is no longer attempting an engine start.\nAUTORELIGHT (white) – EEC is in auto-relight mode.\nThe AUTORELIGHT indication blanks when the system is no longer attempting an engine relight.\nFCOM 7.10.8 Idle Target Indication\nIndicates approximate RPM where the engine can maintain self-sustained running operation.\nDisplayed (green) : • fuel control switch is in the RUN position, and\n• engine is below idle\nFCOM 7.10.5. In-Flight Start Envelope\nDisplayed (magenta) – airspeed range necessary for an in-flight start at the current flight level\nor maximum flight level (whichever is less) when the respective engine fire switch is in and:\n• the FUEL CONTROL switch is in CUTOFF, or ...'},
{c:'POWER PLANT / APU',q:'EEC와 EEC Mode에 대한 설명 중 틀린 것은?',o:['EEC mode는 Normal mode, soft Alternate mode와 hard Alternate Mode가 있다','Forward position일 때 EEC에 의해 계산된 Maximum rated thrust가 설정된다','Soft alternate mode는 자동으로 전환된다','Hard alternate mode로 전환 전 Thrust lever를 Over boost를 방지하기 위해 Full forward 위치를 유지해야 한다'],a:3,e:'FCOM 7.20.3. Electronic Engine Control (EEC)\nEach EEC has full authority over engine operation. The EEC uses thrust lever\ninputs to automatically control forward and reverse thrust. The EEC has two\ncontrol modes: normal and alternate. In both normal and alternate modes, the\nEEC uses N1 RPM as the controlling parameter.\nEEC Normal Mode\nIn the normal mode, the EEC sets thrust by controlling N1 based on thrust lever\nposition. N1 is commanded by positioning the thrust levers either automatically\nwith the autothrottles, or manually by the flight crew.\nMaximum N1 represents the maximum rated thrust available from the engine. The\nEEC continuously computes maximum N1.\nMaximum rated thrust is available in any phase of flight by moving the thrust\nlevers to the full forward positions.\nEEC Alternate Mode\nIf the required signals are not available to operate in the normal mode, the\nEEC automatically uses the alternate mode. In the alternate mode, the EEC ...'},
{c:'POWER PLANT / APU',q:'Engine Idle에 대한 설명 중 틀린 것은?',o:['Approach Idle, Minimum Idle과 Icing Idle Mode가 있다','지상과 공중의 대부분은 Minimum Idle로 동작한다','지상에서 Thrust Reverser가 Deploy 되거나 Touchdown 후 5초 동안 Approach Idle Mode 가 된다','Wing Anti-ice System 동작하면 Icing Idle로 전환된다'],a:3,e:'FCOM 7.20.9 EEC Idle Selection\nThe EEC selects minimum idle, approach idle, icing idle automatically.\nMinimum idle is a lower thrust than approach idle.\nMinimum idle is selected for ground operation and most phases of flight.\nApproach idle is selected in flight when:\n• the flaps are commanded to 25 or greater, or\n• the landing gear is selected DOWN\nApproach idle decreases engine acceleration time for go–around.\nApproach idle is maintained until after touchdown when the EEC selects\nminimum idle.\nIcing idle is selected when : • engine anti-ice on'},
{c:'POWER PLANT / APU',q:'B787 항공기 Engine 설명 중 맞는 것은?',o:['The N1 and N2 rotors are mechanically connected','The engine gearbox is driven by the high speed N1 engine shaft.','If engine data is not available, the associated engine indication blanks. ENG INDICATE EICAS message is displayed','N1 and EGT are displayed full-time on the EICAS display'],a:3,e:'FCOM 7.20.1. Introduction\nThe airplane is powered by two General Electric GEnx-1B74/75 engines. The engines are rated at 74,100\npounds of takeoff thrust each.\nThe engine is a two rotor axial flow turbofan engine of high compression and bypass ratio. The N1 rotor\nconsists of a fan, a low pressure compressor section, and low pressure turbine section on a common shaft.\nThe N2 rotor consists of a high pressure compressor section and a high pressure turbine section on a\ncommon shaft.\nThe N1 and N2 rotors are mechanically independent.\nThe engine accessory gearbox is driven by the high speed N2 engine shaft.\nEach engine is controlled by an EEC. The EECs monitor autothrottle and flight crew inputs through the thrust\nlevers to automatically control the engines.\nFCOM 7.20.1. Engine Indications\nPrimary and secondary engine indications are provided only on the EICAS display. The EICAS is normally ...'},
{c:'POWER PLANT / APU',q:'Secondary engine indication 설명 중 맞는 것은?',o:['When secondary engine parameters are automatically displayed on EICAS, they cannot be cleared until the condition is no longer present','Engine EGT is secondary indication. If maximum continuous limit reached, it is displayed automatically','After engine is reached idle, RUNNING indication blanks 10 seconds','Fuel flow indication displays pounds per minute X 1000'],a:0,e:'FCOM 7.20.2 Secondary Engine Indications\nThe secondary engine indications are:\n• N2 • fuel flow • oil pressure • oil temperature • oil quantity • engine vibration\nSecondary engine indications are displayed on EICAS below the primary engine indications. The secondary\nengine indications can be displayed by pushing either secondary engine display switch (ENG on the display\nselect panel). The secondary engine indications are automatically displayed when:\n• the displays initially receive electrical power\n• a FUEL CONTROL switch is moved to CUTOFF in flight\n• an engine fire switch is pulled in flight\n• a secondary engine parameter is exceeded\n• engine N2 RPM is below idle in flight\n• a start selector is in the START position\n• FUEL FLOW ENG L/R Advisory is shown\nWhen secondary engine parameters are automatically displayed on EICAS due to any of the above\nconditions, they cannot be cleared until the condition is no longer present. After the condition is resolved, ...'},
{c:'POWER PLANT / APU',q:'EEC idle이 아닌 것은?',o:['Minimum idle','Approach idle','Ice idle','Reverse idle'],a:3,e:'FCOM 7.20.9 EEC Idle Selection\nThe EEC selects minimum idle, approach idle, icing idle automatically.\nMinimum idle is a lower thrust than approach idle.\nMinimum idle is selected for ground operation and most phases of flight.\nApproach idle is selected in flight when:\n• the flaps are commanded to 25 or greater, or\n• the landing gear is selected DOWN\nApproach idle decreases engine acceleration time for go–around.\nApproach idle is maintained until after touchdown when the EEC selects\nminimum idle.\nIcing idle is selected when : • engine anti-ice on'},
{c:'POWER PLANT / APU',q:'EEC alternate mode에서 작동 하지 않는 것은? 10. FAIL을 시현 시켜 주는 시기는?',o:['Auto throttle','Low speed protection','Over speed protection','Maximum and red line N1 information'],a:2,e:'FCOM 7.20.5. EEC Alternate Mode\nFor the normal, soft alternate, and hard alternate modes; actual, command,\nreference/target, maximum and red line N1 information is displayed.\nAutomatic reversion or manual selection to the alternate mode is indicated by the EICAS\nadvisory message ENG EEC MODE (L, R) and illumination of the EEC ALTN light on the\nassociated EEC mode switch. Selecting the alternate mode on both engines eliminates thrust\nlever stagger at equal thrust settings, or asymmetric thrust when the thrust levers are\noperated together.\nThe autothrottles remain connected whenever the EEC automatically switches to the\nalternate mode. The alternate mode N1 reference/target values are computed by the FMC.\nNote : Autothrottles remain connected in the soft or hard alternate mode.\nThe alternate mode schedule (N1 schedule) provides equal or greater thrust than the normal\nmode for the same thrust lever position. ...'},
{c:'POWER PLANT / APU',q:'Reverser system 이 Activated 되었을 경우 나타나는 현상이 아닌 것은?',o:['The reverser translating sleeves hydraulically move after','The reverse thrust levers can be raised to the maximum reverse thrust position','The fan flow blocker doors rotate into place to direct fan air through stationary cascade guide vanes','The reverser indication REV is displayed in amber above each digital N1 indication'],a:1,e:'FCOM 7.20.16. Thrust Reverser System\nEach engine has a hydraulically actuated fan air thrust reverser. Reverse thrust is available only on the\nground.\nThe reverse thrust levers can be raised only when the forward thrust levers are in the idle position. When the\nreverse thrust levers are raised, the EEC opens the reverser isolation valve. The EEC inhibits reverser isolation\nvalve actuation and reverser deployment unless the airplane is on the ground with the engine running.\nThe EECs also control thrust limits during reverser operation.\nThere is a physical interlock located in the aisle stand to prevent movement of the reverse thrust lever beyond\nthe reverse idle position until the cowl is partially deployed. The interlock provides tactile feedback to the pilot\nthat the thrust reverser is or is not deployed.\nWhen the reverse thrust levers are pulled aft to the interlock position:\n• the autothrottle disengages\n• the auto speedbrakes deploy\nWhen the reverser system is activated: ...'},
{c:'POWER PLANT / APU',q:'APU 에 대한 설명 중 맞는 것은?',o:['When the APU is running (95% of target speed + 2 seconds), there is No EICAS message','During the cool down period, the APU cannot be returned to its running condition by placing the APU selector back to ON','In flight, if three or more engine generators go offline, the APU automatically starts, regardless of APU selector position','There is 2 minutes cool down period when the APU is manually shut down after the APU LIMIT message is displayed'],a:2,e:'FCOM 7.30.2.\nWhen the APU is running (95% of target speed + 2 seconds), the EICAS memo\nmessage APU RUNNING is displayed and the APU is ready to power the airplane.\nFCOM 7.30.3 APU Automatic Start\nIn flight, if three or more engine generators go offline, the APU automatically starts,\nregardless of APU selector position. When the automatic start condition is no longer\nvalid, the APU can be shut down by positioning the selector to ON, then OFF. When the\nautomatic start condition is valid, the APU can only be shut down by pulling the APU fire\nswitch.\nFCOM 7.30.3 APU Shutdown\nWhen the APU selector is rotated to OFF, the APUC initiates a normal shutdown\nsequence. The APU continues running in a two minute cooldown cycle. The EICAS\nmemo message APU COOLDOWN is displayed. At any time during the cooldown\nperiod, the APU may be returned to its running condition by placing the APU selector\nback to ON..'},
{c:'AIR CONDITIONING',q:'Flight Deck Temperature (FLT DECK TEMP) Control의 Mid position (12 o’clock) sets approximately ( )° C FCOM 2.10.2',o:['22° C','23° C','24° C','25° C'],a:2,e:'FCOM 2.10.2. Flight Deck Temperature (FLT DECK TEMP) Control\n• selects the target flight deck temperature\n• turning the control toward C or W sets the desired temperature between 18° C and 29° C.\nMid position (12 o’clock) sets approximately 24° C\n◈ 암기 방법?^^\n• 사람 : 소중하니까………..최저 18℃ (보통 가정용 에어컨) / 2℃ 씩 미세조절 6칸 +12℃ → 30℃ - 1℃ = 29℃\n• 화물 : 상하면 안되니까…최저 4℃ (보통 가정용 냉장고)  / 4℃ 씩 과감조절 6칸 +24℃ → 28℃ - 1℃ = 27℃\nBULK CARGO (AUTO) : 동식물 모두 가장 무난한 온도는….아마도 21℃'},
{c:'AIR CONDITIONING',q:'TRIM AIR Switches가 FAULT illuminated (amber) 되는 경우가 아닌 것은?',o:['The trim air valve is failed closed','The trim air valve is commanded closed because of a zone supply duct overheat','The trim air valve is commanded open','The TRIM AIR switch is selected off'],a:2,e:'FCOM 2.10.3. TRIM AIR Switches\nFAULT illuminated (amber) :\n• the trim air valve is failed closed, or\n• the trim air valve is commanded closed because of a zone supply duct\noverheat, or\n• the TRIM AIR switch is selected off'},
{c:'AIR CONDITIONING',q:'Cabin Temperature (CABIN TEMP) Control에서 automatic passenger cabin temperature control 관련 내용 중 괄호 안에 맞는 내용을 고르시오. “Turning the control toward C or W sets the passenger cabin master reference temperature ( )”. FCOM 2.10.3',o:['Between 17° C and 27° C.','Between 18° C and 30° C.','Between 15° C and 29° C.','Between 18° C and 29° C.'],a:3,e:'FCOM 2.10.3. Cabin Temperature (CABIN TEMP) Control\nProvides automatic passenger cabin temperature control. Turning the control\ntoward C or W sets the passenger cabin master reference temperature between\n18° C and 29° C..'},
{c:'AIR CONDITIONING',q:'Air Conditioning Reset (AIR COND RESET) Switch를 PUSH 했을 때의 내용으로 잘못된 것은?',o:['Resets any air conditioning faults and attempts to restart normal operation','Resets any trim air valves held open due to overheat, control failure, or valve failure','Attempts to reset a failed recirculation fan','Resets fault protection'],a:1,e:'FCOM 2.10.3. Air Conditioning Reset (AIR COND RESET) Switch\nPush :\n• resets any air conditioning faults and attempts to restart normal operation\n• resets any trim air valves held closed due to overheat, control failure,\nor valve failure\n• attempts to reset a failed recirculation fan\n• resets fault protection'},
{c:'AIR CONDITIONING',q:'Alternate Ventilation (VENTILATION) Switch의 ALTN 가 amber로 illuminated 되는 경우 The Forward and Aft Outflow Valves are automatically repositioned towards the ten and one o’clock positions respectively 되는 항공기의 고도는? FCOM 2.10.4',o:['When airplane is below 10,000 ft altitude and not on ground.','When airplane is below 13,000 ft altitude and not on ground.','When airplane is below 14,000 ft altitude and not on ground.','When airplane is below 20,000 ft altitude and not on ground.'],a:1,e:'FCOM 2.10.4. Alternate Ventilation (VENTILATION) Switch\nNORM – environmental control system is configured for normal operation\nALTN (illuminated amber) - the Forward and Aft Outflow Valves are automatically\nrepositioned towards the ten and one o’clock positions respectively\nwhen airplane is below 13,000 ft altitude and not on ground.'},
{c:'AIR CONDITIONING',q:'Shoulder and Foot Heaters에 대한 설명 중 잘못된 것은?',o:['SHOULDER HEATER Control is available on ground and in-flight.','SHOULDER HEATER Control 의 LOW는 electric heater operates on low setting 을 의미한다','FOOT HEATER Control의 LOW는 electric heater 의 off 상태이다','FOOT HEATER Control is available on ground and in-flight when pack and recirculation fans are on'],a:0,e:'FCOM 2.10.4. Shoulder and Foot Heaters\nSHOULDER HEATER Control\nLOW – electric heater operates on low setting.\nTurn – the electric heater adds heat to the conditioned air flowing in at shoulder\nlevel at variable temperature settings up to HIGH.\nNote : Available in-flight only.\nFOOT HEATER Control\nLOW – electric heater is off.\nTurn – electric heater adds heat to the floor plate at variable temperature settings\nup to HIGH.\nNote : Available on ground and in-flight\nwhen pack and recirculation fans are on.'},
{c:'AIR CONDITIONING',q:'Forward Cargo Air Conditioning (FWD CARGO A/C) Control에 의해 조절되는 desired target temperature 의 범위는? FCOM 2.10.6',o:['Between 3° C and 28° C.','Between 4° C and 27° C.','Between 18° C and 29° C','Between 4° C and 29° C'],a:1,e:'FCOM 2.10.5. Forward Cargo Air Conditioning (FWD CARGO A/C) Control\nProvides automatic temperature control for the forward cargo compartment\nTurning the control toward C or W sets the desired target temperature between\n4° C and 27° C.\nMid position (12 o’clock) sets approximately 16° C\nOFF – disables heater and cargo refrigeration unit. Normal cargo heating is\nprovided by the forward E/E exhaust ventilation system.\nBULK CARGO TEMP Switch\nAUTO – bulk cargo heat system targeting 21° C.\nOff (AUTO not visible) – bulk cargo heat is commanded off.\nOFF (illuminated amber) : • BULK CARGO TEMP switch selected off\n• bulk cargo heater overheat'},
{c:'AIR CONDITIONING',q:'Forward Cargo Air Conditioning (FWD CARGO A/C) Control을 Mid position (12 o’clock)에 set 했을 경우 유지되는 desired target temperature는? FCOM 2.10.6',o:['Approximately 15° C','Approximately 16° C','Approximately 18° C','Approximately 24° C'],a:1,e:'FCOM 2.10.5. Forward Cargo Air Conditioning (FWD CARGO A/C) Control\nProvides automatic temperature control for the forward cargo compartment\nTurning the control toward C or W sets the desired target temperature between\n4° C and 27° C.\nMid position (12 o’clock) sets approximately 16° C\nOFF – disables heater and cargo refrigeration unit. Normal cargo heating is\nprovided by the forward E/E exhaust ventilation system.\nBULK CARGO TEMP Switch\nAUTO – bulk cargo heat system targeting 21° C.\nOff (AUTO not visible) – bulk cargo heat is commanded off.\nOFF (illuminated amber) : • BULK CARGO TEMP switch selected off\n• bulk cargo heater overheat'},
{c:'AIR CONDITIONING',q:'Equipment Cooling 내용 중 Power Electronics Cooling System (PECS) Indications에서 Liquid Quantity Display 내용 설명이 잘못된 것은? FCOM 2.10.10',o:['Displays the left and right system reservoir quantities as a percentage of the normal service level (1.00 is the normal service level)','LO (amber) – displayed when the reservoir requires servicing','RF (red) – displayed when reservoir servicing is recommended','OF (white) – displayed when the reservoir is over–full'],a:2,e:'FCOM 2.10.10. Equipment Cooling\nLiquid Quantity Display\nQTY :\n• displays the left and right system reservoir quantities as a percentage of\nthe normal service level (1.00 is the normal service level)\n• LO (amber) – displayed when the reservoir requires servicing\n• RF (white) – displayed when reservoir servicing is recommended\n• OF (white) – displayed when the reservoir is over–full\nNote : A single liquid cooling loop is displayed when only one forward external\npower source is connected and selected ON.'},
{c:'AIR CONDITIONING',q:'Equipment Cooling 내용 중 Power Electronics Cooling System (PECS) Indications에서 Liquid Quantity Display 내용 설명이 잘못된 것은? FCOM 2.10.10',o:['Displays the left and right system reservoir quantities as a percentage of the normal service level (1.00 is the normal service level)','LO (amber) – displayed when the reservoir requires servicing','RF (red) – displayed when reservoir servicing is recommended','OF (white) – displayed when the reservoir is over–full'],a:2,e:'FCOM 2.10.10. Equipment Cooling\nLiquid Quantity Display\nQTY :\n• displays the left and right system reservoir quantities as a percentage of\nthe normal service level (1.00 is the normal service level)\n• LO (amber) – displayed when the reservoir requires servicing\n• RF (white) – displayed when reservoir servicing is recommended\n• OF (white) – displayed when the reservoir is over–full\nNote : A single liquid cooling loop is displayed when only one forward external\npower source is connected and selected ON.'},
{c:'AIR CONDITIONING',q:'Air Synoptic Display에서 Selected Temperatures가 magenta로 표시되지 않는 부분은?',o:['FLT DECK TEMP','FWD CARGO A/C','CABIN TEMP','BULK'],a:3,e:'FCOM 2.20.6. Humidification System\nThe humidification system operates automatically 20 minutes into cruise\nabove 25,000ft when the HUMID switch is on and is automatically switched\noff approximately 1-1.5 hours prior to touch down.'},
{c:'AIR CONDITIONING',q:'다음 괄호 안의 내용에 맞는 것은? The humidification system operates automatically 20 minutes into cruise ( ) when the HUMID switch is on and is automatically switched off approximately ( ) prior to touch down. FCOM 2.20.6',o:['above 20,000ft, 2 hours','above 25,000ft, 1-1.5 hours','above 28,000ft, 1.5 hours','above 30,000ft, 2-2.5 hours'],a:1,e:'FCOM 2.20.6. Humidification System\nThe humidification system operates automatically 20 minutes into cruise\nabove 25,000ft when the HUMID switch is on and is automatically switched\noff approximately 1-1.5 hours prior to touch down.'},
{c:'AIR CONDITIONING',q:'Bulk Cargo Heat에 대한 내용으로 잘못된 것은?',o:['Bulk cargo compartment ventilation and heat are provided from cabin air passing through a supply fan and in-line electric heaters','There is some residual heat from the aft E/E cooling exhaust entering from below the compartment floor.','Selecting the AUTO setting on the BULK CARGO TEMP switch turns on the bulk ventilation fan to allow for live animal transport.','The system has no automatic overheat protection.'],a:3,e:'FCOM 2.20.7. Bulk Cargo Heat\nBulk cargo compartment ventilation and heat are provided from cabin air\npassing through a supply fan and in-line electric heaters.\nIn addition, there is some residual heat from the aft E/E cooling exhaust\nentering from below the compartment floor.\nSelecting the AUTO setting on the BULK CARGO TEMP switch turns on the\nbulk ventilation fan to allow for live animal transport.\nThe system has automatic overheat protection.\nWhen an automatic overheat shutdown occurs, cargo heat to the related\ncompartment cannot be restored in flight.\nThe EICAS advisory message CARGO HEAT BULK notifies the flight crew when the\nswitch is off or a shutdown occurs.'},
{c:'AIR CONDITIONING',q:'The engine anti-ice valves가 자동으로 close 되는 경우가 아닌 것은?',o:['For bleed air over temperature','For bleed air overpressure','When a fuel control switch is cut off','During start'],a:2,e:'FCOM 2.40.1. Engine Anti-ice Bleed Air Supply\nBleed air is supplied from a dedicated engine bleed port. Anti-ice valves are\narmed when the ENGINE ANTI-ICE selectors are placed to AUTO. These valves\nopen when the ice detection system detects icing conditions or the selector is set\nto ON.\nHot bleed air then flows to the engine core and inlet cowl to keep ice from\nforming. The anti-ice valves close when icing conditions are no longer detected or\nthe selector is set to OFF.\nThe engine anti-ice valves close automatically :\n• during start\n• for bleed air over temperature\n• for bleed air overpressure\n• when an engine fire switch is pulled\n• when a bleed air leak is detected'},
{c:'AIR CONDITIONING',q:'Alternate Ventilation System (AVS)에 대한 다음 설명 중 맞는 것은?',o:['When the airplane is not pressurized normally and the ALT VENT switch is ON, air is drawn from the aft outflow valve to the flight deck.','The Alternate Ventilation System provides air flow into the forward electronics bay when both air conditioning packs are off on the ground.','The Alternate Ventilation System (AVS) provides an alternate means of ventilating the cabin and flight deck in the event both packs are inoperative','The ALT VENT switch is guarded to prevent selection, which could open the vent valve and depressurize the airplane.'],a:2,e:'FCOM 2.20.4. Alternate Ventilation System\nThe Alternate Ventilation System (AVS) provides an alternate means of\nventilating the cabin and flight deck in the event both packs are inoperative.\nThe system uses both the FWD and AFT outflow valves.\nWhen the airplane is un-pressurized, placing the alternate ventilation system\nswitch in ALTN positions the FWD and AFT outflow valves toward the ten and\none o’clock positions respectively, allowing fresh outside air to be drawn into\nthe air distribution system.'},
{c:'AIR CONDITIONING',q:'Integrated Cooling System (ICS)에 대한 설명 중 가장 적절한 것은?',o:['ICS is refrigeration system designed to reduce heat loads on the flight deck and integrated with the forward electrical and electronic compartment cooling.','ICS controlled by a single ICS switch on the overhead panel that can remove system power, under normal conditions, the system operates whenever at least one engine is operating.','ICS provides cooling and heat dissipation for components in the aft electrical and electronic compartment and non-essential equipment in the lower lobe area.','ICS is a centralized refrigeration system that provides cooling to galley carts and assists with cooling recirculated cabin air.'],a:3,e:'FCOM 2.20.13. Integrated Cooling System\nThe Integrated Cooling System (ICS) is a centralized refrigeration system that\nprovides cooling to galley carts and assists with cooling recirculated cabin air.\nICS is integrated with the air conditioning system and the liquid cooling system to\nmanage airplane heat loads.\nThere is no flight deck control for the ICS.'},
{c:'WING ANTI-ICE',q:'WING ANTI-ICE Selector가 AUTO position에서 Stick shaker logic이 icing conditions으로 SET 되는 조건은? FCOM 3.10.1',o:['With flaps out of up, when icing conditions have been detected and TAT is 0º C or less.','With flaps up, when icing conditions have been detected and OAT is 10º C or less.','With flaps out of up, when icing conditions have been detected and TAT is 10º C or less.','With flaps up, when icing conditions have been detected and TAT is 0º C or less.'],a:2,e:'FCOM 3.10.1. WING ANTI-ICE Selector\nOFF :\n• wing ice protection system is not powered\n• with flaps out of up, stick shaker logic returns to normal if no icing\nconditions have been detected for a certain time and TAT is greater than 10ºC\nNote: To enter the OFF position, switch must be pulled during rotation from AUTO\nto OFF.\nAUTO :\n• in flight, wing ice protection system is powered on and off automatically by the ice\nprotection system\n• with flaps out of up, stick shaker logic is set for icing conditions when icing\nconditions have been Detected and TAT is 10ºC or less.\nStick shaker logic returns to normal if no icing conditions have been detected\nfor a certain time and TAT is greater than 10ºC'},
{c:'WING ANTI-ICE',q:'WINDOW HEAT Switches의 INOP (inoperative)이 illuminated (amber) 되지 않는 경우는?',o:['The switch is off.','An overheat is detected.','backup window heat anti-fogging system is off.','A system fault has occurred.'],a:2,e:'FCOM 3.10.3. BACKUP WINDOW HEAT Switches\nOff (ON not visible) – backup window heat anti-fogging system is off.\nON – backup window heat anti-fogging is commanded on for the selected\nwindows if primary window heat system fails.\nFCOM 3.10.3. WINDOW HEAT Switches\nON – window heat is applied to the selected windows.\nINOP (inoperative) illuminated (amber) :\n• the switch is off, or\n• an overheat is detected, or\n• a system fault has occurred'},
{c:'WING ANTI-ICE',q:'Automatic ice detection is inhibited on the ground below ( ).',o:['60 knots','75 knots','80 knots','100 knots'],a:1,e:'FCOM 3.20.1. Automatic Ice Detection System\nThe automatic ice detection system senses the existence of icing conditions and\nprovides signals to control the engine, wing, and pack inlet anti-ice. The system\nhas two icing condition detectors that measure liquid water content, using TAT\nand other air data information and temperature sources to determine if icing\nconditions exist. Both detectors are heated electrically after engine start. If the\nautomatic ice detection system fails, the EICAS message ICE DETECTORS shows.\nAutomatic ice detection is inhibited on the ground below 75 knots.'},
{c:'WING ANTI-ICE',q:'다음 Engine Anti-Ice System 내용 중 잘못된 내용은?',o:['The engine anti-ice system uses electric to provide engine core and cowl inlet ice protection.','Engine anti-ice can be operated in flight or on the ground.','The engine anti-ice indication EAI is displayed above the EICAS N1 indication when an engine anti-ice valve is open.','The left and right engines have identical, independent anti-ice systems.'],a:0,e:'FCOM 3.20.1. Engine Anti-Ice System\nThe engine anti-ice system uses bleed air to provide engine core and cowl inlet\nice protection.\nEngine anti-ice can be operated in flight or on the ground.\nThe engine anti-ice indication EAI is displayed above the EICAS N1 indication when\nan engine anti-ice valve is open.\nThe left and right engines have identical, independent anti-ice systems.\nThis allows the remaining system to operate if one engine is shutdown.'},
{c:'WING ANTI-ICE',q:'The engine anti-ice valves가 자동으로 close 되는 경우가 아닌 것은?',o:['During start.','For bleed air overpressure.','When an engine fire switch is pulled.','When a bleed air overheat is detected.'],a:3,e:'FCOM 3.20.1. Engine Anti-Ice System Automatic Operation\nIn flight, when the ENGINE ANTI-ICE selector is in AUTO, engine anti-ice system operation is\nautomatic. When icing conditions are detected, the engine anti-ice valves open and bleed air\nis supplied to the engine core and inlet cowl.\nWhen icing conditions are no longer detected, the engine anti-ice valves close and bleed air is\nno longer supplied to the engine core and inlet cowl.\nAutomatic operation of the engine anti-ice system is inhibited on the ground.\nNote: The ice detection system uses a combination of temperature sources to determine total\nair temperature for engine anti-ice, and to command engine anti-ice on and off.\nThis reference temperature may not be the same as the displayed TAT.\nFCOM 3.20.2. Engine Anti-Ice System Manual Operation\nOn the ground or in flight, when the ENGINE ANTI-ICE selector is ON, bleed air opens the\nengine anti-ice valves and is supplied to the engine core and inlet cowl. ...'},
{c:'WING ANTI-ICE',q:'Wing anti-ice가 작동 되고 있다면 The wing anti-ice annunciation “WAI” 은 어디에 어떤 색상으 로 표시 되는가? FCOM 3.20.2',o:['Below the EICAS N1 indication, Displayed (amber).','Above the EICAS N1 indication, Displayed (amber).','Below the EICAS N1 indication, Displayed (green).','Above the EICAS N1 indication, Displayed (green).'],a:2,e:'FCOM 3.20.2. Wing Anti-Ice System\nThe electric wing anti-ice system powers thermal anti-icing mats on the leading edge slats on each\nwing. Wing anti-ice is inhibited on the ground below 75 knots. Wing anti-ice may be momentarily shed\n(30 seconds maximum) during high electrical loads, such as during flap retraction. To maintain\naerodynamic stability, system logic controls symmetrical operation of left and right wing anti-ice. If one\nwing anti-ice thermal mat fails, the wing anti-ice system automatically de-powers the opposite thermal\nmat to prevent asymmetrical wing icing.\nThe wing anti-ice annunciation WAI is displayed below the EICAS N1 indication when wing anti-ice is\npowered.\nFCOM 3.20.2. Wing Anti-Ice System Automatic Operation\nIn flight with the WING ANTI-ICE selector in AUTO, wing anti-ice system operation is automatic. When\nicing conditions are detected, power is supplied to the thermal mats on the leading edge slats. When ...'},
{c:'WING ANTI-ICE',q:'다음 Wing Anti-Ice System에 대한 설명 중 잘못된 내용은?',o:['To maintain aerodynamic stability, system logic controls symmetrical operation of left and right wing anti-ice','The pneumatic wing anti-ice system powers thermal anti-icing mats on the leading edge slats on each wing.','If one wing anti-ice thermal mat fails, the wing anti-ice system automatically de- powers the opposite thermal mat to prevent asymmetrical wing icing.','Wing anti-ice is inhibited on the ground below 75 knots'],a:1,e:'FCOM 3.20.2. Wing Anti-Ice System\nThe electric wing anti-ice system powers thermal anti-icing mats on the leading edge slats on each\nwing. Wing anti-ice is inhibited on the ground below 75 knots. Wing anti-ice may be momentarily shed\n(30 seconds maximum) during high electrical loads, such as during flap retraction. To maintain\naerodynamic stability, system logic controls symmetrical operation of left and right wing anti-ice. If one\nwing anti-ice thermal mat fails, the wing anti-ice system automatically de-powers the opposite thermal\nmat to prevent asymmetrical wing icing.\nThe wing anti-ice annunciation WAI is displayed below the EICAS N1 indication when wing anti-ice is\npowered.\nFCOM 3.20.2. Wing Anti-Ice System Automatic Operation\nIn flight with the WING ANTI-ICE selector in AUTO, wing anti-ice system operation is automatic. When\nicing conditions are detected, power is supplied to the thermal mats on the leading edge slats. When ...'},
{c:'WING ANTI-ICE',q:'Wing Anti-Ice System Manual Operation에서 다음 괄호 안에 들어갈 내용은? In flight with the WING ANTI-ICE selector ON, the system is powered any time TAT is below ( ). FCOM 3.20.3',o:['below 0º C','below 10º C','below 15º C','below 25º C'],a:3,e:'FCOM 3.20.3. Flight Deck Window Heat\nAll flight deck windows are electrically heated. The forward windows have\nexterior surface anti-icing, and interior surface antifogging protection.\nThe side windows have interior surface antifogging protection only.\nWith the PRIMARY L SIDE, L FWD, R FWD, and R SIDE window heat switches in\nthe ON position, the primary system operates automatically.\nWith the BACKUP L FWD and R FWD switches in the ON position, a backup\nantifogging system for the forward windows operates automatically if the\nprimary window heat system fails.'},
{c:'WING ANTI-ICE',q:'Flight Deck Window Heat에 대한 설명 중 잘못된 것은?',o:['All flight deck windows are electrically heated.','The forward windows have exterior surface anti-icing, and interior surface antifogging protection.','The side windows have exterior surface anti-icing only.','With the PRIMARY L SIDE, L FWD, R FWD, and R SIDE window heat switches in the ON position, the primary system operates automatically.'],a:2,e:'FCOM 3.20.3. Flight Deck Window Heat\nAll flight deck windows are electrically heated. The forward windows have\nexterior surface anti-icing, and interior surface antifogging protection.\nThe side windows have interior surface antifogging protection only.\nWith the PRIMARY L SIDE, L FWD, R FWD, and R SIDE window heat switches in\nthe ON position, the primary system operates automatically.\nWith the BACKUP L FWD and R FWD switches in the ON position, a backup\nantifogging system for the forward windows operates automatically if the\nprimary window heat system fails.'},
{c:'WING ANTI-ICE',q:'Windshield Wipers/Washers에 대한 설명 중 잘못된 것은?',o:['The forward and side windows are equipped with independently controlled, two-speed wipers.','When the WIPER selector in OFF, the respective wiper is off and stowed.','The Captains and First Officers windshields are equipped with a windshield washer system.','Windshield scratching may occur if wipers are used on a dry windshield surface.'],a:0,e:'FCOM 3.20.3. Windshield Wipers/Washers\nThe forward windows are equipped with independently controlled, three-speed\nwipers. When the WIPER selector in OFF, the respective wiper is off and\nstowed.\nThe Captains and First Officers windshields are equipped with a windshield\nwasher system. Windshield washer switches command a continuous application\nof washer fluid while held ON.\nWindshield scratching may occur if wipers are used on a dry windshield\nsurface.'},
{c:'WING ANTI-ICE',q:'“ANTI–ICE ON” EICAS Advisory Messages가 display 되는 조건이 아닌 것은?',o:['An ANTI-ICE selector ON.','Ice is detected and an engine anti–ice selector is OFF.','TAT is more than 10 degrees C.','Ice is not detected.'],a:1,e:'FCOM 3.30.1. ANTI–ICE ON :\nAdvisory\nAll of these occur :\n• An ANTI-ICE selector is ON\n• TAT is more than 10 degrees C\n• Ice is not detected'},
{c:'WING ANTI-ICE',q:'다음 Wing Anti-Ice System에 대한 설명 중 맞는것은?',o:['The Wing Anti-ice System may load shed momentarily during high electrical loads','The Wing Anti-ice System provides bleed air to all the leading edge slats on each wing.','The Wing Anti-ice System provides bleed air to the three outboard leading edge slats on each wing.','The Wing Anti-ice System is inhibited during all ground operations'],a:0,e:'FCOM 3.20.2. Wing Anti-Ice System\nThe electric wing anti-ice system powers thermal anti-icing mats on the leading edge slats on each\nwing. Wing anti-ice is inhibited on the ground below 75 knots. Wing anti-ice may be momentarily shed\n(30 seconds maximum) during high electrical loads, such as during flap retraction. To maintain\naerodynamic stability, system logic controls symmetrical operation of left and right wing anti-ice. If one\nwing anti-ice thermal mat fails, the wing anti-ice system automatically de-powers the opposite thermal\nmat to prevent asymmetrical wing icing.\nThe wing anti-ice annunciation WAI is displayed below the EICAS N1 indication when wing anti-ice is\npowered.\nFCOM 3.20.2. Wing Anti-Ice System Automatic Operation\nIn flight with the WING ANTI-ICE selector in AUTO, wing anti-ice system operation is automatic. When\nicing conditions are detected, power is supplied to the thermal mats on the leading edge slats. When ...'},
{c:'WING ANTI-ICE',q:'다음 Wing Anti-Ice System에 대한 설명 중 맞는것은?',o:['In flight with the WING ANTI-ICE selector is in AUTO, the wing anti-ice system on each wing is powered anytime the total air temperature(TAT) is below 10ºC','Wing Anti-Ice System Automatic Operation is available only in flight','Wing Anti-Ice is inhibited when it is less than 10 minutes from the ground to air transition, wing icing is detected in the AUTO mode and the takeoff mode is selected.','If one wing anti-ice thermal mat fails, the wing anti-ice system automatically de- powers the opposite thermal mat to prevent asymmetrical wing icing.'],a:3,e:'FCOM 3.20.2. Wing Anti-Ice System\nThe electric wing anti-ice system powers thermal anti-icing mats on the leading edge slats on each\nwing. Wing anti-ice is inhibited on the ground below 75 knots. Wing anti-ice may be momentarily shed\n(30 seconds maximum) during high electrical loads, such as during flap retraction. To maintain\naerodynamic stability, system logic controls symmetrical operation of left and right wing anti-ice. If one\nwing anti-ice thermal mat fails, the wing anti-ice system automatically de-powers the opposite thermal\nmat to prevent asymmetrical wing icing.\nThe wing anti-ice annunciation WAI is displayed below the EICAS N1 indication when wing anti-ice is\npowered.\nFCOM 3.20.2. Wing Anti-Ice System Automatic Operation\nIn flight with the WING ANTI-ICE selector in AUTO, wing anti-ice system operation is automatic. When\nicing conditions are detected, power is supplied to the thermal mats on the leading edge slats. When ...'},
{c:'WING ANTI-ICE',q:'ENGINE ANTI-ICE Selector에 대한 설명 중 잘못된 것은?',o:['OFF – the engine anti-ice valves are commanded closed.','AUTO – in flight, the engine anti-ice valves are opened or closed automatically by the ice detection system.','ON – with flaps up, stick shaker logic is set for icing conditions','ON – the engine anti-ice valves are commanded open'],a:2,e:'FCOM 3.10.2. ENGINE ANTI-ICE Selectors\nOFF :\n• the engine anti-ice valves are commanded closed.\n• with flaps out of up, stick shaker logic returns to normal if no icing conditions\nhave been detected for a certain time and TAT is greater than 10º C\nAUTO :\n• in flight, the engine anti-ice valves are opened or closed automatically by the ice\ndetection system\n• with flaps out of up, stick shaker logic is set for icing conditions when icing\nconditions have been detected and TAT is 10º C or less. Stick shaker logic returns to\nnormal if no icing conditions have been detected for a certain time and TAT is greater\nthan 10º C\nON :\n• the engine anti-ice valves are commanded open\n• with flaps out of up, stick shaker logic is set for icing conditions\nNote : Stick shaker logic returns to normal when the airplane lands,\nregardless of switch position.'},
{c:'PRESSURIZATION',q:'During unplanned level segments or when VNAV is disengaged에서의 cabin altitude 변화에 대해 설명하시오? FCOM 2.30.1',o:['Change the FMC cruise altitude to assure proper pressurization schedule.','Cabin altitude remains constant as long as airplane altitude is not changing.','The cabin altitude will climb to 6,000 feet.','The cabin altitude will continue climbing to the FMC cruise altitude.'],a:1,e:'FCOM 2.30.1. Pressurization System Automatic Operation\nIn flight, the Cabin Pressure Control System (CPCS) operates in a climb mode, a cruise mode, or a\ndescent mode.\nThe pressurization system uses ambient pressure and flight plan data from the FMC to calculate a\ncabin pressurization schedule. The schedule provides a comfortable cabin climb to cruise altitude.\nFor takeoff, the system supplies a small positive pressurization prior to rotation to cause a smooth\ncabin altitude transition to the cabin altitude climb schedule.\nIn climb mode, cabin altitude increases on a schedule related to the airplane climb rate and flight\nplan cruise altitude. When the FMC climb path has a planned level segment, it is included in\nthe total time required for the airplane to reach the top of climb. Cabin altitude continues to\nincrease during the planned level segment.\nFor unplanned level segments or when VNAV is disengaged, cabin altitude remains constant ...'},
{c:'PRESSURIZATION',q:'Pressurization panel의 Landing Altitude (LDG ALT) Selector를 Pull ON, then rotate 하면 landing altitude를 manually set 가능하다 다음 중 맞는 내용은? FCOM 2.10.8',o:['100 foot increments when turned slowly, 500 foot increments when turned quickly.','100 foot increments at the first detent, 1000 foot increments at the second detent.','10 foot increments when turned slowly, 100 foot increments when turned quickly.','100 foot increments when turned slowly, 300 foot increments when turned quickly.'],a:0,e:'FCOM 2.10.7. Landing Altitude (LDG ALT) Selector\nPull ON, then rotate : • sets landing altitude manually\n• landing altitude followed by MAN displayed on EICAS\n• when turned slowly, landing altitude display changes in 100 foot increments.\nWhen turned quickly, display changes in 500 foot increments'},
{c:'PRESSURIZATION',q:'Pressurization panel의 Landing Altitude (LDG ALT) Selector를 Pull ON, then rotate 할 경우에 대한 설명으로 틀린 것은? FCOM 2.10.8',o:['Sets landing altitude manually.','Landing altitude followed by MAN displayed on EICAS.','When turned slowly, landing altitude display changes in 100 foot increments.','When turned quickly, display changes in 1000 foot increments.'],a:3,e:'FCOM 2.10.7. Landing Altitude (LDG ALT) Selector\nPull ON, then rotate : • sets landing altitude manually\n• landing altitude followed by MAN displayed on EICAS\n• when turned slowly, landing altitude display changes in 100 foot increments.\nWhen turned quickly, display changes in 500 foot increments'},
{c:'PRESSURIZATION',q:'Pressurization panel의 Landing Altitude (LDG ALT) Selector를 Pull ON, then rotate 할 경우에 대한 설명으로 틀린 것은? FCOM 2.10.8',o:['Sets landing altitude manually.','Landing altitude followed by MAN displayed on PFD.','When turned slowly, landing altitude display changes in 100 foot increments.','When turned quickly, display changes in 500 foot increments.'],a:1,e:'FCOM 2.10.7. Landing Altitude (LDG ALT) Selector\nPull ON, then rotate : • sets landing altitude manually\n• landing altitude followed by MAN displayed on EICAS\n• when turned slowly, landing altitude display changes in 100 foot increments.\nWhen turned quickly, display changes in 500 foot increments'},
{c:'PRESSURIZATION',q:'Pressurization System 에 대한 설명 중 잘못된 것은?',o:['Cabin pressurization is controlled by regulating the discharge of conditioned cabin air through the outflow valves.','Two outflow valves are installed: one forward and one aft.','Cabin altitude and full ventilation rates can be maintained by either valve.','Two outflow valves protect the fuselage against excessive pressure differential.'],a:3,e:'FCOM 2.30.1. Introduction\nCabin pressurization is controlled by regulating the discharge of conditioned cabin\nair through the outflow valves.\nTwo outflow valves are installed: one forward and one aft. Normally, the outflow of\ncabin air is split equally between these two outflow valves. Cabin altitude and full\nventilation rates can be maintained by either valve.\nPositive and negative pressure relief valves/vents protect the fuselage against\nexcessive pressure differential.\nThe pressurization system has automatic and manual operating modes. Other than\naccomplishing normal procedures for entering FMC data, no specific flight crew\naction is required for fully automatic operation.'},
{c:'PRESSURIZATION',q:'If cruise altitude is unavailable from the FMC in AUTO, the default cruise altitude is ( ).',o:['42,000 feet.','42,100 feet.','43,000 feet.','43,100 feet.'],a:2,e:'FCOM 2.30.1. Pressurization System Automatic Operation\nIn flight, the Cabin Pressure Control System (CPCS) operates in a climb mode, a cruise mode,\nor a descent mode.\nThe pressurization system uses ambient pressure and flight plan data from the FMC to\ncalculate a cabin pressurization schedule. The schedule provides a comfortable cabin climb to\ncruise altitude.\nFor takeoff, the system supplies a small positive pressurization prior to rotation to cause a\nsmooth cabin altitude transition to the cabin altitude climb schedule.\nIn climb mode, cabin altitude increases on a schedule related to the airplane climb rate and\nflight plan cruise altitude. When the FMC climb path has a planned level segment, it is\nincluded in the total time required for the airplane to reach the top of climb. Cabin\naltitude continues to increase during the planned level segment.\nFor unplanned level segments or when VNAV is disengaged, cabin altitude remains ...'},
{c:'PRESSURIZATION',q:'다음 괄호 안에 들어갈 내용으로 맞는 것은? In the cruise mode, the cabin altitude is normally at or below ( ). During some degraded operations the cabin may be commanded to climb to as high as ( ). FCOM 2.30.2',o:['6,000 feet, 8,000 feet','5,000 feet, 8,000 feet','5,000 feet, 7,000 feet','6,000 feet, 7,000 feet'],a:0,e:'FCOM 2.30.2. Pressurization System Automatic Operation\nIn the cruise mode, the cabin altitude is normally at or below 6,000 feet.\nDuring some degraded operations the cabin may be commanded to climb to as high\nas 8,000 feet.\nThis can occur if the air conditioning system is not achieving cabin temperature and\nventilation rate targets, and would be more likely with an inoperative pack or CAC.\nThe pressurization system enters descent mode after airplane descent has been initiated.\nDuring descent, cabin altitude decreases to slightly below the FMC planned landing\naltitude. This ensures that the airplane lands pressurized. Landing altitude barometric\npressure correction comes from the captain’s altimeter setting.\nAt touchdown, both outflow valves open to depressurize the cabin.\nFor high altitude takeoffs, if the takeoff field elevation is higher than 8,000 feet, the\ncabin descends to the target altitude while the airplane is climbing. ...'},
{c:'PRESSURIZATION',q:'Pressurization System의 Automatic Operation 에 대한 설명 중 틀린 것은?',o:['For takeoff, the system supplies a small negative pressurization prior to rotation to cause a smooth cabin altitude transition to the cabin altitude climb schedule.','In climb mode, cabin altitude increases on a schedule related to the airplane climb rate and flight plan cruise altitude.','During descent, cabin altitude decreases to slightly below the FMC planned landing altitude.','At touchdown, both outflow valves open to depressurize the cabin.'],a:0,e:'FCOM 2.30.1. Pressurization System Automatic Operation\nIn flight, the Cabin Pressure Control System (CPCS) operates in a climb mode, a cruise mode,\nor a descent mode.\nThe pressurization system uses ambient pressure and flight plan data from the FMC to\ncalculate a cabin pressurization schedule. The schedule provides a comfortable cabin climb to\ncruise altitude.\nFor takeoff, the system supplies a small positive pressurization prior to rotation to cause\na smooth cabin altitude transition to the cabin altitude climb schedule.\nIn climb mode, cabin altitude increases on a schedule related to the airplane climb rate\nand flight plan cruise altitude. When the FMC climb path has a planned level segment, it\nis included in the total time required for the airplane to reach the top of climb. Cabin\naltitude continues to increase during the planned level segment.\nFor unplanned level segments or when VNAV is disengaged, cabin altitude remains ...'},
{c:'PRESSURIZATION',q:'Pressurization System의 Automatic Operation 에 대한 설명 중 틀린 것은?',o:['For takeoff, the system supplies a small positive pressurization prior to rotation to cause a smooth cabin altitude transition to the cabin altitude climb schedule.','In climb mode, cabin altitude increases on a schedule related to the airplane climb rate and flight plan cruise altitude.','During descent, cabin altitude decreases to slightly above the FMC planned landing altitude.','At touchdown, both outflow valves open to depressurize the cabin.'],a:2,e:'FCOM 2.30.1. Pressurization System Automatic Operation\nIn flight, the Cabin Pressure Control System (CPCS) operates in a climb mode, a cruise mode,\nor a descent mode.\nThe pressurization system uses ambient pressure and flight plan data from the FMC to\ncalculate a cabin pressurization schedule. The schedule provides a comfortable cabin climb to\ncruise altitude.\nFor takeoff, the system supplies a small positive pressurization prior to rotation to cause\na smooth cabin altitude transition to the cabin altitude climb schedule.\nIn climb mode, cabin altitude increases on a schedule related to the airplane climb rate\nand flight plan cruise altitude. When the FMC climb path has a planned level segment, it\nis included in the total time required for the airplane to reach the top of climb. Cabin\naltitude continues to increase during the planned level segment.\nFor unplanned level segments or when VNAV is disengaged, cabin altitude remains ...'},
{c:'PRESSURIZATION',q:'다음 괄호 안에 들어갈 알맞은 내용은? If landing altitude is unavailable from the FMC, and not set in MAN, the EICAS advisory message ( ). FCOM 2.30.2',o:['CABIN ALTITUDE is displayed and the cabin altitude controller assumes a landing altitude of 2,000 feet.','LANDING ALTITUDE is displayed and the cabin altitude controller assumes a landing altitude of 1,000 feet.','CABIN ALTITUDE is displayed and the cabin altitude controller assumes a landing altitude of 1,000 feet.','LANDING ALTITUDE is displayed and the cabin altitude controller assumes a landing altitude of 2,000 feet.'],a:3,e:'FCOM 2.30.2. Operation With Loss of Landing Altitude\nIf landing altitude is unavailable from the FMC, and not set in MAN, the EICAS advisory\nmessage LANDING ALTITUDE is displayed and the cabin altitude controller assumes a landing\naltitude of 2,000 feet.\nFCOM 2.30.2. Operation With Loss of Cabin Pressurization\nIf a depressurization event occurs, the outflow valves close to preserve cabin pressure. While the\nairplane is descending and cabin altitude is increasing, the outflow valves remain closed until the\nairplane descends below the cabin altitude limit is reached :\n• For takeoff/landing altitudes below 9,500 feet the cabin altitude limit is set to 11,500 feet or\n• For takeoff/landing altitudes equal or above 9,500 feet and less than or equal to 14,000 feet,\nthe cabin altitude limit is set to 14,500 feet.\nNote : The CPCS system prevents the cabin altitude from exceeding 15,000 feet in the event of any\nprobable failure or malfunction in the pressurization system. ...'},
{c:'PRESSURIZATION',q:'Pressurization System Manual Operation에 대한 내용 중 잘못된 것은?',o:['The pressurization system is in the manual mode when the OUTFLOW VALVE switches are set to MAN.','The system is manually operated','Outflow valve position is displayed on the Air Synoptic Display','Holding the respective OUTFLOW VALVE MANUAL switch in the desired position for 30 seconds moves the valve from full open or closed to the selected position.'],a:2,e:'FCOM 2.30.3. Pressurization System Manual Operation\nThe pressurization system is in the manual mode when the OUTFLOW VALVE switches\nare set to MAN.\nThe system is manually operated by :\n• setting the OUTFLOW VALVE switches to MAN\n• holding the related OUTFLOW VALVE MANUAL switch to OPEN or CLOSE\nOutflow valve position is displayed on the EICAS display.\nIf the outflow valve position is not available on EICAS, holding the respective\nOUTFLOW VALVE MANUAL switch in the desired position for 30 seconds moves the\nvalve from full open or closed to the selected position.\nLanding altitude (normally provided by the FMC) can be manually set using the LANDING\nALTITUDE selector. Landing field selection limits are 2,000 feet below sea level (-2,000)\nto 14,000 feet above sea level. Pulling the selector out to the detent removes the FMC\nlanding altitude and displays pressurization system indications on the EICAS display. The ...'},
{c:'PRESSURIZATION',q:'Air Systems EICAS Message 중 잘못된 것은?',o:['CABIN ALTITUDE - Cabin altitude is excessive','HIGH CABIN ALT MODE - The Cabin Altitude Warning limit is set higher than 14,000 feet due to a high takeoff or landing altitude.','PACK ALTITUDE LIMIT - Airplane altitude is limited because two CACs are inoperative and the equipment cooling system is in the override mode, or three CACs are inoperative.','PACK L+R - Both packs are inoperative.'],a:1,e:'FCOM 2.50.1\n• CABIN ALTITUDE : Warning / Siren / Cabin altitude is excessive.\n• HIGH CABIN ALT MODE : Memo / - / The Cabin Altitude Warning limit is set\nhigher than 10,000 feet due to a high takeoff or landing altitude.\n• PACK ALTITUDE LIMIT : Caution / Beeper / Airplane altitude is limited because\ntwo CACs are inoperative and the equipment cooling system is\nin the override mode, or three CACs are inoperative.\n• PACK L+R : Caution / Beeper / Both packs are inoperative.'},
{c:'HYDRAULIC',q:'Which hydraulic systems are identical differing only in the components they power.',o:['The left and right hydraulic systems','The left, right and center hydraulic systems','None, they are all uniquely different.','The right and center hydraulic systems'],a:0,e:'FCOM 13.20.1. Left and Right Hydraulic Systems\nThe left and right hydraulic systems are identical. They differ only in the\ncomponents they power.\nThe left hydraulic system powers :\n• flight controls\n• the left engine thrust reverser\n• right and left wing spoilers\nThe right hydraulic system powers :\n• flight controls\n• the right engine thrust reverser\n• right and left wing spoilers'},
{c:'HYDRAULIC',q:'The ram air turbine (RAT), when deployed, provides hydraulic power to the primary flight controls connected to which of the hydraulic system(s)? FCOM 13.20.3',o:['Center','Left','Left, Center and Right','Right'],a:0,e:'FCOM 13.20.3. Ram Air Turbine (RAT)\nThe RAT, when deployed, provides 5000 psi hydraulic power to the primary\nflight controls connected to the center hydraulic system.\nThe RAT provides hydraulic and electrical power throughout the flight envelope.\nIn flight, the RAT deploys automatically if any of the following occur :\n• both engines have failed\n• all three hydraulic system pressures are low\n• loss of all electrical power to captain’s and first officer’s flight instruments\n• loss of all four EMPs and faults in the flight control system occur on approach\n• loss of all four EMPs and an engine fails on takeoff or landing\nThe RAT can be deployed manually by pushing the RAM AIR TURBINE switch\non the hydraulic panel. A spring-loaded actuator is used to deploy the RAT\neither automatically or manually. Once deployed, the RAT cannot be stowed in\nflight.'},
{c:'HYDRAULIC',q:'비행 중 RAT이 automatically deploy되는 조건이 아닌 것은?',o:['Both engines have failed','Center hydraulic system pressures are low','Loss of all electrical power to captain’s and first officer’s flight instruments','Loss of all four EMPs and an engine fails on takeoff or landing'],a:1,e:'FCOM 13.20.2. Center Hydraulic System\nThe center hydraulic system powers :\n• flight controls         • landing gear actuation          • leading edge slats\n• nose gear steering   • right and left wing spoilers    • trailing edge flaps\nThe ram air turbine (RAT) only provides hydraulic power to the center hydraulic system\nprimary flight controls.\nFCOM 13.20.2. Center Hydraulic System Electric Pumps\nTwo electric motor-driven pumps (EMPs) provide hydraulic power sources for the center\nhydraulic system. The C1 and C2 ELEC pump selectors control pump operation. The two center\npumps alternate as a primary pump and demand pump.\nThe primary pump operates continuously after the second engine is started.\nThe center demand pump operates under the following conditions:\n• system low pressure, or\n• on the ground for the first three minutes after the second engine is started, or\n• from takeoff thrust set until radio altitude exceeds 2000 feet\n• flaps or slats are in motion, or ...'},
{c:'HYDRAULIC',q:'다음 중 hydraulic center demand pump가 작동하는 조건이 아닌 것은?',o:['System low pressure','On the ground for the first ten minutes after the first engine is started','From takeoff thrust set until radio altitude exceeds 2000 feet','Flaps or slats are in motion'],a:1,e:'FCOM 13.20.2. Center Hydraulic System\nThe center hydraulic system powers :\n• flight controls         • landing gear actuation          • leading edge slats\n• nose gear steering   • right and left wing spoilers    • trailing edge flaps\nThe ram air turbine (RAT) only provides hydraulic power to the center hydraulic system\nprimary flight controls.\nFCOM 13.20.2. Center Hydraulic System Electric Pumps\nTwo electric motor-driven pumps (EMPs) provide hydraulic power sources for the center\nhydraulic system. The C1 and C2 ELEC pump selectors control pump operation. The two center\npumps alternate as a primary pump and demand pump.\nThe primary pump operates continuously after the second engine is started.\nThe center demand pump operates under the following conditions:\n• system low pressure, or\n• on the ground for the first three minutes after the second engine is started, or\n• from takeoff thrust set until radio altitude exceeds 2000 feet\n• flaps or slats are in motion, or ...'},
{c:'HYDRAULIC',q:'Hydraulic System Indication에서 hydraulic reservoir quantity low는 status display에 어떻게 표시 되는가? FCOM 13.10.3',o:['LO is displayed in white','QTY is displayed in white','QTY is displayed in amber','LO is displayed in amber'],a:3,e:'FCOM 13.10.3. Hydraulic Display\nQuantity (QTY) –\n• displays system reservoir quantity as a percentage of the normal service level\n(1.00 is the normal service level)\n• LO (amber) – displayed when the reservoir quantity is low\n• OF (white) – displayed when the reservoir is over–full (inhibited in flight)\n• RF (white) – displayed when the reservoir requires refilling (inhibited in flight).\nPressure (PRESS) – displays hydraulic system pressure in pounds per square inch.'},
{c:'HYDRAULIC',q:'Hydraulics EICAS Message의 HYD PRESS DEM L, R 가 의미하는 것은?',o:['All hydraulic system pressures are low.','The affected hydraulic system pressure is high.','The affected demand pump pressure is low when commanded on.','The affected primary hydraulic pump pressure is low.'],a:2,e:'FCOM 13.30.1.\nHYD PRESS DEM L, R :\nThe demand pump pressure is low when commanded on.'},
{c:'HYDRAULIC',q:'The center hydraulic system has isolation functionality in the event of a leak. 위와 관련된 내용 중 잘못된 것을 고르시오. FCOM 13.20.2',o:['The isolation function uses a Nose Gear Isolation Valve (NGIV), Reserve Steering Isolation Valve (RSIV), Alternate Extend Isolation Valve (AEIV) and a reservoir standpipe.','The hydraulic isolation systems ensure the flight crew can lower the landing gear and that nose wheel steering is operational for landing, roll-out and taxi.','The isolation valves can be controlled by the crew.','There are certain airplane failure modes which require one or more of the demand pumps, left, right or center to load shed to allow the electrical system to provide power to other systems.'],a:2,e:'FCOM 13.20.3. Center Hydraulic System Non–Normal Operation\nThe center hydraulic system has isolation functionality in the event of a leak.\nThe isolation function uses a Nose Gear Isolation Valve (NGIV), Reserve Steering\nIsolation Valve (RSIV), Alternate Extend Isolation Valve (AEIV) and a reservoir\nstandpipe.\nThe hydraulic isolation systems ensure the flight crew can lower the landing gear and\nthat nose wheel steering is operational for landing, roll-out and taxi.\nThe isolation valves operate automatically and cannot be controlled by the crew.\nThere are certain airplane failure modes which require one or more of the demand\npumps, left, right or center to load shed to allow the electrical system to provide\npower to other systems.\nThe indication is LOAD SHED showing on the hydraulic synoptic next to the demand\npump symbol.'},
{c:'HYDRAULIC',q:'The center hydraulic system has isolation functionality in the event of a leak. 위와 관련된 내용 중 잘못된 것을 고르시오. FCOM 13.20.2',o:['The isolation function uses a Nose Gear Isolation Valve (NGIV), Reserve Steering Isolation Valve (RSIV), Alternate Extend Isolation Valve (AEIV) and a reservoir standpipe.','The hydraulic isolation systems ensure the flight crew can lower the landing gear and that nose wheel steering is operational for landing, roll-out and taxi.','The isolation valves cannot be controlled by the crew.','Resevior가 있어서 landing gear down, landing roll, taxi가능함'],a:3,e:'FCOM 13.20.3. Center Hydraulic System Non–Normal Operation\nThe center hydraulic system has isolation functionality in the event of a leak.\nThe isolation function uses a Nose Gear Isolation Valve (NGIV), Reserve Steering\nIsolation Valve (RSIV), Alternate Extend Isolation Valve (AEIV) and a reservoir\nstandpipe.\nThe hydraulic isolation systems ensure the flight crew can lower the landing gear and\nthat nose wheel steering is operational for landing, roll-out and taxi.\nThe isolation valves operate automatically and cannot be controlled by the crew.\nThere are certain airplane failure modes which require one or more of the demand\npumps, left, right or center to load shed to allow the electrical system to provide\npower to other systems.\nThe indication is LOAD SHED showing on the hydraulic synoptic next to the demand\npump symbol.'},
{c:'HYDRAULIC',q:'Center hydraulic system에 의해 작동되는 것이 아닌 것은?',o:['the left engine thrust reverser','nose gear steering','landing gear actuation','trailing edge flaps'],a:0,e:'FCOM 13.20.2. Center Hydraulic System\nThe center hydraulic system powers:\n• flight controls\n• landing gear actuation\n• leading edge slats\n• nose gear steering\n• right and left wing spoilers\n• trailing edge flaps\nThe ram air turbine (RAT) only provides hydraulic power to the center\nhydraulic system primary flight controls.'},
{c:'HYDRAULIC',q:'Hydraulic Panel에서 Left/Right Engine (L/R ENG) PRIMARY Pump Switches에 대한 설명 중 잘 못된 것은? FCOM 13.10.2',o:['ON – the engine-driven hydraulic pump pressurizes the related left or right hydraulic system when engine starts.','Off (ON not visible) – the engine-driven hydraulic pump is turned off and depressurized.','FAULT illuminated (red) – high primary pump pressure','FAULT illuminated (amber) – excessive primary pump fluid temperature'],a:2,e:'FCOM 13.10.2. Left/Right Engine (L/R ENG) PRIMARY Pump Switches\nON – the engine-driven hydraulic pump pressurizes the related left or right\nhydraulic system when engine starts.\nOff (ON not visible) – the engine-driven hydraulic pump is turned off\nand depressurized.\nFAULT illuminated (amber) :\n• low primary pump pressure\n• excessive primary pump fluid temperature, or\n• pump selected OFF'},
{c:'HYDRAULIC',q:'Hydraulic Display에서 Quantity (QTY)에 대한 설명 중 잘못된 것은?',o:['displays system reservoir quantity as a percentage of the normal service level (1.00 is the normal service level)','LO (amber) – displayed when the reservoir quantity is low','OF (white) – displayed when the reservoir is over–full (inhibited in flight)','RF (red) – displayed when the reservoir requires refilling (inhibited on the ground).'],a:3,e:'FCOM 13.10.3. Hydraulic Display\nQuantity (QTY) –\n• displays system reservoir quantity as a percentage of the normal service level\n(1.00 is the normal service level)\n• LO (amber) – displayed when the reservoir quantity is low\n• OF (white) – displayed when the reservoir is over–full (inhibited in flight)\n• RF (white) – displayed when the reservoir requires refilling\n(inhibited in flight).\nPressure (PRESS) – displays hydraulic system pressure in pounds per square inch.'},
{c:'HYDRAULIC',q:'Hydraulic Synoptic Display에 display 되지 않는 것은?',o:['The Nose Gear Isolation Valve (NGIV)','The Alternate Extend Isolation Valve (AEIV)','the Reserve Steering Isolation Valve (RSIV)','All the above.'],a:1,e:'FCOM 13.10.4. Hydraulic Synoptic Display\nNote : The Nose Gear Isolation Valve (NGIV) and\nthe Reserve Steering Isolation Valve (RSIV)\nare shown on the synoptic page.\nThe Alternate Extend Isolation Valve (AEIV) is\nnot shown.'},
{c:'HYDRAULIC',q:'Hydraulic system에 대한 설명 중 틀린 것은?',o:['The airplane has two independent 3000psi hydraulic systems.','Flight control system components are distributed so that any one hydraulic system can provide adequate airplane controllability.','Hydraulic fluid is supplied to each hydraulic pump from the associated system reservoir.','The reservoirs are pressurized by pump outlet pressure.'],a:0,e:'FCOM 13.20.1. Introduction\nThe airplane has three independent 5000 psi hydraulic systems: left, right, and\ncenter. The hydraulic systems power the :\n• flight controls\n• landing gear\n• leading edge slats\n• nose gear steering\n• thrust reversers\n• trailing edge flaps\nFlight control system components are distributed so that any one hydraulic\nsystem can provide adequate airplane controllability.\nHydraulic fluid is supplied to each hydraulic pump from the associated system\nreservoir.\nThe reservoirs are pressurized by pump outlet pressure.'},
