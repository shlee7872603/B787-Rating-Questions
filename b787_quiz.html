<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>B787 레이팅 퀴즈</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=JetBrains+Mono:wght@600&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans KR',sans-serif;background:#0d1117;color:#e6edf3;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:20px}
header{width:100%;max-width:760px;display:flex;justify-content:space-between;align-items:center;padding:14px 0 20px;border-bottom:1px solid #30363d;margin-bottom:24px}
h1{font-size:1.1rem;font-weight:700;display:flex;align-items:center;gap:8px}
.tag{background:#2f81f7;color:#fff;font-size:.65rem;font-weight:700;padding:2px 7px;border-radius:4px}
.sb{font-family:'JetBrains Mono',monospace;font-size:.82rem;color:#8b949e;display:flex;gap:14px}
.sb b{color:#e6edf3}
.wrap{width:100%;max-width:760px}
.prog{height:3px;background:#30363d;border-radius:2px;margin-bottom:26px}
.pf{height:100%;background:#2f81f7;border-radius:2px;transition:width .4s}
.badge{display:inline-block;font-size:.7rem;font-weight:700;color:#2f81f7;background:rgba(47,129,247,.12);border:1px solid rgba(47,129,247,.3);padding:3px 10px;border-radius:20px;margin-bottom:8px}
.meta{font-size:.75rem;color:#8b949e;font-family:'JetBrains Mono',monospace;margin-bottom:6px}
.card{background:#161b22;border:1px solid #30363d;border-radius:10px;padding:24px 26px;margin-bottom:14px}
.qt{font-size:.97rem;line-height:1.8;font-weight:500;white-space:pre-wrap}
.opts{display:flex;flex-direction:column;gap:9px;margin-bottom:16px}
.opt{display:flex;align-items:flex-start;gap:11px;background:#21262d;border:1px solid #30363d;border-radius:10px;padding:13px 16px;cursor:pointer;text-align:left;color:#e6edf3;font-family:'Noto Sans KR',sans-serif;font-size:.9rem;line-height:1.6;transition:border-color .15s,background .15s;width:100%}
.opt:hover:not(:disabled){border-color:#2f81f7;background:rgba(47,129,247,.07)}
.opt:disabled{cursor:default}
.lbl{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:.83rem;color:#8b949e;min-width:18px;flex-shrink:0;padding-top:2px}
.opt.ok{border-color:#3fb950;background:rgba(63,185,80,.1)}.opt.ok .lbl{color:#3fb950}
.opt.ng{border-color:#f85149;background:rgba(248,81,73,.08)}.opt.ng .lbl{color:#f85149}
.fb{border-radius:10px;padding:12px 16px;margin-bottom:14px;font-size:.88rem;font-weight:500;display:none}
.fb.show{display:block}
.fb.ok{background:rgba(63,185,80,.1);border:1px solid rgba(63,185,80,.35);color:#3fb950}
.fb.ng{background:rgba(248,81,73,.08);border:1px solid rgba(248,81,73,.3);color:#f85149}
.ans{color:#3fb950;font-weight:700}
.acts{display:flex;gap:9px}
.btn{padding:10px 20px;border-radius:10px;border:none;cursor:pointer;font-family:'Noto Sans KR',sans-serif;font-size:.88rem;font-weight:700;transition:opacity .15s}
.btnp{background:#2f81f7;color:#fff;flex:1}.btnp:hover{opacity:.88}
.btns{background:#21262d;color:#8b949e;border:1px solid #30363d}.btns:hover{color:#e6edf3}
.setup{width:100%;max-width:760px}
.stitle{font-size:1.5rem;font-weight:700;margin-bottom:6px}
.ssub{color:#8b949e;font-size:.88rem;margin-bottom:26px}
.seclbl{font-size:.75rem;font-weight:700;color:#8b949e;text-transform:uppercase;letter-spacing:1px;margin-bottom:10px}
.catrow{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:24px}
.catb{font-size:.7rem;font-weight:700;padding:4px 11px;border-radius:20px;border:1px solid #30363d;background:#21262d;color:#8b949e;cursor:pointer;font-family:'Noto Sans KR',sans-serif;transition:all .15s}
.catb.on{border-color:#2f81f7;background:rgba(47,129,247,.15);color:#2f81f7}
.cntrow{display:flex;gap:9px;margin-bottom:26px;flex-wrap:wrap}
.cntb{padding:7px 18px;border-radius:10px;border:1px solid #30363d;background:#21262d;color:#8b949e;cursor:pointer;font-family:'JetBrains Mono',monospace;font-size:.88rem;font-weight:700;transition:all .15s}
.cntb.on{border-color:#2f81f7;background:rgba(47,129,247,.15);color:#2f81f7}
.startb{background:#2f81f7;color:#fff;border:none;border-radius:10px;padding:13px;font-family:'Noto Sans KR',sans-serif;font-size:1rem;font-weight:700;cursor:pointer;width:100%;transition:opacity .15s}
.startb:hover{opacity:.88}
.result{display:none;text-align:center;padding:40px 10px}
.result.show{display:block}
.bigpct{font-size:4rem;font-weight:700;font-family:'JetBrains Mono',monospace}
.rlbl{color:#8b949e;font-size:.9rem;margin-bottom:20px}
.grade{font-size:1.25rem;font-weight:700;margin-bottom:26px}
.rstats{display:flex;justify-content:center;gap:32px;margin-bottom:32px}
.stat{display:flex;flex-direction:column;align-items:center;gap:3px}
.sn{font-size:1.8rem;font-weight:700;font-family:'JetBrains Mono',monospace}
.sl{font-size:.73rem;color:#8b949e}
.hide{display:none!important}
.expl{background:#161b22;border:1px solid #30363d;border-radius:10px;padding:16px 20px;margin-bottom:14px;display:none;max-height:400px;overflow-y:auto}
.expl.show{display:block}
.expl-title{font-size:.78rem;font-weight:700;color:#2f81f7;margin-bottom:8px;display:flex;align-items:center;gap:6px}
.expl-body{font-size:.82rem;line-height:1.75;color:#b1bac4;white-space:pre-wrap;word-break:break-word}
.expl::-webkit-scrollbar{width:4px}.expl::-webkit-scrollbar-track{background:#161b22}.expl::-webkit-scrollbar-thumb{background:#30363d;border-radius:2px}
.diff-box{background:#1c1012;border:1px solid rgba(248,81,73,.25);border-radius:10px;padding:14px 18px;margin-bottom:14px;display:none}
.diff-box.show{display:block}
.diff-title{font-size:.78rem;font-weight:700;color:#f85149;margin-bottom:8px;display:flex;align-items:center;gap:6px}
.diff-body{font-size:.84rem;line-height:1.85;color:#b1bac4;white-space:pre-wrap;word-break:break-word}
.diff-hl{color:#f85149;font-weight:700;text-decoration:underline;text-decoration-style:wavy}
.nav-top{display:flex;gap:10px;margin-bottom:14px}
.nav-top .btn{flex:1}
.nav-top .btn:disabled{opacity:.4;cursor:not-allowed}
.tag-btn{display:none;width:100%;padding:10px;border-radius:10px;border:1px solid #30363d;background:#21262d;color:#8b949e;cursor:pointer;font-family:'Noto Sans KR',sans-serif;font-size:.82rem;font-weight:500;margin-bottom:14px;transition:all .15s}
.tag-btn.show{display:block}
.tag-btn:hover{border-color:#da3633;color:#f85149}
.tag-btn.tagged{border-color:#da3633;background:rgba(248,81,73,.1);color:#f85149}
.setup-info{background:#161b22;border:1px solid #30363d;border-radius:10px;padding:14px 18px;margin-bottom:20px;font-size:.82rem;color:#8b949e;display:flex;flex-wrap:wrap;gap:8px 20px;align-items:center}
.setup-info b{color:#e6edf3}
.reset-btn{padding:4px 12px;border-radius:6px;border:1px solid #30363d;background:#21262d;color:#8b949e;cursor:pointer;font-family:'Noto Sans KR',sans-serif;font-size:.75rem;transition:all .15s}
.reset-btn:hover{border-color:#f85149;color:#f85149}
</style>
</head>

<script>
const L=['가','나','다','라'];
const Q=[
{c:'ELECTRICAL',q:'배터리 전원이 CCS Start-UP에 사용할 수 있는 유일한 전원 인 경우, Left CCR이 Online 상태임을 나타내는 것은? FCOM 1.40.1',o:['The lower DU shows the default format','All displays and the HUD combiner show their default formats','The captains inboard and lower display units show the default formats.(CDU pages)','The first officers inboard and outboard units show the default formats.(CDU pages)'],a:2,e:'FCOM 1.40.1 Common Core System\nThe Common Core System (CCS) provides a common computing network and data exchange system for the majority of\nairplane systems. CCS operation is automatic.\nThe CCS’s main component is the Common Computing Resource (CCR), which has a left and right cabinet. Separate\nmodules within each CCR cabinet perform distinct functions. The CCRs can isolate most faults, allowing the cabinet to\ncontinue operation.\nThere are no CCS controls or indications for normal operations. In the event a CCR fault occurs resulting in the loss of\ndisplays, a CCR reset procedure can be found in the unannunciated non-normal checklist: LOSS OF ALL DISPLAYS.\nTwo (L, R) CCR RESET switches are located on the overhead panel for use during this procedure.\nCCS Start-Up\nThe left CCR always starts-up first. When a power source other than the battery is available to close the electronic circuit\nbreakers (ECB), the right CCR start-up cycle is enabled.\nBattery power start-up sequence: ...'},
{c:'ELECTRICAL',q:'235VAC 시스템에 전원이 공급 될 때 28VDC 시스템에 전원을 공급하는 것은?',o:['Four DC generators','Two standby inverters','Auto Transformer Units(ATUs)','power conversion devices'],a:3,e:'FCOM 6.20.9. 28 Vdc Bus Distribution System\nThere are multiple 28 Vdc buses. To distribute power, the 28 Vdc system uses both primary power\nsystem buses located in the forward E/E bay, and RPDU located throughout the airplane. The\nhigher amperage (greater than 10 amps) loads are distributed directly by the bus system. The\nlower amperage (10 amps or less) loads are distributed by the RPDU.\nThe 235 Vac system provides power to the 28 Vdc system through power conversion devices.\nFour electrical brake power supply units regulate power for the exclusive use of the airplane\nelectric brake system. Each of the four power supplies receive two separate 28 Vdc inputs. One\nfrom the 28 Vdc bus system, and one from the main battery. The 28 Vdc bus system is the\nprimary power source, and the main battery provides the backup power source. (Refer to\nElectric Brake System in Chapter 14, Section 20, for additional information.)'},
{c:'ELECTRICAL',q:'Electric load shedding을 받는 항공기 시스템 목록이 시현 되는 곳은?',o:['The electrical synoptic','Individual EICAS Messages panel','The ECL Non Normal Checklist','Individual equipment synoptic'],a:0,e:'FCOM 6.20.14 Load Inhibit and Load Shedding\nThere are two types of automatic load reduction that can occur to maintain power for essential\nsystems:\n• Load inhibit – loads are inhibited at predefined operational phases. This is because the affected\nsystem is not required, or additional power is temporarily needed by another system.\n• Load shed – loads are shed in the order of priority to stay within the capacity of the available\npower sources.\nThe electrical synoptic shows a list of airplane systems affected by load shedding.\nThe affected system synoptic (AIR, FUEL, & HYD) also indicate equipment (in white) that is inhibited\nor shed. Additionally, loads that are shed show “LOAD SHED” text next to the affected equipment\nsymbol.'},
{c:'ELECTRICAL',q:'항공기 Engine이 running 또는 forward external power가 On으로 선택 되었다면 어느 APU starter/ generator가 Engine 시동에 사용 되는가? FCOM 6.20.2',o:['Either the left or right starter generator','Both APU starter/ generators','The right starter/ generator','The left starter/ generator'],a:0,e:'FCOM 6.20.2. APU Starter/Generators\nAuxiliary Power Unit (APU) starter/generators function as electrically powered starter motors\nfor APU start, and as generators once the APU is running. The APU generators can provide\nelectrical power for ground operations and supplemental power during flight. Additionally, normal\nengine start is accomplished using electrical power supplied by the APU.\nThe APU has two 235 Vac variable frequency starter/generators, designated left (L) and right (R).\nThe generators are directly connected to the APU gearbox, producing variable frequency power\nproportional to APU speed.\nElectrical power for APU start can be provided by forward external power, APU battery, or\nengine generated power.\nThe electrical system automatically selects a single starter/generator to provide sufficient torque for\nAPU start.\nFor APU starts with the APU battery as the power source (no engine running and forward\nexternal power not ON), the right starter/generator is always used. ...'},
{c:'ELECTRICAL',q:'Main 235VAC BUS Distribution System의 주요 목적은?',o:['Provide power to the large motor controllers located in the after E/E Bay','provide power to the flight instrument','Provide power to the four electrical brake power supply units','They distribute power directly to a limited number of high voltage AC airplane systems'],a:3,e:'FCOM 6.20.8. Main 235 Vac Bus Distribution System\nThere are four main 235 Vac buses, designated L1, L2, R1, and R2. These primary power system buses\nare located in the aft E/E bay power panels. They distribute power directly to a limited number of high\nvoltage AC airplane systems. In addition, they distribute power to all other airplane bus systems through\npower conversion devices. These buses can be energized by several different sources, depending on source\navailability and the operation being conducted.\nOn the ground, with only forward external power selected ON (no engine or APU generator power), the 235\nVac buses are energized by the 115 Vac distribution system through power conversion devices. If the APU or\nan engine(s) is subsequently started, they energizes the four main 235 Vac buses, and external power\ntransitions from ON to AVAIL.\nOn the ground, with only the APU power available (no external power or engine generator power), each APU ...'},
{c:'ELECTRICAL',q:'전원이 공급되지않는 항공기에서 Battery switch 를 On 위치로 이동 시킨 직후 APU를 시동 한다면, APU controller 는 APU 시동이 진행되기 전에 무엇을 기다리는가? FCOM 7.30.2',o:['The battery voltage of the main battery','APU inlet door position','That the common core system(CCS) applications are available','Fuel pressure from the right fuel manifold'],a:2,e:'FCOM 7.30.2. APU Start\nThe APU is started by either the left or right APU starter.\nEither starter can be powered by forward external power or an engine generator.\nThe APU battery powers the APU controller (APUC), air inlet door, and the right starter if required. The\nmain airplane battery powers the APU fuel shutoff valve, DC fuel pump, and fire detection system.\nRotating the APU selector to START begins the automatic start sequence.\nNote: If starting the APU from an unpowered airplane (battery switch recently moved to ON), the APUC\nwaits until the common core system (CCS) applications are available before proceeding with the start.\nThe CCS fire detection and fuel management applications are necessary to start the APU and are available\nwhen the CDU page is visible on the lower display unit.\nThe APUC commands the air inlet door to open.\nAPU fuel is supplied from the left fuel manifold by any operating AC fuel pump, or by the DC fuel pump in ...'},
{c:'ELECTRICAL',q:'Electric Power 가 공급받는 전압 중 틀린 것은?',o:['Engine Generator : AC 235V','APU Generator : AC 115V','External Power : AC 115V','Ram Air Turbine : AC 235V'],a:1,e:'FCOM 6.20.7. Power Flow and Load Distribution\nFCOM 6.20.1~3\nEngine Starter/Generators\nThe engine starter/generators function as electrically powered starter motors for engine start, and\nas engine driven generators once the engines are running.\nEach engine has two 235 Vac variable frequency starter/generators. L1 and L2 are mounted on\nthe left engine. R1 and R2 are mounted on the right engine. They are directly connected to the\nengine gearboxes,\nproducing variable frequency power proportional to engine rotor speed.\nAPU Starter/Generators\nAuxiliary Power Unit (APU) starter/generators function as electrically powered starter motors for\nAPU start, and as generators once the APU is running. The APU generators can provide electrical\npower for ground operations and supplemental power during flight. Additionally, normal engine\nstart is accomplished using electrical power supplied by the APU.\nThe APU has two 235 Vac variable frequency starter/generators, designated left (L) and right ...'},
{c:'ELECTRICAL',q:'Electric Bus 설명 중 맞는 것은?',o:['Remote Power Distribution Unit은 10A 이상의 Load들에게 전력을 공급한다','Brake Power의 Main Source는 AC 130V이다','Forward 및 Aft External Power는 AC 235V Bus에 Electrical Power를 제공한다','APU Generator와 External Power는 동시에 항공기에 공급될 수 있다'],a:3,e:'FCOM 6.20.5. Electrical Power Distribution and Conversion\nThe electrical system uses two distinct power distribution methods: primary and remote.\nThe primary power distribution method energizes higher amperage loads directly from bus power panels\nlocated in the forward and aft E/E bays.\nThe remote distribution method energizes lower amperage loads through a decentralized network of 17\nRemote Power Distribution Units (RPDU) located throughout the airplane.\nA limited number of high voltage 235 Vac electrical loads are energized from the aft E/E bay. The\nmajority of airplane electrical loads are 115 Vac and 28 Vdc, energized by the forward E/E bay power\npanels and RPDU.\n• RPDU 28 Vdc & 115 Vac Loads : 17 RPDU total, Loads 10 amps or less, Approximately 900 Loads\n• Primary 28 Vdc Loads : Brake Power\n• FWD EXT Power : Primary 115 Vac Bus에 Electrical Power 제공\n• AFT EXT Power : Large Motor Power System(LMPS)에 Electrical Power 제공'},
{c:'ELECTRICAL',q:'Electric Synoptic 화면에 대한 설명 중 틀린 것은?',o:['Main 및 APU Battery 상태는 Status Page에서만 확인 가능하다','Engine 당 2개의 Starter 모두 결함이 있으면, STARTERS라는 Amber 문구가 나타난다','APU Start 시 Synoptic 상 확인이 가능하다','Load Shedding System List들을 확인할 수 있다'],a:0,e:'FCOM 6.20.4. Battery Power\nThe airplane has one main battery, and one APU battery. The main battery power switch is located\non the overhead electrical panel. The APU battery functions automatically, and has no flight deck\npower switch.\nOperating indications for the main and APU batteries are provided on the electrical synoptic.\nFCOM 7.40.2.\nENG STARTERS L, R : Advisory - Both starters on the engine are inoperative.\nFCOM 6.10.6. / 6.10.9.\nAPU starter on (white box with green arrow) : An APU start is in progress. Start Power Indication\n(green arrow) from Large Motor Power System symbol also shows at this time.'},
{c:'ELECTRICAL',q:'CBIC(Circuit Breaker Indications and Control) 에 대한 설명 중 틀린 것은?',o:['Circuit Breaker는 Electric과 Thermal Type이 있다','Electric Circuit Breaker는 상태 확인 및 제어가 가능하다','Thermal Circuit Breaker는 제어가 가능하다','검색 기능을 사용하여 특정 Circuit Breaker를 찾을 수 있다'],a:2,e:'FCOM 6.20.14. Circuit Breaker Indication and Control (CBIC)\nCBIC provides indication and control for Electronic Circuit Breakers (ECB), and indication-only\nfor Thermal Circuit Breakers (TCB). CBIC can be viewed on any MFD, and operated using a CCD\nand MFK. Circuit breaker operational status is depicted by a symbol.\nThe circuit breaker (CB) list can be sorted by the following categories using the CBIC menu soft\nkeys at the top of the display :\n• Flight Deck CB • Open/Trip CB • CB by State • CB Search • CB by ATA\n• CB by location • Recent Used CB • CB Custom List'},
{c:'ELECTRICAL',q:'VFSG(Variable Frequency Starter Generator) 에 대한 설명 중 틀린 것은?',o:['상황에 따라 Engine VFSG는 Starter와 Generator 기능을 모두 수행할 수 있다','APU Generator는 Starter와 분리되어 독립적 기능을 가진다','APU에는 2개의 VFSG가 있다','APU Battery로 APU Start 시 Right APU VFSG가 사용된다'],a:1,e:'FCOM 6.20.1. Engine Starter/Generators\nThe engine starter/generators function as electrically powered starter motors for engine start, and as\nengine driven generators once the engines are running.\nFCOM 6.20.2. APU Starter/Generators\nAuxiliary Power Unit (APU) starter/generators function as electrically powered starter motors for APU\nstart, and as generators once the APU is running. The APU generators can provide electrical power for\nground operations and supplemental power during flight. Additionally, normal engine start is accomplished\nusing electrical power supplied by the APU.\nThe APU has two 235 Vac variable frequency starter/generators, designated left (L) and right (R).\nThe generators are directly connected to the APU gearbox, producing variable frequency power proportional\nto APU speed.\nElectrical power for APU start can be provided by forward external power, APU battery, or engine generated ...'},
{c:'ELECTRICAL',q:'ELEC GEN OFF L1, L2, R1, R2 Advisory message 가 시현 되는 시기는?',o:['The generator control breaker is open','The generator control breaker is close','The generator control valve is open','The generator control valve is close'],a:0,e:'FCOM 6.30.1.\nELEC GEN OFF L1, L2, R1, R2 : Advisory - The generator control breaker is open.'},
{c:'ELECTRICAL',q:'Towing power switch 가 On 위치에 있을 때 energized 되는 것은 무엇인가?',o:['Main batteries energize only the equipment essential for towing operations.','The main and APU batteries energize only the equipment essential for towing operations.','APU batteries energize only the equipment essential for towing operations.','Stan-by batteries energize only the equipment essential for towing operations.'],a:1,e:'FCOM 6.20.10. Towing Power mode\nTowing Power mode is active when the TOWING POWER switch is selected to ON (with the main\nBATTERY switch OFF).\nThe main and APU batteries energize only the equipment essential for towing operations.\n(Refer to Towing Power Panel in Chapter 6, Section 10, for additional information.)\nSignificant loads energized by this mode include :\n• captain’s ACP               • captain’s flight interphone   • flight deck dome lights\n• aisle stand flood lights   • navigation lights                • brakes\nNote: Radio communication systems are not energized in the towing power mode.'},
{c:'ELECTRICAL',q:'B787 항공기 Electrical power source 의 종류 중 맞는 것은?',o:['Three variable frequency engine starter/generators','Two variable frequency APU starter/generators','Two APU battery','Two external AC power receptacles'],a:1,e:'FCOM 6.20.1. Electrical System Power Sources\nThe electrical power sources are :\n• four variable frequency engine starter/generators (VFSG)\n• two variable frequency APU starter/generators\n• three external AC power receptacles\n• one Ram Air Turbine (RAT)\n• one main battery\n• one APU battery\n• three flight control Permanent Magnet Generators\n• two EEC Permanent Magnet Alternators\nThe power sources remain isolated from each other throughout the generation\nand distribution channels. During power transfers, a brief power interruption may\noccur as buses are energized from a new power source.'},
{c:'ELECTRICAL',q:'지상에서 Towing power mode 가 Active 되었을 경우 Navigation light 에 전원을 공급 하는 곳 은? FCOM 6.20.4',o:['Main battery','Stand by battery','APU battery','APU battery 와 Stand by battery'],a:2,e:'FCOM 6.20.4. Battery Power\nThe APU battery provides power on the ground for :\n• APU start\n• navigation lights (when Towing Power mode is active)\n(Refer to Modes of Operation in Chapter 6, Section 20, for additional information.)'},
{c:'FIRE PROTECTION',q:'Engine fire and overheat detection system 에 대한 설명 중 맞는 것은?',o:['Both loops must detect a fire or overheat condition to cause an engine fire warning or overheat caution','There are multiple dual channel detector assemblies in each engine nacelle. Each detector channel provides both fire and overheat detection','There are two detector loops in each engine nacelle. Each detector loop provides both fire and overheat detection','If a fault is detected in one loop, no further fire or overheat protection is provided'],a:1,e:'FCOM 8.20.1. Engine Fire and Overheat Detection\nThere are multiple dual-channel detector assemblies in each engine nacelle.\nEach detector channel provides both fire and overheat detection.\nNormally, at least one element on each channel must detect a fire or overheat\ncondition to cause an engine fire warning or overheat caution.\nIf a fault is detected in one channel, the remaining channel element\nautomatically switches to single channel operation. If the operating channel\nsenses a fire or overheat, the system provides the appropriate fire warning or\noverheat caution.\nIf both main engine detector elements on a single assembly are faulted, no fire\nor overheat detection is provided. The EICAS advisory message DET FIRE ENG (L or\nR) is displayed if the engine fire detection system fails.'},
{c:'FIRE PROTECTION',q:'APU fire extinguishing system 에 대한 설명 중 맞는 것은?',o:['There are two APU fire extinguisher bottles. When the APU fire switch is pulled out, rotating the switch in either direction discharges one of the bottles','In normal operation on the ground with both engines off, an APU overheat signal from either APU detection loop causes an automatic shutdown','In the event of an APU fire, if after the discharge of the first APU fire extinguisher bottle, the APU FIRE EICAS warning message remains illuminated, rotating the APU fire switch in the opposite direction discharges the second APU fire extinguisher bottle','On the ground with both engines off, an APU fire signal from either APU fire detector loop causes APU shutdown and extinguisher bottle discharge 0'],a:3,e:'FCOM 8.20.4. APU Fire Detection / APU Fire Extinguishing\nThe APU compartment has dual fire detector loops. There is no APU overheat\ndetection.\nNormally, both loops must detect a fire to produce a fire warning. An APU fire\nwarning automatically shuts down the APU.\nThere is one APU fire extinguisher bottle. When the APU fire switch is pulled\nout, rotating the switch in either direction discharges the extinguisher bottle into\nthe APU compartment.\nAn APU fire signal causes the APU to shutdown immediately. The APU\nextinguisher bottle is automatically discharged after a 15 second delay to allow\ntime for the fuel valve to close.\nOn the ground with both engines off an APU fire signal from either APU fire\ndetector loop causes APU shutdown and extinguisher bottle discharge.'},
{c:'FIRE PROTECTION',q:'Forward cargo compartment 에는 몇 개의 Smoke detector가 장착되어 있는가?',o:['17개','18개','19개','20개'],a:1,e:'FCOM 8.20.5. Cargo Compartment Smoke Detection\nHL7206 - HL8393 : The forward and aft cargo compartments each have smoke\ndetectors. Eighteen detectors are installed in the forward cargo compartment.\nEleven detectors are installed in the aft (nine detectors) / bulk (two detectors)\ncargo compartments.\n60306 - 66879, HL8515 - HL8572 : The forward and aft cargo compartments each\nhave smoke detectors. Twenty two detectors are installed in the forward cargo\ncompartment. Thirteen detectors are installed in the aft (eleven detectors) / bulk\n(two detectors) cargo compartments.'},
{c:'FIRE PROTECTION',q:'FIRE TEST PASS warning message 가 시현 되는 시기는?',o:['Manually initiated test of the fire/overheat detection system has been started','Automatically initiated test of the fire/overheat detection system has been completed','Automatically initiated test of the fire/overheat detection system has been started','A manually initiated test of the fire/overheat detection system has been completed'],a:3,e:'FCOM 8.20.8.\nFire and Overheat Detection System Fault Test\nThe fire and overheat detection system has automatic and manual fault testing.\nFire and Overheat Detection System Automatic Fault Test\nFire and overheat detection system testing is automatic. The engine and APU\nsystems continuously monitor the fire/overheat detector loops for faults. The cargo\nand wheel well systems continuously monitor for any system faults.\nFire and Overheat Detection System Manual Fault Test\nThe fire and overheat detection systems can be tested manually by pushing and\nholding the FIRE/OVERHEAT TEST switch.\nWhen the test is complete, the EICAS warning message FIRE TEST PASS or FIRE\nTEST FAIL replaces the FIRE TEST IN PROG message; the switch can be released.'},
{c:'FIRE PROTECTION',q:'Bulk cargo compartment 에는 몇 개의 Smoke detector가 장착되어 있는가?',o:['2개','3개','4개','5개'],a:0,e:'FCOM 8.20.5. Cargo Compartment Smoke Detection\nHL7206 - HL8393 : The forward and aft cargo compartments each have smoke\ndetectors. Eighteen detectors are installed in the forward cargo compartment.\nEleven detectors are installed in the aft (nine detectors) / bulk (two detectors)\ncargo compartments.\n60306 - 66879, HL8515 - HL8572 : The forward and aft cargo compartments\neach have smoke detectors. Twenty two detectors are installed in the forward\ncargo compartment. Thirteen detectors are installed in the aft (eleven detectors)\n/ bulk (two detectors) cargo compartments.'},
{c:'FIRE PROTECTION',q:'다음 중 Engine Fire Switches 가 자동으로 unlock 되는 경우는?',o:['They must be manually unlocked','When the AUTOSTART switch is on','On the ground, anytime the APU is running','For a fire warning, or when the FUEL CONTROL switch is in CUTOFF'],a:3,e:'FCOM 8.10.1. Engine Fire Switches\nIn – normal position, mechanically locked;\nunlocks automatically for a fire warning, or when the FUEL CONTROL\nswitch is in CUTOFF.\nOut – • arms both engine fire extinguishers\n• closes the associated engine and spar fuel valves\n• closes the associated engine anti-ice valves'},
{c:'FIRE PROTECTION',q:'Cargo compartment 에는 몇 개의 Fire extinguisher bottle 이 장착되어 있는가?',o:['3 개','4 개','5 개','6 개'],a:3,e:'FCOM 8.20.6.\nHL8515 - HL8538 : Five fire extinguisher bottles are installed for cargo\ncompartment fire extinguishing. Pushing the FWD or AFT CARGO FIRE ARM switch\n(ARMED visible) arms the extinguishers.\n60306 - HL8393, HL8572 : Six fire extinguisher bottles are installed for cargo\ncompartment fire extinguishing. Pushing the FWD or AFT CARGO FIRE ARM switch\n(ARMED visible) arms the extinguishers.'},
{c:'FIRE PROTECTION',q:'Wheel well fire 설명 중 틀린 것은?',o:['The main wheel well has fire and overheat detection','The main wheel well has fire extinguishing system','The nose wheel well does not have fire extinguishing system','The nose wheel well does not have a fire or overheat detection system'],a:1,e:'FCOM 8.20.5.\nMain Wheel Well Fire Protection\nThe main wheel well has fire and overheat detection.\nThere is no fire extinguishing system.\nThe nose wheel well does not have a fire or overheat detection system.\nMain Wheel Well Fire and Overheat Detection\nThe main wheel well fire and overheat detection system consists of dual\ndetector channels.'},
{c:'FIRE PROTECTION',q:'APU fire detection 설명 중 맞는 것은?',o:['The APU compartment has single fire detector loops','There are APU overheat and fire detection','Normally, one loop detects a fire to produce a fire warning','An APU fire warning automatically shuts down the APU'],a:3,e:'FCOM 8.20.4.\nThe APU compartment has dual fire detector loops.\nThere is no APU overheat detection.\nNormally, both loops must detect a fire to produce a fire warning.\nAn APU fire warning automatically shuts down the APU.\nIf a fault is detected in one loop, the system automatically switches to single loop\noperation.\nIf the operating loop detects a fire, an APU fire warning occurs and the APU shuts\ndown.\nThe EICAS advisory message DET FIRE APU is displayed if the APU fire detection\nsystem fails.'},
{c:'FIRE PROTECTION',q:'Engine fire and overheat detection 설명 중 틀린 것은?',o:['There are multiple dual-channel detector assemblies in each engine nacelle','Normally, dual elements on each channel must detect a fire or overheat condition to cause an engine fire warning or overheat caution','If a fault is detected in one channel, the remaining channel element automatically switches to single channel operation','The EICAS advisory message DET FIRE ENG (L or R) is displayed if the engine fire detection system fails'],a:1,e:'FCOM 8.20.1. Engine Fire and Overheat Detection\nThere are multiple dual-channel detector assemblies in each engine nacelle.\nEach detector channel provides both fire and overheat detection.\nNormally, at least one element on each channel must detect a fire or overheat\ncondition to cause an engine fire warning or overheat caution.\nIf a fault is detected in one channel, the remaining channel element\nautomatically switches to single channel operation. If the operating channel\nsenses a fire or overheat, the system provides the appropriate fire warning or\noverheat caution.\nIf both main engine detector elements on a single assembly are faulted, no\nfire or overheat detection is provided. The EICAS advisory message DET FIRE ENG\n(L or R) is displayed if the engine fire detection system fails.'},
{c:'FIRE PROTECTION',q:'Engine overheat indication 이 아닌 것은?',o:['The engine FUEL CONTROL (L or R) switch fire light illuminates','The caution beeper sounds','The master CAUTION lights illuminate','The EICAS caution message OVERHEAT ENG (L or R) is displayed'],a:0,e:'FCOM 8.20.2. Engine Overheat Caution\nThe indications of an engine overheat are :\n• the caution beeper sounds\n• the master CAUTION lights illuminate\n• the EICAS caution message OVERHEAT ENG (L or R) is displayed'},
{c:'FIRE PROTECTION',q:'Engine에 장착된 Fire extinguisher bottle 은 몇개인가?',o:['2 for each engine(total 4)','2 for all engine(total 2)','1 for each engine(total 2)','4 for all engine(total 4)'],a:1,e:'FCOM 8.20.6. Cargo Compartment Fire Extinguishing\nHL8515 - HL8538\nIn flight, a fire warning from the cargo fire detection system causes the immediate total discharge of two\nextinguisher bottles into the affected compartment. After a 15 minute time delay, the remaining three\nextinguisher bottles discharge at a reduced flow rate into the affected compartment. If the airplane lands\nwithin the 15 minute time delay, only one of the remaining bottles discharges at the reduced rate on\ntouchdown.\n60306 - HL8393, HL8572\nIn flight, a fire warning from the cargo fire detection system causes the immediate total discharge of two\nextinguisher bottles into the affected compartment. After a 15 minute time delay, the remaining four\nextinguisher bottles discharge at a reduced flow rate into the affected compartment. If the airplane lands\nwithin the 15 minute time delay, one of the remaining bottles discharges at the reduced rate on touchdown. ...'},
{c:'FIRE PROTECTION',q:'Cargo compartment fire extinguishing 설명 중 틀린 것은? FCOM 8.20.6, 8.20.7',o:['In flight, pushing the CARGO FIRE DISCHARGE switch also activates the extinguishing system','On the ground, if a CARGO FIRE DISCHARGE switch is pushed, three extinguisher bottles discharge simultaneously into the selected compartment, with the third bottle discharging at a reduced flow rate','In flight, a fire warning from the cargo fire detection system causes the immediate total discharge of two extinguisher bottles into the affected compartment. After a 15 minute time delay, the remaining four extinguisher bottles discharge at a reduced flow rate into the affected compartment','The EICAS advisory message BOTTLE DISCH CARGO is displayed after all extinguisher bottles are discharged'],a:3,e:'FCOM 8.20.6. Cargo Compartment Fire Extinguishing\nHL8515 - HL8538\nIn flight, a fire warning from the cargo fire detection system causes the immediate total discharge of two\nextinguisher bottles into the affected compartment. After a 15 minute time delay, the remaining three\nextinguisher bottles discharge at a reduced flow rate into the affected compartment. If the airplane lands\nwithin the 15 minute time delay, only one of the remaining bottles discharges at the reduced rate on\ntouchdown.\n60306 - HL8393, HL8572\nIn flight, a fire warning from the cargo fire detection system causes the immediate total discharge of two\nextinguisher bottles into the affected compartment. After a 15 minute time delay, the remaining four\nextinguisher bottles discharge at a reduced flow rate into the affected compartment. If the airplane lands\nwithin the 15 minute time delay, one of the remaining bottles discharges at the reduced rate on touchdown. ...'},
{c:'FIRE PROTECTION',q:'Lavatory fire detection 설명 중 틀린 것은?',o:['If smoke is detected, an aural alert sounds in the lavatory and in the cabin','The EICAS warning message FIRE','The lavatory call light flashes and the master call light at the associated attendant station illuminates','Each lavatory has a single smoke detector'],a:1,e:'FCOM 8.20.7.\nLavatory Fire Detection\nEach lavatory has a single smoke detector. If smoke is detected, an aural alert\nsounds in the lavatory and in the cabin. In addition, the lavatory call light\nflashes and the master call light at the associated attendant station\nilluminates. The EICAS advisory message SMOKE LAVATORY is displayed.\nLavatory Fire Extinguishing\nEach lavatory has one fire extinguisher bottle. The bottle discharges through two\nnozzles into the waste container. Extinguisher operation is automatic. There is no\nflight deck indication.'},
{c:'FUEL',q:'Center tank fuel pumps 가 Main tank pumps 보다 Higher output pressure 를 갖는 이유는?',o:['The fuel must be lifted vertically to the engines','To move fuel a greater distance to the engines','To use center tank fuel before wing tank fuel','To jettison fuel is necessary 2.'],a:2,e:'FCOM 12.20.1. Fuel Pumps\nEach fuel tank contains two AC–powered fuel pumps. A single pump can supply\nsufficient fuel to operate one engine under all conditions.\nThe two center tank fuel pumps are override/jettison pumps.\nThese pumps have a higher output pressure than the left and right main tank\nfuel pumps.\nThe center tank pumps override the main tank pumps so that center tank fuel\nis used before wing tank fuel.'},
{c:'FUEL',q:'모든 Fuel pump 를 작동시키기에 충분한 Power 가 없을 때 Fuel pump 작동에 관한 설명 중 올바른 것은? FCOM 12.20.2',o:['The fuel system automatically determines the best pumps to operate depending on how much electrical power is available.','When there is not sufficient electrical power to operate all the fuel pumps, system logic dictates that the DC fuel pump is the first to be load shed','Because fuel pump operation is a function of the CCS, pumps are inhibited on the ground by programming until the flaps are extended','On the ground, the center tank pumps only operate when your VDSGs are powered and two electrical sources are available, so the center tank pumps are load shed first'],a:0,e:'FCOM 12.20.2. Fuel Pumps\nWhen the main tank fuel pump switches are off, the switch PRESS lights illuminate and the EICAS\nadvisory messages FUEL PUMP (L, R, FWD, or AFT) display. When the center fuel pump switches\nare off, the switch PRESS lights and pump pressure EICAS messages are inhibited.\nWhen less than all engines/generators are operating, there may not be sufficient electrical\npower to operate all fuel pumps. In such cases, the fuel system automatically determines the\nbest pumps to operate depending on how much electrical power is available.\nCertain fuel pumps may be load shed until enough electrical power is available. The indications\nthat a fuel pump has load shed are that the pump switch PRESS light is illuminated and the\npump is labeled LOAD SHED on the fuel synoptic.\nThe left main tank contains a DC–powered fuel pump. It has no controls or indicators, other\nthan the fuel synoptic display. The DC pump operates automatically to provide fuel to the APU ...'},
{c:'FUEL',q:'운항승무원은 비행 중 Manual cross feed 를 이용하여 어떻게 balance fuel을 실시 하는가?',o:['By turning off the fuel pump switches','By pushing the fuel balance switch and turning off the fuel pump switches on the tank with the lower quantity','By opening the cross feed valve and turning off fuel pumps on the main tank with the lower quantity','Access fuel in the center tank'],a:2,e:'FCOM 12.20.3. Fuel Imbalance\nFuel balancing is accomplished by using either the fuel balance system or the\nmanual crossfeed.\nManual crossfeed is initiated by opening the crossfeed valve and turning off\nthe fuel pump switches for the fuel tank that has the lower quantity.\nCrossfeed may be done in any phase of flight.\nThe fuel balance system is initiated by pushing the fuel balance switch.\nThe fuel balance system may be used in any phase of flight.\nIt can be used on the ground if the engines are shutdown and the APU is\nrunning.'},
{c:'FUEL',q:'B787 Fuel System 의 특징 중 맞는 것은?',o:['Fuel Balance switch가 있어 쉽게 fuel Balancing이 가능하다.','Nitrogen generation system이 장착되어 Fuel tank 내 산소농도를 높인다.','Maximum allowable overfill은 1,000lbs다.','APU AC pump가 있어 외부 전원이 없어도 APU는 동작 가능하다.'],a:0,e:'FCOM 12.20.9. Nitrogen Generation System\nThe Nitrogen Generation System (NGS) provides automatic full time flammability\nprotection for the fuel system. It generates nitrogen enriched air to displace fuel\nvapors in all fuel tanks. The nitrogen enriched air minimizes fuel flammability\nduring normal flight and ground operations.\nPOM 5.3.30. Maximum Allowable Overfill : 1500 lbs\nFCOM 12.20.7. APU Fuel Feed\nAPU fuel is supplied from the left fuel manifold. APU fuel can be provided by any\nAC fuel pump supplying fuel to the left fuel manifold or by the left main tank DC\nfuel pump.\nOn the ground, with the APU switch ON and no AC power available, the DC\npump runs automatically. With AC power available, the left aft AC fuel pump\noperates automatically, regardless of fuel pump switch position, and the DC fuel\npump turns off.\n.\nAFM. Fuel Loading (p.44/273 A134100)\n• Fuel density must be between 6.3 and 7.1 lb/gallon (0.7549 and 0.8507 kg/liter). ...'},
{c:'FUEL',q:'각 Fuel tank Capacities가 바르게 연결된 것은?',o:['Left main tank – 36,984 Pounds','Left main tank – 36,974 Pounds','Center tank – 149,684','Surge tank – 12,784 Pounds'],a:0,e:'FCOM 12.20.5 Fuel Tank Capacities 모든연료량 외우기'},
{c:'FUEL',q:'각 Fuel tank Capacities가 바르게 연결된 것은?',o:['Left main tank – 36,948 Pounds','Right main tank – 36,974 Pounds','Center tank – 149,684 Pounds','Total – 223,646 Pounds'],a:3,e:'FCOM 12.20.5 Fuel Tank Capacities 모든연료량 외우기'},
{c:'FUEL',q:'Fuel quantity에 대한 설명 중 맞는 것은?',o:['각 Tank에 장착된 Sensor에서 측정한다','Total fuel quantity는 Third EICAS에 시현 된다','Total fuel quantity는 Fuel synoptic 에는 시현 되지 않는다.','정상 상황에서도 Fuel synoptic에는 Expended fuel indication이 시현 된다'],a:0,e:'FCOM 12.20.1. Fuel Quantity\nFuel quantity is measured by sensors in each tank.\nTotal fuel quantity is displayed on the primary EICAS display.\nTank quantities and total fuel quantity are displayed on the FUEL synoptic\ndisplay.\nExpanded fuel indications showing the left main, center, and right main tank\nquantities are displayed when non-normal conditions occur.\nDue to the unique shape of the 787 composite wing, fuel quantity indications can\nfluctuate significantly during high pitch maneuvers, such as takeoff and go-\naround, especially at low fuel loads.'},
{c:'FUEL',q:'Nitrogen generation system에 대한 설명 중 맞는 것은?',o:['Forward cargo air에서 산소만 분리하여 화물의 화재 위험을 낮춘다','분리된 질소와 물은 다시 기내로 공급하여 승객들에게 쾌적함을 제공한다','고도와 상관없이 15%의 산소 농도를 Fuel tank 내 유지시킨다','공기 내 질소를 분리 후 Fuel tank 에 공급하여 Fuel vapor로 인한 화재 등의 위험을 최소화 한다'],a:3,e:'FCOM 12.20.9. Nitrogen Generation System\nThe Nitrogen Generation System (NGS) provides automatic full time\nflammability protection for the fuel system.\nIt generates nitrogen enriched air to displace fuel vapors in all fuel\ntanks.\nThe nitrogen enriched air minimizes fuel flammability during\nnormal flight and ground operations.'},
{c:'FUEL',q:'FUEL DISAGREE Advisory message는 어느 경우에 시현 되는가?',o:['Center tank 와 Main tank 의 연료 차이가 발생 되었을 경우','Center tank 와 Main tank 의 연료가 차이가 1,500 lbs 이상 일 경우','Totalizer와 Calculated 의 연료 차이가 발생 되었을 경우','Totalizer와 Calculated 의 연료가 차이가 1,500 lbs 이상 일 경우'],a:2,e:'FCOM 12.30.2.\nFUEL DISAGREE : Advisory\n- The totalizer fuel quantity and the FMC calculated fuel quantity disagree.'},
{c:'FUEL',q:'Fuel temperature 설명 중 맞는 것은?',o:['Fuel temperature is displayed on the secondary EICAS display','The temperature is normally displayed in amber','During jettison, the TO REMAIN quantity replaces the EICAS display fuel temperature indications only','Fuel temperature and minimum fuel temperature are also displayed on the fuel synoptic display'],a:3,e:'FCOM 12.20.1. Fuel Temperature\nFuel temperature is displayed on the primary EICAS display.\nThe temperature is normally displayed in white.\nIt is displayed in amber when the fuel temperature approaches maximum or\nthe fuel freeze temperature entered on the flight management system CDU.\nDuring jettison, the TO REMAIN quantity replaces the EICAS display static air\ntemperature and fuel temperature indications.\nFuel temperature and minimum fuel temperature are also displayed on the\nfuel synoptic display.'},
{c:'FUEL',q:'Fuel pump operation 설명 중 맞는 것은?',o:['Regardless main tank pump switches position, a scavenge system operates automatically to transfer any remaining center tank fuel to the main tanks','Fuel transfer by scavenge system begins when either main tank quantity is less than approximately 35,000 pounds and the center tank pumps are off','The FUEL IN CENTER message means unusable fuel is in center tank','FUEL PUMP CENTER (L or R) displays when any center pump switch on is required'],a:1,e:'FCOM 12.20.2. Fuel Pump Operation\nBefore start, the main tank pump switches should all be pushed ON.\nIf the FUEL IN CENTER message is displayed, the center tank pump switches should also be\npushed ON.\nDuring flight, when the FUEL LOW CENTER message displays, the center tank pump switches\nshould be pushed off. The condition statement for this message is contained in Section 12.30, Fuel\nSystem EICAS Messages.\nIf a center pump has low output pressure, the fuel pump switch PRESS light illuminates and the\nmessage FUEL PUMP CENTER (L or R) displays.\nWith the main tank pumps ON, a scavenge system operates automatically to transfer any\nremaining center tank fuel to the main tanks.\nFuel transfer begins when either main tank quantity is less than approximately 35,000\npounds(depending on fuel density) and the center tank pumps are off.\nThe system is inhibited if the engine is on suction feed.'},
{c:'FUEL',q:'Fuel balance operation이 inhibit 되는 조건이 아닌 것은?',o:['Prior to engine start and the APU is off','A center tank pump is on','In flight and the fuel jettison system is active','On the ground and both engines are shutdown'],a:3,e:'FCOM 12.20.3. Fuel Balance System\nFuel can be transferred from main tank to main tank using the fuel balance system.\nFuel transfer is initiated by pushing the fuel balance switch ON. Fuel from the higher\nquantity main tank is transferred through its defuel/jettison valve to the lower quantity\nmain tank through its inboard refuel valve. Transfer stops automatically when fuel is\nbalanced.\nAnytime the fuel balance system is selected ON and balance is not achieved, the balance\nsystem shuts down, the BALANCE switch FAULT light illuminates, and the EICAS advisory\nmessage FUEL BALANCE SYS is displayed. This occurs if there is a system failure or if the\nsystem is functional but inhibited.\nFuel balance operation is inhibited for the any of the following reasons :\n• refueling, defueling and ground transfer of fuel (using the refueling control panel)\n• the fuel balance system is failed\n• a center tank pump is on\n• on the ground and one or both engines are running ...'},
{c:'FUEL',q:'Fuel balance 가 자동으로 꺼지는 조건이 아닌 것은?',o:['Jettison system is active','Fuel is balanced','FUEL IN CENTER message is displayed','Airplane is on ground and either engine running'],a:2,e:'FCOM 12.10.2. BALANCE Switch\nON – the balance system is selected on.\nOff (ON not visible) –\n• system is not commanded ON\n• off is manually selected\n• fuel balance is automatically commanded off for one of the following :\n• fuel is balanced\n• jettison system is active\n• FUEL DISAGREE message is displayed\n• FUEL QTY LOW message is displayed\n• airplane is on ground and either engine running'},
{c:'FUEL',q:'Fuel jettison 설명 중 맞는 것은?',o:['The nozzles cannot open on the ground, regardless of switch positions','The fuel jettison system allows jettison from center fuel tank only','When the FUEL TO REMAIN quantity is reached, the crew must turn off nozzle L and R to stop fuel jettison','There is no automatic system to set the fuel to remain, the crew should set remain quantity manually'],a:0,e:'FCOM 12.20.7. Fuel Jettison\nThe fuel jettison system allows jettison from all fuel tanks. Fuel jettison is accomplished by\nopening the center tank jettison isolation valves and the main tank defuel/isolation valves. Fuel\nflows into the jettison/refuel manifold and is then jettisoned overboard through jettison nozzle\nvalves inboard of each aileron.\nFuel jettison is initiated by pushing the FUEL JETTISON ARM switch to select ARMED. The jettison\nsystem automatically sets the fuel–to–remain to the maximum landing weight (MLW) fuel\nquantity. The TO REMAIN quantity replaces fuel temperature on the EICAS display.\nPull on and rotate the TO REMAIN selector to manually decrease or increase the TO REMAIN\nquantity.\nIn flight, when the FUEL JETTISON ARM switch is armed and either fuel jettison NOZZLE switch is\npushed ON, the defuel/isolation valves and jettison isolation valves open. The fuel system\nautomatically positions the valves as required to jettison fuel based on the selected TO REMAIN ...'},
{c:'FUEL',q:'Fuel jettison 설명 중 틀린 것은?',o:['Do not jettison at flap 30','Nozzle VALVE Lights Illuminated (amber) – the jettison nozzle valve is not in the selected position','FUEL TO REMAIN Selector PULL ON – changes the mode from maximum landing weight to manual','The fuel jettison nozzle valve is selected on - if in flight and jettison is armed, opens center tank jettison isolation valves not main tank valves'],a:3,e:'FCOM 12.10.2. ~ 12.10.3.\n‘DO NOT JETT AT FLAPS 30’\nFuel Jettison NOZZLE Switches\nON : • the jettison nozzle valve is selected open in flight\n• if in flight and jettison is armed, opens main tank defuel/isolation valves\nand center tank jettison isolation valves\nFuel Jettison Nozzle VALVE Lights\nIlluminated (amber) – the jettison nozzle valve is not in the selected position.\nFUEL TO REMAIN Selector\nPULL ON – changes the mode from MLW (maximum landing weight)\nto MAN(manual).'},
{c:'FLIGHT MANAGEMENT',q:'FMS(Flight management system) CDU(Control display unit) 의 Line selector key 를 선택 하였을 경우 나타나는 현상이 아닌 것은? FCOM 11.10.3',o:['Displayed emergency frequency on the scratchpad','Moves data from scratchpad to selected line','Selects page, procedure, or performance mode as applicable','Deletes data from selected line when DELETE displays in scratchpad'],a:0,e:'FCOM 11.10.3. Line Select Keys\nSelect –\n• moves data from scratchpad to selected line\n• moves data from selected line to scratchpad\n• selects page, procedure, or performance mode as applicable\n• deletes data from selected line when DELETE displays in scratchpad\nConventions –\n• scratchpad must be blank for line select transfer\n• data can not be transferred to a blank line\n• a blank scratchpad can not be transferred to a line\n• not all data can be modified\n• message displays if inappropriate entries are attempted'},
{c:'FLIGHT MANAGEMENT',q:'FMS(Flight management system) CDU(Control display unit) 의 Line selector key 를 선택 하였을 경우 나타나는 현상이 아닌 것은? FCOM 11.10.3',o:['Displayed emergency frequency on the scratchpad','Moves data from scratchpad to selected line','Selects page, procedure, or performance mode as applicable','Deletes data from selected line when DELETE displays in scratchpad'],a:0,e:'FCOM 11.10.3. Line Select Keys\nSelect –\n• moves data from scratchpad to selected line\n• moves data from selected line to scratchpad\n• selects page, procedure, or performance mode as applicable\n• deletes data from selected line when DELETE displays in scratchpad\nConventions –\n• scratchpad must be blank for line select transfer\n• data can not be transferred to a blank line\n• a blank scratchpad can not be transferred to a line\n• not all data can be modified\n• message displays if inappropriate entries are attempted'},
{c:'FLIGHT MANAGEMENT',q:'CDU help window에 NAV DATA OUT OF DATE가 시현 되었다면 이 Message 의 의미는?',o:['The correct database has been selected on the IDENT page','The current date not in data base range select new data base on ident page','LNAV has been selected an a route has not been activated','FMC performance prediction are not available'],a:1,e:'FCOM 11.60.10. NAV DATA OUT OF DATE\n• The clock calendar date is after the active navigation database valid calendar\ncycle.\n• CURRENT DATE NOT IN DATA BASE RANGE SELECT NEW DATA BASE ON\nIDENT PAGE'},
{c:'FLIGHT MANAGEMENT',q:'Advisory message 인 NAV IRU 시현의 의미는?',o:['Both IRUs are inoperative','The IRU is only providing pitch and roll guidance','the IRS cannot supply correct attitude, position, track, and groundspeed data','Any two or more of the IRUs or AHRUs are in the alignment mode'],a:0,e:'FCOM 11.60.3.\nNAV IRU : Both IRUs are inoperative.'},
{c:'FLIGHT MANAGEMENT',q:'FMC(Flight management computer) 와 CDUs(Control display units) 에 대한 설명 중 맞는 것은? FCOM 11.30.2',o:['The flight crew controls the FMC using emulated CDU displays','At power up, both FMCs are used to accomplish the flight management tasks','CDUs are only displayed on the lower Du','There are two independent FMCs'],a:0,e:'FCOM 11.30.1. Flight Management Computer (FMC)\nThe basis of the flight management system is the flight management computer\nfunction. Since the term FMC is universally understood, it is used here for\nstandardization and simplification.\nThere are three independent FMCs.\nAt power up, one FMC is designated to accomplish the flight management\ntasks while the other FMCs monitor.\nThe second FMC is ready to replace the first FMC if system faults occur. When\nthe second FMC becomes active, the third FMC becomes its backup. (Refer to\nFMC Failure in Chapter 11, Section 32, for additional information.)\nFCOM 11.30.2. Control Display Units (CDUs)\nThe flight crew controls the FMC using emulated CDU displays. The CDUs may\nbe displayed on any of the MFDs as selected by the aircrew.'},
{c:'FLIGHT MANAGEMENT',q:'Alternate navigation radio는 ILS frequency 와 course 또는 GLS channel을 왼쪽 INR (integrated navigation receiver) 로 Tuning 하는 Backup 수단을 제공한다. ALTN NAV RADO page에 관한 설명 중 맞는 것은? FCOM 11.50.4',o:['When alternate navigation is selected ON and the EICAS advisory message TCP ALTN NAV is displayed, it is possible to have the left and right ILS or GLS tuned to different frequencies /channels.','Pushing the CTRT(control) select switch to on, backup navigation tuning(enabled), allows an ILS frequency and course or GLS channel to boe tuned into the left or right INR','Pushing the CTRT(control) select switch to off, backup navigation tuning(disabled), causes the ILS-GLS and course change color from cyan to white','When the desired ILS frequency is entered into the ILS-GLS line, the inbound course is set automatically and INR ILS or GLS deviations are displayed on the onside PFD'],a:0,e:'FCOM 11.50.3. Alternate Navigation Radio Page\nThe ALTN NAV RADIO page provides a backup means of tuning the ILS frequency\nand course or GLS channel into the left integrated navigation receiver (INR). Left\nside ILS or GLS deviations are then shown on the captain’s PFD and the ISFD.\nNote: When alternate navigation is selected ON and the EICAS advisory\nmessage TCP ALTN NAV is displayed, it is possible to have the left and right\nILS or GLS tuned to different frequencies/channels.\nPilots must ensure that the correct ILS frequencies or GLS channels are tuned for\nthe approach being flown.\nThe PFD approach data block always shows the tuned ILS frequency or GLS\nchannel or the received ident for the on-side system.\nFCOM 11.50.5.\n1 ILS-GLS\nPush – enters an ILS frequency or GLS channel from the scratchpad when in backup mode.\nEntry format must  be NNN.NN for an ILS frequency or NNNNN for a GLS channel.\nDefaults to most recently tuned ILS frequency or GLS channel if available. ...'},
{c:'FLIGHT MANAGEMENT',q:'Progress 2 page에서 확인할 수 있는 항목은?',o:['Step climb altitude','Total distance until destination airport','Static air temperature','Ground speed'],a:2,e:'FCOM 11.42.54. Progress Page 2\nProgress page two contains : • fuel data • static air temperature • true airspeed • track error data • wind data'},
{c:'FLIGHT MANAGEMENT',q:'FMS에 Longitude 와 latitude 로 입력 시 CDU Display 에 나타나는 상태 중 맞는 것은?',o:['N50° W040° becomes 50N40','N50° E020° becomes 5020E','S07° W120° becomes 0720W','S06° E110° becomes 06E10'],a:1,e:'FCOM 11.31.15.\nN is used for north latitude, west longitude. E is used for north latitude, east\nlongitude. S is used for south latitude, east longitude. W is used for south latitude,\nwest longitude. Examples :\n• N50° W040° becomes 5040N    • S52° W075° becomes 5275W\n• N75° W170° becomes 75N70    • S07° W120° becomes 07W20\n• N50° E020° becomes 5020E      • S50° E020° becomes 5020S\n• N06° E110° becomes 06E10      • S06° E110° becomes 06S10'},
{c:'FLIGHT MANAGEMENT',q:'기장 과 부기장의 Display가 같은 ILS 또는 GLS source가 사용되었을 경우 시현 되는 Message는 무엇 인가? FCOM 11.60.3',o:['SAME SOURCE APPROACH – Advisory','SGL SOURCE APPROACH - Advisory','SAME SOURCE APPROACH - Caution','SGL SOURCE APPROACH – Caution'],a:3,e:'FCOM 11.60.3.\nSGL SOURCE APPROACH :\nCaution / Beeper / Both pilots’ displays use the same ILS or GLS source.'},
{c:'FLIGHT MANAGEMENT',q:'ND 에 GRID heading이 시현 되는 시기는?',o:['North of 80°N or south of 80°S','North of 75°N or south of 75°S','North of 70°N or south of 70°S','North of 65°N or south of 65°S'],a:2,e:'FCOM 10.40.8. GRID Heading (W) : Displays above 70º latitude.\nFCOM 11.31.9. FMC Polar Operations\nWhen entering the polar regions, the autopilot will automatically switch to a true north\nreference for all cruise roll modes (HDG HOLD, HDG SEL, TRK HOLD, TRK SEL, and LNAV)\nregardless of the position of the HEADING REF switch.\nAutomatic switching to a true north reference is annunciated by a white box around the\nword TRU on both the ND and PFD. The CDU RTE LEGS page will also display a “T” next\nto the leg course data on the line title when operating in true north reference. A true\nheading reference can be manually selected by placing the HEADING REF switch to TRUE\ninside or outside the polar region.\nWhen leaving the polar regions, the autopilot will automatically switch back to a magnetic\nreference if the HEADING REF switch is in the NORM position. The ND and PFD display a\ngreen box around the word MAG to annunciate the change back to magnetic reference. If ...'},
{c:'GENERAL / DOORS',q:'Flight deck access key pad 에 정확한 Emergency access code 를 입력하였을 경우 나타나는 표시는 무엇인가? FCOM 1.30.23',o:['The entry of the correct emergency access code produces an EICAS caution message and illuminates a red light on the keypad.','The entry of the correct emergency access code initiates the EICAS warning message FD DOOR AUTO UNLOCK and illuminates the amber light on the keypad','The entry of the correct emergency access code produces an EICAS Advisory message and illuminates a green light on the keypad.','Entry of the correct emergency access code sounds a flight deck chime'],a:1,e:'FCOM 1.30.23. Keypad\nPush :\n• enter the 3 to 8 digit emergency access code followed by the ENT key.\nEntry of the correct emergency access code initiates the EICAS warning\nmessage FD DOOR AUTO UNLOCK, and illuminates the amber light\non the keypad.\n• enter 1 then the ENT key to activate the optional doorbell function.\nA hi-low chime and EICAS COMM message FD DOOR CALL are initiated.'},
{c:'GENERAL / DOORS',q:'OFAR(Overhead Flight Crew Rest) 에 대한 설명 중 맞는 것은?',o:['OFAR을 탈출 할 수 있는 탈출구는 하나뿐이다','비상 장비로 소화기는 준비되어 있지 않다','이착륙 중에도 침대를 사용 할 수 있다','Decompression이 되었을 경우 Horn sound가 나며 Green oxygen indicator가 들어온다'],a:3,e:'FCOM 1.46.22. Evacuation\nThe primary evacuation route is down the entrance stairway through the entrance enclosure.\nIf the main entrance is unusable, evacuation is possible through the emergency hatch located at the\nbunk on the right side.\nFCOM 1.46.18. Emergency Equipment Location\nFCOM 1.46.2. Occupancy\nThe overhead flight crew rest is to be occupied by flight crew members trained\nin the use of the crew rest evacuation routes, fire fighting and depressurization\nprocedures.\nNote: A placard is installed indicating any overhead flight crew rest occupancy restrictions.\nNote: The OFCR seat may be occupied during taxi, takeoff, or landing operations. The bunks and\ncommon area may not be occupied. The OFCR door must be latched open when occupied during taxi,\ntakeoff or landing.\nFCOM 1.46.19. OFCR Non-Normal Situation Guidelines\nDecompression\nIf a cabin decompression occurs during cruise, a decompression (continuous) horn sounds in the main ...'},
{c:'GENERAL / DOORS',q:'다음 소화기에 대한 설명 중 맞는 것은?',o:['물 소화기는 모든 종류의 화재에 사용 가능하다','Flight deck area에서 halon 소화기를 사용 할 때는 반드시 산소마스크를 100%로 착용해야 한다','물 소화기의 물은 식용이 가능하다','Halon 소화기는 전기 화재에 사용 하면 안된다'],a:1,e:'FCOM 1.45.2. Halon and Halon-Equivalent Fire Extinguishers\nThe extinguisher is effective on all types of fires, but is used primarily on\nelectrical, fuel, and grease fires.\nNote: The directions for use of the fire extinguisher are printed on the\nextinguisher.\nWARNING: If a Halon bottle or equivalent fire extinguisher is to be discharged\non the flight deck, all crew members in the flight deck must wear oxygen\nmasks and use 100% oxygen with emergency selected.\nFCOM 1.45.3. Water Fire Extinguishers\nWater fire extinguishers contain a solution of water mixed with antifreeze. Water\nfire extinguishers are to be used on fabric or paper fires only. They are not to\nbe used on electrical or grease fires.\nNote: The directions for use of the fire extinguisher are printed on the\nextinguisher.\nWARNING: Antifreeze compound has been added to the water which makes it\nunfit for drinking.\nl\ni\nl\nfi'},
{c:'GENERAL / DOORS',q:'Cockpit에는 2개의 Flashlight가 있다. 이에 대한 설명 중 옳은 것은?',o:['Battery는 충전식이다','Condition light가 red로 깜박이는 것은 충전 중이라는 표시이다','Switch가 없이 거치대에서 분리 하면 자동으로 들어온다','평상시 항공기 외부 점검에 사용 할 수 있다'],a:2,e:'FCOM 1.45.4. Flashlights\nFlashlights are stowed throughout the airplane.\nThese high intensity flashlights illuminate automatically when they are\nremoved from the stowage bracket.\nThe light can be extinguished only by placing the flashlight back into the stowage\nbracket.\nThe batteries cannot be recharged.\nCondition Light :\n• Illuminated (green) – One flash during test indicates a normal battery charge.\n• Illuminated (red) – One flash during test indicates the battery should be\nreplaced.\nFlashes every ten seconds when the battery has reached\nits end of life.'},
{c:'GENERAL / DOORS',q:'B787 항공기의 Maximum Steering angle 은?',o:['60°','70°','80°','90°'],a:1,e:'FCOM 1.10.4. Maximum Steering Angle 70°\nFCOM 14.20.3. Nosewheel Steering\nThe airplane is equipped with nosewheel steering powered by the center hydraulic\nsystem.\nPrimary steering control is provided by a nosewheel steering tiller for each pilot.\nLimited steering control is available through the rudder pedals.\nThe tillers can turn the nosewheels up to 70º in either direction.\nA pointer on the tiller assembly shows tiller position relative to the neutral setting.\nThe rudder pedals can be used to turn the nosewheels up to 8º in either\ndirection.\nTiller inputs are summed with rudder pedal inputs.'},
{c:'GENERAL / DOORS',q:'Nose gear landing lights 가 Illuminate 되지 않는 경우는?',o:['Nose landing gear is down','Nose landing gear lever is not down','Nose landing gear is down and locked','Nose landing gear is not down and locked'],a:3,e:'FCOM 1.30.5. LANDING Light Switches\nNote: The nose gear landing lights cannot illuminate when the nose landing\ngear is not down and locked.\nWhen the nose gear landing lights are ON, the taxi lights are also\nilluminated.'},
{c:'GENERAL / DOORS',q:'Cabin entry door가 Automatic mode에 있는 것을 확인하는 방법은?',o:['Ensure the door mode selector is directly on top of the red band, and the automatic symbolic indicator is illuminated steady and not flashing','Ensure the door mode selector is directly on top of the green band, and the automatic symbolic indicator is illuminated steady and not flashing','Ensure the door mode selector is directly on top of the red band, and the automatic symbolic indicator is illuminated steady and not steady','Ensure the door mode selector is directly on top of the green band, and the automatic symbolic indicator is illuminated steady and not flashing'],a:0,e:'FCOM 1.30.18. Door Mode Select Panel\n1 Automatic mode (Armed)\nDoor is in the automatic mode if:\n• the mode select lever is located fully in the RED band\n• the door automatic mode indicator is illuminated\n• the door manual mode indicator is not illuminated\nWhen the door operating handle is moved to the OPEN position:\n• the door is powered open • the slide/ raft deploys\n2 Automatic mode indicator\nIndication light, symbolic of emergency slide use, is illuminated when the door mechanism has\ncompletely reached the automatic mode position actuated by the door mode select lever. If the\ndoor is not completely in the automatic mode, both automatic and manual indicators flash.\n3 Manual mode indicator\n4 Manual mode (Disarmed)\n5 Door Mode Select Lever\n6 Unsafe area\n7 Door Mode Select Lever cover'},
{c:'GENERAL / DOORS',q:'Emergency lighting system은 Remote battery 로 작동 되며, Battery 충전은 항공기 Electrical system에 의해 유지 된다. 완전히 충전된 battery 몇 분간 작동하는가? FCOM 1.40.6',o:['Above 10 minutes','At least 10 minutes','Bellow 10 minutes','Exactly 10 minutes'],a:1,e:'FCOM 1.40.6. Emergency Lighting\nThe emergency lighting system is powered by remote batteries. Battery charge is\nmaintained by the airplane electrical system.\nA fully charged battery provides at least 10 minutes of operation.\nEmergency lighting is controlled by the emergency lights (EMER LIGHTS) switch on\nthe overhead panel. The switch can be used to manually activate or arm the\nsystem for automatic operation. The system monitors airplane power and\nautomatic operation occurs when required power fails or is turned off with the\nsystem armed.'},
{c:'GENERAL / DOORS',q:'전기적 화재가 발생 하였을 경우 바른 조치 사항이 아닌 것은?',o:['Remove the power source as soon as possible','Avoid discharging directly on persons due to possibility of suffocating effects','Discharge too close to fire as the discharge stream may scatter the fire','Avoid breathing vapors, fumes and heated smoke as much as possible'],a:2,e:'FCOM 1.45.3.\nCAUTION :\nFor electrical fires, remove the power source as soon as possible.\nAvoid discharging directly on persons due to possibility of suffocating effects.\nDo not discharge too close to fire as the discharge stream may scatter the fire.\nAs with any fire, keep away from the fuel source.\nAvoid breathing vapors, fumes and heated smoke as much as possible.'},
{c:'GENERAL / DOORS',q:'Passenger oxygen mask는 어는 고도에 도달하기 전에 자동으로 PSU에서 Drop 되는가?',o:['14,000 feet','14,000 feet or 14,500 feet which is first','Origin airfield altitude +1000 feet','Destination airfield altitude +1500 feet'],a:3,e:'FCOM 1.40.15. Passenger Cabin Oxygen System\nThe passenger cabin system provides oxygen to the main seating area, galleys, flight attendant stations,\noverhead crew rest areas, and lavatories.\nThe passenger cabin oxygen system is supplied by gaseous oxygen stored in small high pressure\ncylinders. The passenger and flight attendant oxygen masks and gaseous oxygen cylinders are located\nthroughout the cabin in passenger service units (PSU) fitted to the ceiling panels.\nFor each mask, normal breathing initiates the oxygen flow. The system regulates the pressure and\ndistributes oxygen to the masks by providing small pulses of oxygen to the user during inhalation. The\npulse duration is dependent on cabin altitude, longer pulses at higher altitudes and shorter ones at\nlower altitudes. Theoxygen cylinders are single use devices and once activated, provides oxygen until the\ncylinder is depleted.\nOxygen is available for approximately 60 minutes. ...'},
{c:'GENERAL / DOORS',q:'지상에서 선회를 시도 하여도 가능한 거리는?',o:['Away from an obstacle within 4.5 meters of the wing tip','Away from an obstacle within 4.7 meters of the wing tip','Away from an obstacle within 4.9 meters of the wing tip','Away from an obstacle within 5.1 meters of the wing tip'],a:0,e:'FCOM 1.10.4. HL7206 - HL8393\nCAUTION : Do not attempt to make a turn away from an obstacle within 15\nfeet (4.6 m) of the wing tip, or within 55 feet (16.8 m) of the nose.\nFCOM 1.10.5 60306 - 66879, HL8515 - HL8572\nCAUTION : Do not attempt to make a turn away from an obstacle within 15\nfeet (4.6 m) of the wing tip, or within 55 feet (16.8 m) of the nose.'},
{c:'GENERAL / DOORS',q:'Smoke detector에 나타나는 Color 별 현상 중 맞는 것은?',o:['Steady green - smoke detector has power and is operating properly','Blinking green - smoke has been detected','Steady red - detector has failed','Blinking red - maintenance is necessary'],a:0,e:'FCOM 1.46.15. Crew Rest Smoke Detection\nSmoke Detector - Status Indicator Light\nIlluminated (green) :\n• steady – smoke detector has power and is operating properly\n• blinking – maintenance is necessary\nIlluminated (red) :\n• steady – smoke has been detected\n• blinking – detector has failed'},
{c:'GENERAL / DOORS',q:'ELT(Emergency Locator Transmitter)는 감속이 감지 되거나, ELT switch를 On 위치에 두었을 경우 자동으로 Distress signals을 전송하는 주파수가 아닌 것은? FCOM 1.45.2',o:['121.5 MHZ,','243 MHZ','325 MHZ','406 MHZ'],a:2,e:'FCOM 1.45.1. Emergency Locator Transmitter (ELT)\nFuselage Mounted Emergency Locator Transmitter (ELT)\nAn ELT is mounted to the top of the fuselage in the passenger cabin area.\nThe ELT automatically transmits distress signals on 121.5 MHZ, 243 MHZ, and\n406 MHZ if a deceleration is sensed, or if the ELT switch is positioned to ON.\nThe EICAS alert message ELT ON is displayed if the transmitter is activated.\nThe ELT can be deactivated by placing the ELT switch to RESET momentarily (1 to\n3 seconds), then ARMED.'},
{c:'LIGHTING',q:'STORM light switch 를 on 하였을 경우 Override 하는 Light 는 무엇인가?',o:['All illuminated indicator lights','Runway turn off light','After dome light','All taxi light'],a:0,e:'FCOM 1.30.4. STORM Light Switch\nON – overrides normal controls and illuminates the following\nlights:\n• all illuminated indicator lights\n• glareshield flood lights\n• instrument panel flood lights\n• aisle stand flood lights\n• forward dome lights'},
{c:'LIGHTING',q:'STORM light switch 를 on 하였을 경우 영향을 받지 않는 Light 는 무엇인가?',o:['All illuminated indicator lights','Glareshield flood lights','After dome lights','Aisle stand flood lights'],a:2,e:'FCOM 1.30.4. STORM Light Switch\nON – overrides normal controls and illuminates the following\nlights:\n• all illuminated indicator lights\n• glareshield flood lights\n• instrument panel flood lights\n• aisle stand flood lights\n• forward dome lights'},
{c:'LIGHTING',q:'Master Brightness switch is pushed on 상태에서 Outer switch 를 Rotate 시 나타나는 현상은?',o:['Individual brightness control settings','limits fixed range of individual brightness controls','adjusts the brightness of all panel lights and displays (control: dome lights, flood lights, area lights, HUD, standby compass, handset and annunciators)','overrides individual brightness control settings'],a:3,e:'FCOM 1.30.4 MASTER Brightness (BRIGHT) Control (outer)\nRotate (when the MASTER BRIGHTNESS switch is pushed on) -\n• adjusts the brightness of all panel lights and displays\n(does not control: dome lights, flood lights, area lights, HUD, standby compass,\nhandset and annunciators)\n• overrides individual brightness control settings\n• limits adjustment range of individual brightness controls\n• has full adjustment range of all lights when all individual brightness controls are\nset to the center detent'},
{c:'LIGHTING',q:'Nose gear landing lights Switch 를 On 하였으나 illuminated 되지 않는 경우는?',o:['The nose landing gear is not down','The nose landing gear is unlocked','The nose landing gear is not down and locked','The nose landing gear is not down and unlocked'],a:2,e:'FCOM 1.30.5. LANDING Light Switches\nNote: The nose gear landing lights cannot illuminate when the nose landing\ngear is not down and locked.\nWhen the nose gear landing lights are ON, the taxi lights are also\nilluminated.'},
{c:'LIGHTING',q:'Emergency light switch 위치에 따른 현상 중 맞는 것은?',o:['OFF – prevents emergency lights system operation if airplane electrical power fails or is turned off.','ARMED – all emergency lights illuminate automatically if airplane electrical power fails or is turned on','DISARMED - ARMED – all emergency lights illuminate automatically if airplane electrical power fails or is turned off.','ON – Only floor passenger emergency lights illuminate'],a:0,e:'FCOM 1.30.8. Emergency (EMER) LIGHTS Switch\nOFF – prevents emergency lights system operation\nif airplane electrical power fails or is turned off.\nARMED – all emergency lights illuminate automatically\nif airplane electrical power fails or is turned off.\nON – all emergency lights illuminate.'},
{c:'LIGHTING',q:'Exterior light 중 B787 항공기에 장착되지 않은 것은?',o:['Strobe light','Logo light','Runway turn on light','Navigation light'],a:2,e:'FCOM 1.40.2. Exterior Lighting\nExterior lighting consists of these lights:\n• landing\n• runway turnoff\n• taxi\n• strobe\n• exterior passenger door viewing lights\n• beacon\n• navigation (position)\n• logo\n• wing leading edge illumination'},
{c:'LIGHTING',q:'Beacon lights의 Color 및 장착 위치 중 맞는 것은?',o:['Red - On the top of the wing','Red - On the top and bottom of the fuselage.','Red - On the top and bottom of the wing','Red - On the bottom of the wing'],a:1,e:'FCOM 1.40.3. Beacon Lights\nThe beacon lights are red anti-collision strobe lights located\non the top and bottom of the fuselage.'},
{c:'LIGHTING',q:'Seat belt signs switch 를 Auto 위치에 두었을 경우 Seat belt sign 은 언제 On 되는가?',o:['Flap lever at 1 or greater','Passenger oxygen off','Aircraft altitude above 10,000 feet','Cabin altitude above 10,000 feet'],a:3,e:'FCOM 1.40.6. Passenger Cabin Signs\nThe fasten seat belt signs are controlled by an overhead panel selector. The signs\nautomatically illuminate when the SEAT BELTS switch is in the AUTO position\nand :\n• landing gear not up and locked, or\n• flap lever at 5 or greater, or\n• airplane altitude below an airline defined altitude, or\n• cabin altitude above 10,000 feet, or\n• passenger oxygen on'},
{c:'MASTER WARNING',q:'EICAS(Engine Indication and Crew Alerting system) 에 시현 된 Warning message 를 Cancelled and removed 하는 방법은? FCOM 15.10.1',o:['Push the CAN/ RCL switch','A warning cannot be cancelled','Push the MASTER WARNING switch','Shut down the affected system'],a:1,e:'FCOM 15.10.1. Warning Messages\nDisplayed (red) :\n• highest priority alert messages\n• red alert messages remain displayed and cannot be canceled\nby pushing the CANC/RCL switch'},
{c:'MASTER WARNING',q:'다음 Alert level 중 Highest priority alert messages 를 고르시오.',o:['Advisory message','Caution message','Memo and Status Message','Warning message'],a:3,e:'FCOM 15.10.1. Warning Messages\nDisplayed (red) :\n• highest priority alert messages\n• red alert messages remain displayed and cannot be canceled\nby pushing the CANC/RCL switch'},
{c:'MASTER WARNING',q:'B787 항공기는 다른 기종과 달리 Evacuation horn cutoff button 이 없다. Horn cutoff 할 수 있는 방법은? FCOM 15.10.10',o:['Glare shield Panel의 Master WARNING/CAUTION Reset Switch','AFT Aisle Stand의 AURAL CANCEL button','G/S INHIBIT button','Overhead Panel의 FIRE/OVHT TEST button'],a:0,e:'FCOM 15.10.9. Master WARNING/CAUTION Reset Switches and Lights\nMaster WARNING/CAUTION Reset Switch\nPush :\n• extinguishes master WARNING lights\n• extinguishes master CAUTION lights\n• silences the aural that accompanies the EICAS warning messages:\n• CABIN ALTITUDE\n• FIRE\n• STABILIZER\n• EVAC COMMAND\n• CONFIG GEAR, if displayed because landing gear not down and locked,\nany thrust lever at idle, and radio altitude less than 800 feet\n• PILOT RESPONSE (as configured by the airline)'},
{c:'MASTER WARNING',q:'Time critical warning alert 가 아닌 것은?',o:['PULL UP','ENG FAIL','SPEEDBRAKE','GLIDESLOPE'],a:3,e:'FCOM 15.10.8. Time Critical Warnings\nENG FAIL (red) – ENGINE FAIL alert is occurring.\nPULL UP (red) – PULL UP alert is occurring.\nSPEEDBRAKE (red) – SPEEDBRAKE alert is occurring.\nWINDSHEAR (red) :\n• predictive WINDSHEAR AHEAD alert or immediate WINDSHEAR alert is occurring\n• all other GPWS alerts inhibited'},
{c:'MASTER WARNING',q:'EICAS event record switch 를 Push 하면 몇 개의 Event를 Memory 시킬 수 있나?',o:['Up to three','Up to four','Up to five','Up to six'],a:2,e:'FCOM 15.10.3. EICAS EVENT Record (RCD) Switch\nPush – records up to five EICAS events into memory.'},
{c:'MASTER WARNING',q:'Takeoff 시 Crew alerting inhibit 에 대한 설명 중 맞는 것은?',o:['Takeoff 후 부터 Status cue는 Inhibit 된다.','Cabin alert 는 Takeoff thrust set 후 부터 Inhibit 된다.','80 kts 이상에서 Reject takeoff 후 Ground speed 75 kts 이하가 되면 Inhibit 되었던 새로운 Caution 및 Advisory message와 Master Caution light, sound alert들이 나타난다','Master warning light와 Sound alert는 V1 또는 Rotation 중 나중에 발생되는 시점부터 Inhibit 된다.'],a:2,e:'FCOM 15.20.38. STATUS cue : Inhibit Begins – Engine start\nFCOM 15.20.39.\nAll EICAS communication alerts(message and chime) except: CABIN ALERT\nInhibit Begins – Either engine in takeoff thrust range\nFCOM 15.20.39. Master CAUTION lights, Beeper\nInhibit Ends - 400 feet radio altitude or 20 seconds after lift-off,\nwhichever occurs first.\nIf rejected takeoff initiated above 80 knots, inhibit continues until airspeed is\nless than 75 knots.\nFCOM 15.20.40. Master WARNING lights\nInhibit Begins – V1 or rotation, whichever occurs first.'},
{c:'MASTER WARNING',q:'Takeoff configuration warning 이 발생되는 조건이 아닌 것은?',o:['Leading edge and/or trailing edge flaps are not in takeoff position and either engine’s thrust is in the takeoff range on the ground','Parking brake is set and either engine\'s thrust is in the takeoff range on the ground','Rudder Trim not centered when either engine’s thrust is in the takeoff range on the ground','Nose gear is not centered when either engine’s thrust is in the takeoff range on the ground'],a:3,e:'FCOM 15.20.13. Takeoff Configuration Warnings\nThe takeoff configuration warning function is armed when:\n• airplane is on the ground, and\n• FUEL CONTROL switches are in RUN position, and\n• either engine thrust is in takeoff range, and\n• airspeed is less than V1\nFCOM 15.20.14. Takeoff Configuration Warning Message & Configuration\nCONFIG DOORS : Cargo and/or passenger doors are not secured and locked and either engine\'s thrust is\nin the takeoff range on the ground.\nCONFIG FLAPS : Leading edge and/or trailing edge flaps are not in takeoff position and either engine\'s thrust\nis in the takeoff range on the ground\nCONFIG PARKING BRAKE : Parking brake is set and either engine\'s thrust is in the takeoff range\non the ground.\nCONFIG RUDDER : Rudder Trim not centered when either engine’s thrust is in the takeoff range\non the ground.\nCONFIG SPOILERS : Speedbrake lever is not DOWN when either engine’s thrust is in the takeoff range\non the ground. ...'},
{c:'MASTER WARNING',q:'GPWS 에 대한 설명 중 맞는 것은?',o:['GPWS는 독립된 Computer가 있어 신뢰성을 증가하였다','이륙 중이거나 Go-Around 시 Flaps and/or gear up 상태에서 고도가 감소하면 EICAS 에 DON’T SINK message와 DON’T SINK, DON’T SINK aural alert가 발생한다','HUD에는 GPWS warning이 시현 되지 않는다','GPWS warning이 발생하면 AURAL CANCEL Switch를 사용하여 Aural alert들을 취소하고 비행에만 집중해야 한다'],a:1,e:'FCOM 15.20.23 Ground Proximity Warning System (GPWS) Introduction\nFCOM 15.20.23. GPWS Look–Ahead Obstacle and Terrain Mode\nA GPWS terrain database contains detailed terrain and man-made obstacle data.\nTerrain and obstacle data is not designed to be used as an independent\nnavigation aid.\nFCOM 15.20.28. DON’T SINK :\nAltitude loss with flaps and/or gear up after takeoff or go-around.\nFCOM 15.10.25 Terrain Display'},
